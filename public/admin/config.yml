  # --- Projeler -----------------------------------------------------------
  - name: projects
    label: Projeler
    label_singular: Proje
    folder: src/content/projects
    extension: md
    create: true
    # Proje dosya adları iki dilde AYNI (`dentasay.md`) — localize filtresi gerekmez.
    slug: '{{slug}}'
    identifier_field: title
    sortable_fields: [order, title, client]
    i18n: true
    fields:
      - { label: Proje Adı, name: title, widget: string, i18n: true }
      # Müşteri/marka adı, kategori slug'ı, yıl ve dış bağlantı dile göre değişmez.
      - { label: Müşteri, name: client, widget: string, i18n: duplicate }
      - { label: Kategori (slug), name: category, widget: string, i18n: duplicate }
      - { label: Kategori Etiketi, name: categoryLabel, widget: string, required: false, i18n: true }
      - { label: Özet, name: excerpt, widget: text, i18n: true }
      - { label: Kapak Görseli, name: cover, widget: image, required: false, i18n: duplicate }
      - { label: Öne Çıkan, name: featured, widget: boolean, default: false, i18n: duplicate }
      - { label: Sıra, name: order, widget: number, value_type: int, default: 0, i18n: duplicate }
      - label: Etiketler
        name: tags
        widget: list
        required: false
        i18n: true
        field: { label: Etiket, name: tag, widget: string }
      - { label: Yıl, name: year, widget: string, required: false, i18n: duplicate }
      - { label: Proje Bağlantısı, name: url, widget: string, required: false, i18n: duplicate }
      - label: SEO
        name: seo
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - { label: Başlık, name: title, widget: string, required: false, i18n: true }
          - { label: Açıklama, name: description, widget: text, required: false, i18n: true }
      # Case study — bu alan dolu olan projeler /projelerimiz/<slug> detay sayfası alır.
      - label: Detay Sayfası (Case Study)
        name: detail
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - { label: Konumlama Cümlesi, name: intro, widget: text, i18n: true }
          - { label: Tanıtım Paragrafı, name: description, widget: text, i18n: true }
          - { label: Dönem, name: period, widget: string, required: false, i18n: duplicate }
          - { label: Hero Görseli, name: heroImage, widget: image, required: false, i18n: duplicate }
          - label: Hizmet Çipleri
            name: services
            widget: list
            required: false
            i18n: true
            field: { label: Hizmet, name: service, widget: string }
          - label: Künye
            name: meta
            widget: list
            required: false
            i18n: true
            fields:
              - { label: Etiket, name: label, widget: string, i18n: true }
              - { label: Değer, name: value, widget: string, i18n: true }
          - label: Neler Yaptık?
            name: approach
            widget: object
            required: false
            i18n: true
            fields:
              - { label: Başlık, name: heading, widget: string, i18n: true }
              - { label: Metin, name: text, widget: text, i18n: true }
          - label: Bölümler
            name: sections
            widget: list
            required: false
            i18n: true
            fields:
              - { label: Başlık, name: heading, widget: string, i18n: true }
              - { label: Metin, name: text, widget: text, i18n: true }
              - label: Görseller
                name: images
                widget: list
                required: false
                i18n: duplicate
                field: { label: Görsel, name: image, widget: image }
              # Sessiz vitrin animasyonu — public/ altındaki kök-göreli dosya yolları.
              - label: Loop Video
                name: video
                widget: object
                required: false
                collapsed: true
                i18n: duplicate
                fields:
                  - { label: 'MP4 Yolu', name: mp4, widget: string, i18n: duplicate }
                  - { label: 'WebM Yolu', name: webm, widget: string, required: false, i18n: duplicate }
                  - { label: 'Poster Yolu', name: poster, widget: string, required: false, i18n: duplicate }
                  - { label: Genişlik (px), name: width, widget: number, value_type: int, required: false, i18n: duplicate }
                  - { label: Yükseklik (px), name: height, widget: number, value_type: int, required: false, i18n: duplicate }
          - label: Sonuç
            name: result
            widget: object
            required: false
            i18n: true
            fields:
              - { label: Başlık, name: heading, widget: string, i18n: true }
              - { label: Metin, name: text, widget: text, i18n: true }
      - { label: İçerik, name: body, widget: markdown, required: false, i18n: true }

  # --- Blog ---------------------------------------------------------------
  # --- Yasal Metinler -----------------------------------------------------
  # Dosya adları TR ve EN'de AYNIDIR (kvkk.md, privacy.md, cookies.md, terms.md);
  # URL slug'ları src/lib/i18n.ts > ROUTE_SLUGS içinde dile göre çevrilir. Bu yüzden
  # `| localize` KULLANILMAZ (bkz. pages koleksiyonundaki aynı not).
  #
  # DİKKAT — hukuki içerik: bu sayfalardaki şirket bilgileri, saklama süreleri ve
  # çerez tablosu gerçek duruma karşılık gelir; CMS'ten düzenlerken uydurma/varsayım
  # bilgi girilmemeli, izleme araçları değiştiğinde çerez politikası birlikte
  # güncellenmelidir (bkz. PRIVACY_TRACKING_INVENTORY.md).
  - name: legal
    label: Yasal Metinler
    label_singular: Yasal Metin
    folder: src/content/legal
    extension: md
    create: false
    delete: false
    slug: '{{slug}}'
    identifier_field: title
    i18n: true
    fields:
      - { label: Başlık, name: title, widget: string, i18n: true }
      - label: SEO
        name: seo
        widget: object
        i18n: true
        fields:
          - { label: Sayfa Başlığı, name: title, widget: string }
          - { label: Meta Açıklama, name: description, widget: text }
      - { label: Giriş Metni, name: intro, widget: text, required: false, i18n: true }
      - label: Son Güncelleme
        name: updated
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        i18n: duplicate
      - { label: İçerik, name: body, widget: markdown, i18n: true }

  - name: posts
    label: Blog Yazıları
    label_singular: Blog Yazısı
    folder: src/content/posts
    extension: md
    create: true
    # Blog dosya adı = o dildeki URL slug'ı, TR ve EN'de FARKLI → `| localize` şart.
    slug: '{{title | localize}}'
    identifier_field: title
    sortable_fields: [date, title]
    i18n:
      canonical_slug:
        key: translationKey
        value: '{{slug}}'
    fields:
      - { label: Başlık, name: title, widget: string, i18n: true }
      - { label: Kategori, name: category, widget: string, i18n: duplicate }
      # Hizmetlerdeki ile aynı: canonical_slug bu alanı kaydederken tr slug'ıyla ezer;
      # iki dil birlikte kaydedildiği için değerler eşit kalır, hreflang kopmaz.
      - { label: Çeviri Anahtarı, name: translationKey, widget: string, required: false, i18n: duplicate }
      - { label: Özet, name: excerpt, widget: text, i18n: true }
      - label: Tarih
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        i18n: duplicate
      - { label: Kapak Görseli, name: cover, widget: image, required: false, i18n: duplicate }
      - { label: Yazar, name: author, widget: string, default: Pixelon, i18n: duplicate }
      - label: Durum
        name: status
        widget: select
        default: published
        options: [draft, published]
        i18n: duplicate
      - { label: Öne Çıkan, name: featured, widget: boolean, default: false, i18n: duplicate }
      - label: SEO
        name: seo
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - { label: Sayfa Başlığı, name: title, widget: string, required: false }
          - { label: Meta Açıklama, name: description, widget: text, required: false }
      - { label: İçerik, name: body, widget: markdown, i18n: true }

  # --- Referanslar --------------------------------------------------------
  # Referanslar ve Ekip dile bağlı DEĞİL: klasörleri düz (`src/content/references/x.yml`),
  # dil alt klasörü yok. `i18n: false` varsayılan davranış zaten, ama açıkça yazıldı ki
  # üst düzeydeki `i18n:` bloğu bu koleksiyonlara sızıyor sanılmasın.
  - name: references
    label: Referanslar
    label_singular: Referans
    folder: src/content/references
    extension: yml
    format: yaml
    create: true
    slug: '{{slug}}'
    identifier_field: name
    i18n: false
    sortable_fields: [order, name]
    fields:
      - { label: Marka Adı, name: name, widget: string }
      - { label: Sektör, name: sector, widget: string, required: false }
      - { label: Logo, name: logo, widget: image }
      - { label: Sıra, name: order, widget: number, value_type: int, default: 0 }

  # --- Ekip ---------------------------------------------------------------
  - name: team
    label: Ekip
    label_singular: Ekip Üyesi
    folder: src/content/team
    extension: yml
    format: yaml
    create: true
    slug: '{{slug}}'
    identifier_field: name
