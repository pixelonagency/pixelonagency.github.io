# Pixelon — Sveltia CMS yapılandırması
#
# Bu dosya src/content/schemas.ts ve src/content/page-schema.ts içindeki zod şemalarının
# BİREBİR aynasıdır. Şemalardan biri değişirse burası da güncellenmelidir; aksi halde
# CMS'ten kaydedilen içerik build sırasında doğrulamadan geçemez veya sessizce silinir.
#
# Bu sözleşmeyi `tests/cms-config.test.ts` otomatik doğrular (gate'in parçası).
#
# YAML anchor notu: anchor'lar TEK bir alan nesnesi üzerinde tanımlanır ve liste öğesi
# olarak (`- *anchor`) yeniden kullanılır. Bir LİSTE anchor'ını liste öğesi yapmak iç içe
# dizi üretir ve CMS bunu okuyamaz — testler bu hatayı yakalar.

backend:
  name: github
  repo: pixelonagency/pixelonagency.github.io
  branch: main
  # GitHub OAuth aracısı — YALNIZCA "Sign In with GitHub" akışı için gerekli.
  # Kurulmadıysa giriş ekranındaki "Sign In Using Access Token" seçeneği ile kişisel
  # erişim token'ı (PAT) kullanılabilir; CMS o şekilde de tam çalışır.
  # Worker kurulumu: https://github.com/sveltia/sveltia-cms-auth
  base_url: https://sveltia-cms-auth.pixelon.workers.dev

# NOT: `local_backend` ve `locale` seçenekleri Sveltia'da DESTEKLENMİYOR (yok sayılır ve
# konsolda uyarı üretir) — bu yüzden tanımlanmadılar. Yerel düzenleme için giriş
# ekranındaki "Work with Local Repository" düğmesi kullanılır; bu, tarayıcının
# File System Access API'si üzerinden çalışır ve ek yapılandırma istemez.

# CMS'ten yüklenen görseller repoya bu klasöre yazılır.
#
# public_folder MUTLAK olmak zorundadır: Sveltia göreli yolları açıkça reddeder
# ("It must be an absolute path starting with /"). Proje kökünden mutlak yol yazıyoruz;
# Astro'nun `image()` çözümleyicisi bu biçimi de çözer ve görseli astro:assets ile
# optimize eder — yani hem CMS hem build tarafı memnun.
media_folder: src/assets/uploads
public_folder: /src/assets/uploads

publish_mode: simple
site_url: https://pixelon.com.tr
display_url: https://pixelon.com.tr

# --- Çok dillilik ---------------------------------------------------------
#
# `structure: multiple_folders` = her dil kendi klasöründe, koleksiyon klasörünün ALTINDA:
#     src/content/<koleksiyon>/<locale>/<ad>
# Depodaki gerçek düzen tam olarak budur (`src/content/services/tr/...`), bu yüzden bu değer
# seçildi. Kardeş seçenekler bize UYMAZ:
#   - multiple_files       → tek klasör, `about.en.yml` biçimi
#   - single_file          → tüm diller tek dosyada, iç içe locale anahtarlarıyla
#   - multiple_root_folders→ dil klasörü EN ÜSTTE: `src/content/<locale>/<koleksiyon>/...`
#     (eski adı `multiple_folders_i18n_root`; kullanımdan kaldırıldı)
#
# `folder:` değerleri dil klasörünü İÇERMEZ — Sveltia `<folder>/<locale>/` olarak kendisi ekler.
# Yalnızca "file" koleksiyonlarında yol elle yazıldığı için `{{locale}}` yer tutucusu gerekir.
#
# locales/default_locale, src/lib/i18n.ts içindeki LOCALES ve DEFAULT_LOCALE ile birebir
# aynı olmalıdır — `tests/cms-config.test.ts` bunu doğrular.
i18n:
  structure: multiple_folders
  locales: [tr, en]
  default_locale: tr

collections:
  # --- Site Ayarları (tekil) ---------------------------------------------
  - name: settings
    label: Site Ayarları
    # "file" koleksiyonlarında i18n hem koleksiyonda hem HER dosyada açılmalıdır;
    # yol elle yazıldığı için dil klasörü `{{locale}}` yer tutucusuyla belirtilir.
    # Yer tutucu unutulursa Sveltia sessizce `single_file` yapısına düşer ve iki dili
    # tek dosyaya iç içe yazmaya çalışır.
    i18n: true
    files:
      - name: site
        label: Genel Ayarlar
        i18n: true
        file: src/content/settings/{{locale}}/site.yml
        fields:
          # Telefon / e-posta / WhatsApp numarası dile göre değişmez → `duplicate`:
          # editör yalnızca varsayılan dilde girer, Sveltia diğer dile aynen kopyalar.
          - { label: Telefon, name: phone, widget: string, i18n: duplicate }
          - { label: E-posta, name: email, widget: string, i18n: duplicate }
          - { label: Adres, name: address, widget: string, i18n: true }
          - label: WhatsApp
            name: whatsapp
            widget: object
            i18n: true
            fields:
              - { label: Numara (yalnızca rakam), name: number, widget: string, i18n: duplicate }
              - { label: Varsayılan Mesaj, name: defaultMessage, widget: text, i18n: true }
          # Sosyal hesaplar iki dilde de aynı (marka adı + aynı URL) → tümü `duplicate`.
          - label: Sosyal Medya
            name: social
            widget: list
            required: false
            i18n: duplicate
            fields:
              - { label: Ad, name: label, widget: string }
              - { label: Kısaltma, name: short, widget: string, required: false }
              - { label: Bağlantı, name: url, widget: string }
          # Yasal bağlantıların ETİKETİ çevriliyor (href aynı kalsa da) → `true`.
          - label: Yasal Bağlantılar
            name: legalLinks
            widget: list
            required: false
            i18n: true
            fields:
              - { label: Etiket, name: label, widget: string }
              - { label: Yol, name: href, widget: string }
          - { label: Footer Tanıtım Metni, name: footerIntro, widget: text, required: false, i18n: true }
          - { label: Telif Satırı, name: copyright, widget: string, required: false, i18n: true }

  # --- Hizmetler ----------------------------------------------------------
  - name: services
    label: Hizmetler
    label_singular: Hizmet
    # `folder` dil klasörünü İÇERMEZ — Sveltia `src/content/services/<locale>/` yapar.
    folder: src/content/services
    extension: yml
    format: yaml
    create: true
    # Hizmet dosya adı = o dildeki URL slug'ı, yani TR ve EN'de FARKLI
    # (`web-tasarim-ve-yazilim.yml` ↔ `web-design-and-development.yml`).
    # `| localize` filtresi olmadan Sveltia her dilde AYNI dosya adını bekler ve iki dili
    # birbirine bağlayamaz — TR ve EN ayrı ayrı, çevirisi eksik girdiler gibi görünür.
    slug: '{{title | localize}}'
    identifier_field: title
    summary: '{{order}} — {{title}}'
    sortable_fields: [order, title]
    # Dosya adları ayrıştığı için bağ, dosyaya yazılan bir özellik üzerinden kurulur.
    # Anahtar adı ve değeri Sveltia'nın varsayılanıyla aynı; sözleşmeyi görünür kılmak için
    # açıkça yazıldı. Koleksiyon düzeyindeki `i18n` nesnesi üst düzeydeki bloğun ÜZERİNE
    # yazılır (Object.assign) — structure/locales/default_locale global bloktan miras kalır.
    # Bu alan, `src/pages/[...path].astro` içinde hreflang eşleştirmesi için okunan alanın
    # ta kendisidir.
    i18n:
      canonical_slug:
        key: translationKey
        value: '{{slug}}'
    fields:
      - { label: Hizmet Adı, name: title, widget: string, i18n: true }
      - { label: Menü Etiketi, name: navLabel, widget: string, i18n: true }
      # Diller arası bağ anahtarı — iki dilde AYNI olmak zorunda, yoksa hreflang kopar.
      # `duplicate`: varsayılan dilde girilir, diğer dilde salt okunur kopya.
      #
      # DİKKAT: bu koleksiyonda slug localize edildiği için Sveltia kaydederken bu alanı
      # varsayılan dilin (tr) slug'ıyla EZER — ör. elle yazılmış `web-design` yerine
      # `web-tasarim-ve-yazilim` yazar. Zararsızdır: Sveltia tüm dilleri her zaman birlikte
      # kaydeder (save_all_locales), dolayısıyla iki dosya aynı değeri alır ve
      # `[...path].astro` yalnızca değerlerin EŞİT olmasını arar.
      - { label: Çeviri Anahtarı, name: translationKey, widget: string, required: false, i18n: duplicate }
      - { label: Sıra, name: order, widget: number, value_type: int, default: 0, i18n: duplicate }
      - &f_seo
        label: SEO
        name: seo
        widget: object
        collapsed: true
        i18n: true
        fields:
          - { label: Sayfa Başlığı (title), name: title, widget: string }
          - { label: Meta Açıklama, name: description, widget: text }
      # Görsel yolu dile bağlı değil → `duplicate`.
      - { label: Kapak Görseli, name: cover, widget: image, required: false, i18n: duplicate }
      # Aşağıdaki bölümlerin tamamı metin. Nesne/liste alanında `i18n: true` ALT ALANLARA
      # miras kalır, bu yüzden her alt alanı tek tek işaretlemeye gerek yoktur.
      - label: Hero
        name: hero
        widget: object
        i18n: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - label: Başlık Satırları
            name: headingLines
            widget: list
            field: { label: Satır, name: line, widget: string }
          - { label: Giriş Metni, name: lead, widget: text }
          - { label: Alt Slogan, name: tagline, widget: string, required: false }
          - { label: WhatsApp Mesajı, name: whatsappMessage, widget: text }
      - label: Giriş Bölümü
        name: intro
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Başlık, name: heading, widget: string }
          - { label: Gövde, name: body, widget: text }
          - { label: Vurgu Cümlesi, name: highlight, widget: text, required: false }
      - label: Neden Pixelon?
        name: why
        widget: object
        collapsed: true
        i18n: true
        fields:
          - &f_eyebrow { label: Eyebrow (üst etiket), name: eyebrow, widget: string }
          - &f_heading { label: Başlık, name: heading, widget: string }
          - &f_lead { label: Giriş Metni, name: lead, widget: text, required: false }
          - &f_titled_items
            label: Kartlar
            name: items
            widget: list
            fields: &titled_item_fields
              - { label: Başlık, name: title, widget: string }
              - { label: Açıklama, name: description, widget: text }
      - label: Hizmet Kapsamı
        name: scope
        widget: object
        collapsed: true
        i18n: true
        fields: [*f_eyebrow, *f_heading, *f_lead, *f_titled_items]
      - label: Platformlar
        name: platforms
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields: [*f_eyebrow, *f_heading, *f_lead, *f_titled_items]
      - label: İlkeler
        name: principles
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields: [*f_eyebrow, *f_heading, *f_lead, *f_titled_items]
      - label: Karşılaştırma
        name: comparison
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - *f_eyebrow
          - *f_heading
          - *f_lead
          - *f_titled_items
          - { label: Kapanış Notu, name: note, widget: text, required: false }
      - label: İçerik Türleri
        name: contentTypes
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - *f_eyebrow
          - *f_heading
          - *f_lead
          - label: Maddeler
            name: items
            widget: list
            field: { label: Madde, name: item, widget: string }
      - label: Süreç
        name: process
        widget: object
        collapsed: true
        i18n: true
        fields:
          - *f_eyebrow
          - *f_heading
          - { label: Adımlar, name: steps, widget: list, fields: *titled_item_fields }
      - label: Proje Vitrini
        name: projects
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - *f_eyebrow
          - *f_heading
          - *f_lead
          - label: Projeler
            name: items
            widget: list
            fields:
              - { label: Üst Etiket, name: eyebrow, widget: string, required: false }
              - { label: Başlık, name: title, widget: string }
              - { label: Açıklama, name: description, widget: text }
              - { label: Bağlantı, name: href, widget: string, required: false }
      - label: Neden Önemli
        name: value
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - *f_eyebrow
          - *f_heading
          - *f_lead
          - label: Maddeler
            name: bullets
            widget: list
            required: false
            field: { label: Madde, name: item, widget: string }
      - label: Sektörler
        name: sectors
        widget: object
        required: false
        collapsed: true
        i18n: true
        fields:
          - *f_eyebrow
          - *f_heading
          - { label: Gövde, name: body, widget: text }
      - label: Kapanış Çağrısı
        name: cta
        widget: object
        collapsed: true
        i18n: true
        fields: [*f_eyebrow, *f_heading, *f_lead]
      - label: Sıkça Sorulan Sorular
        name: faq
        widget: object
        collapsed: true
        i18n: true
        fields:
          - *f_eyebrow
          - *f_heading
          - &f_faq_items
            label: Sorular
            name: items
            widget: list
            fields:
              - { label: Soru, name: question, widget: string }
              - { label: Cevap, name: answer, widget: text }

  # --- Sayfalar (bölüm kurgusu) ------------------------------------------
  - name: pages
    label: Sayfalar
    label_singular: Sayfa
    folder: src/content/pages
    extension: yml
    format: yaml
    create: true
    # Sayfa dosya adları TR ve EN'de AYNIDIR (`home.yml`, `about.yml`, ...); URL slug'ı
    # `src/lib/i18n.ts > ROUTE_SLUGS` içinde ayrı tutulur. Dosya adı ortak olduğu için
    # `| localize` filtresi KULLANILMAZ — Sveltia iki dosyayı doğrudan adla eşler ve
    # dosyalara `translationKey` gibi ek bir bağ özelliği yazmasına gerek kalmaz.
    slug: '{{slug}}'
    identifier_field: seo.title
    i18n: true
    fields:
      - *f_seo
      - { label: WhatsApp Mesajı, name: whatsappMessage, widget: text, required: false, i18n: true }
      # Bölüm listesi tamamen çevrilir. `i18n: true` bir listede TÜM alt alanları dile
      # bağlar; böylece TR ve EN sayfaları farklı bölüm kurgusuna sahip olabilir
      # (mevcut içerikte de öyleler).
      - label: Bölümler
        name: sections
        widget: list
        i18n: true
        types:
          - label: Hero
            name: hero
            widget: object
            fields:
              - &s_eyebrow { label: Eyebrow (üst etiket), name: eyebrow, widget: string, required: false }
              - &s_anchor { label: Bölüm Bağlantı Kimliği (anchor), name: anchor, widget: string, required: false }
              - &s_background
                label: Zemin
                name: background
                widget: select
                default: dark
                options: [dark, light]
              - label: Başlık Satırları
                name: headingLines
                widget: list
                field: { label: Satır, name: line, widget: string }
              - &s_lead { label: Giriş Metni, name: lead, widget: text, required: false }
              - { label: Alt Slogan, name: tagline, widget: string, required: false }
              - label: Hizalama
                name: align
                widget: select
                required: false
                options: [start, center]
              - label: Güven Rozetleri
                name: chips
                widget: list
                required: false
                field: { label: Rozet, name: chip, widget: string }
              - label: Breadcrumb
                name: breadcrumb
                widget: list
                required: false
                fields:
                  - { label: Etiket, name: label, widget: string }
                  - { label: Bağlantı, name: href, widget: string, required: false }
              - &s_ctas
                label: Butonlar
                name: ctas
                widget: list
                required: false
                fields:
                  - { label: Etiket, name: label, widget: string }
                  - { label: Bağlantı, name: href, widget: string }
                  - label: Görünüm
                    name: variant
                    widget: select
                    default: primary
                    options: [primary, outline, link]
                  - label: İkon
                    name: icon
                    widget: select
                    required: false
                    options: [whatsapp, phone, arrow]
                  - { label: Yeni sekmede aç, name: external, widget: boolean, default: false }
              - &s_image { label: Görsel, name: image, widget: image, required: false }
              - &s_image_alt { label: Görsel Alt Metni, name: imageAlt, widget: string, required: false }

          - label: Kart Izgarası
            name: cards
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - { label: Başlık, name: heading, widget: string, required: false }
              - *s_lead
              - { label: Sütun Sayısı, name: columns, widget: number, value_type: int, required: false }
              - label: Görünüm
                name: kind
                widget: select
                required: false
                options: [grid, tinted, panels]
              - { label: Kapanış Notu, name: note, widget: text, required: false }
              - label: Kartlar
                name: items
                widget: list
                fields:
                  - { label: Üst Etiket, name: eyebrow, widget: string, required: false }
                  - { label: Başlık, name: title, widget: string }
                  - { label: Açıklama, name: description, widget: text }
                  - { label: Bağlantı, name: href, widget: string, required: false }
                  - label: İkon
                    name: icon
                    widget: select
                    required: false
                    options: [health, tourism, ecommerce, construction, sme, education]
                  - {
                      label: 'Sabit Öne Çıkar (kalıcı lime çerçeve)',
                      name: featured,
                      widget: boolean,
                      default: false,
                      required: false,
                    }
                  - { label: 'Yıldız Puanı (1-5)', name: rating, widget: number, value_type: int, required: false }

          - label: Süreç Adımları
            name: steps
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - &s_heading { label: Başlık, name: heading, widget: string }
              - *s_lead
              - { label: Adımlar, name: items, widget: list, fields: *titled_item_fields }

          - label: Madde Listesi
            name: bullets
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - *s_heading
              - *s_lead
              - label: Görünüm
                name: kind
                widget: select
                required: false
                options: [grid, split]
              - label: Maddeler
                name: items
                widget: list
                field: { label: Madde, name: item, widget: string }

          - label: Kayan Şerit
            name: marquee
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - label: Görünüm
                name: kind
                widget: select
                default: strip
                options: [strip, wordmarks]
              - { label: Başlık, name: heading, widget: string, required: false }
              - *s_lead
              - { label: Tur Süresi (saniye), name: speed, widget: number, required: false }
              - label: Öğeler
                name: items
                widget: list
                field: { label: Öğe, name: item, widget: string }

          - label: 'Global (Ülke Şeridi + Harita)'
            name: worldMap
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - *s_heading
              - *s_lead
              - label: Ülkeler
                name: countries
                widget: list
                fields:
                  - { label: Ad, name: label, widget: string }
                  - { label: Bayrak (emoji), name: flag, widget: string }
                  - { label: Öne Çıkar, name: highlighted, widget: boolean, default: false, required: false }
              - { label: Kapanış Cümlesi, name: closingLine, widget: text, required: false }
              - { label: Harita Görseli Alt Metni, name: mapImageAlt, widget: string, required: false }

          - label: Metin
            name: text
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - &s_heading_opt { label: Başlık, name: heading, widget: string, required: false }
              - { label: Gövde, name: body, widget: text }
              - { label: Vurgu Cümlesi, name: highlight, widget: text, required: false }
              - label: Düzen
                name: layout
                widget: select
                required: false
                options: [stack, split, center]
              - *s_image
              - *s_image_alt

          - label: Rakamlar (sayaç)
            name: stats
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - *s_heading_opt
              - *s_lead
              - label: Rakamlar
                name: items
                widget: list
                fields:
                  - { label: Değer (sayı), name: value, widget: number, value_type: int }
                  - { label: Ön Ek, name: prefix, widget: string, required: false }
                  - { label: Son Ek, name: suffix, widget: string, required: false }
                  - { label: Etiket, name: label, widget: string }
                  - { label: Açıklama, name: description, widget: text, required: false }

          - label: Sıkça Sorulan Sorular
            name: faq
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - *s_heading
              - *s_lead
              - *f_faq_items

          - label: Kapanış Çağrısı
            name: cta
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_heading
              - *s_lead
              - *s_ctas
              - label: Görünüm
                name: kind
                widget: select
                required: false
                options: [classic, spot]

          - label: Referans Logoları
            name: logos
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - *s_heading_opt
              - *s_lead

          - label: Projeler
            name: projects
            widget: object
            fields:
              - *s_eyebrow
              - *s_anchor
              - *s_background
              - *s_ctas
              - *s_heading
              - *s_lead
              - { label: Meta Satırı (board), name: tagline, widget: string, required: false }
              - &s_limit { label: Adet Sınırı, name: limit, widget: number, value_type: int, required: false }
              - { label: Kategori Filtresi Göster, name: showFilters, widget: boolean, default: false }
              - label: Görünüm
                name: kind
                widget: select
                required: false
                options: [grid, board]
              - &s_cta_label { label: Buton Etiketi, name: ctaLabel, widget: string, required: false }
