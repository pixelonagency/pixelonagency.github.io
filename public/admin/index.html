<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Pixelon İçerik Yönetimi</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!--
      Sveltia CMS — Git tabanlı headless CMS (Decap/Netlify CMS uyumlu).

      Koleksiyon tanımları config.yml içindedir ve src/content/schemas.ts +
      src/content/page-schema.ts dosyalarındaki zod şemalarının birebir aynasıdır.

      Sürüm ve SRI: script tam sürüme sabitlenmiş ve subresource integrity ile
      doğrulanıyor — CDN ele geçirilse dahi değiştirilmiş dosya çalıştırılmaz.
      Sürüm yükseltirken integrity hash'i de yenileyin:
        curl -sSL https://unpkg.com/@sveltia/cms@<sürüm>/dist/sveltia-cms.js \
          | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <!--
      `type="module"` KULLANILMAZ: Sveltia paketi bir ES modülü değil; module olarak
      yüklenirse JavaScript API'si beklenmedik davranıyor (konsolda uyarı verir).
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.180.1/dist/sveltia-cms.js"
      integrity="sha384-nsTvaoGO8XNB91u5cssx80796nRkK4mY/zGnirQLk68nmXUCaQVqYJ8B/mEOG7jr"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
