name: Web Tasarım
intro: |-
  Bir web sitesinin işe yarayıp yaramadığını belirleyen şey görsel beğeni değil, ziyaretçinin sayfada ne kadar hızlı yön bulduğu ve beklenen adımı atıp atmadığı. Güzel görünen ama talep getirmeyen siteler bu yüzden var: sorun genellikle tasarımda değil, kurguda ve ölçümde.

  Dönüşüm getirmeyen bir sitede zincir çoğu zaman tek bir yerde kopuyor — ölçüm kurulmamış, trafik yanlış, mesaj net değil ya da mobil deneyim bozuk. Tasarımı yenilemek bu kopukluğu kendiliğinden düzeltmiyor; teşhis konmadan yapılan yenileme aynı sorunu yeni bir görünümle sürdürüyor.

  Bu kategorideki yazılar kurumsal sitede aranan temel özelliklerden landing page'in ne zaman gerektiğine, fiyatı neyin belirlediğinden ajans seçerken nelere bakılacağına kadar web projelerinin karar noktalarını topluyor.
