name: SEO
intro: |-
  SEO, arama motorlarında para ödemeden görünür olma çalışmasının tamamı. Reklamdan farkı, görünürlüğü satın almak yerine kazanmanız ve kazanılan konumun bir süre kendiliğinden çalışmaya devam etmesi.

  Çalışma üç ayak üzerinde duruyor: arama motorunun sayfaları sorunsuz tarayabilmesi, içeriğin arayan kişinin sorusunu gerçekten cevaplaması ve sitenin alanında güvenilir bulunması. Üçü birlikte yürümediğinde sonuç gelmiyor; teknik taraf bozuksa en iyi içerik bile görünmüyor, içerik zayıfsa teknik mükemmellik sıralama getirmiyor.

  Bu kategorideki yazılar SEO'nun ne olduğundan başlayıp süreye, blogun bu işteki rolüne ve tek bir yazının nasıl yazılacağına kadar zinciri sırayla ele alıyor. En sık sorulan iki soruya — "ne kadar sürede sonuç verir" ve "blog gerçekten işe yarıyor mu" — ayrı yazılarda cevap verdik.
