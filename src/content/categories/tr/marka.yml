name: Marka
intro: |-
  Marka bir logodan ibaret değil. Logo, markanın ne söylediğine karar verildikten sonra o sözü taşıyan işaret; renk, yazı karakteri, dil ve her temas noktasındaki tutarlılık ise o sözün tekrar tekrar aynı şekilde duyulmasını sağlıyor.

  Bu yüzden kimlik çalışması tasarımdan önce bir konumlandırma kararıyla başlıyor: kime konuşuyoruz, rakiplerden neyle ayrılıyoruz, neye bilerek hayır diyoruz? Görsel sistem bu cevaplardan çıkıyor ve bir kılavuzla korunuyor.

  Bu kategorideki yazılar marka konumlandırmasından logo türlerine, logo tasarım sürecinden kurumsal kimlik kılavuzuna, kartvizit, antetli kağıt, broşür ve ambalaj gibi uygulamalardan marka yenilemeye uzanıyor.
