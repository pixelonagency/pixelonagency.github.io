name: Sosyal Medya
intro: |-
  Sosyal medyada asıl mesele takipçi sayısı değil, üretilen içeriğin markaya talep getirip getirmediği. Yüksek takipçili ama hiç talep üretmeyen hesaplar da, küçük ama düzenli iş getiren hesaplar da aynı platformda çalışıyor; farkı yaratan şey kurgu.

  İki şey belirleyici oluyor. Birincisi süreklilik: takvimi olmayan hesaplarda üretim dalgalanıyor ve dalgalanan hesap büyümüyor. İkincisi format seçimi: kısa video yeni kitleye ulaşmanın ücretsiz yolu, gönderi ve hikâye ise mevcut takipçiyi karara taşıyor. Bu ikisi birbirinin yerine geçmiyor.

  Bu kategorideki yazılar içerik takvimi kurmaktan Reels üretimini sürdürülebilir kılmaya, Instagram profilinin nasıl düzenleneceğinden ajansla çalışmanın ne anlama geldiğine kadar sosyal medya yönetiminin pratik tarafını ele alıyor.
