name: Healthcare Marketing
intro: |-
  Healthcare marketing works under constraints other sectors never face: restricted targeting, strict creative review, long decision cycles and limited measurement data. Those constraints are not obstacles to work around — they are the design brief, and the brands that do well are the ones that move the effort into the creative, the landing page and the response process.

  Trust does most of the work here. Patients research several sources before deciding, and for clinics treating people who travel in from abroad the decision is made almost entirely on what the website, the doctor profiles and the first reply communicate. Reach without trust produces enquiries that never convert.

  The articles in this category cover building a strategy across web, content and advertising, running compliant campaigns in regulated markets, and earning international patient trust in health tourism.
