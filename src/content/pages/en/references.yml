seo:
  title: Our References | Pixelon 360° Digital Agency
  description: >-
    From healthcare to finance, e-commerce to non-profits, we partner with brands across industries. Explore the brands Pixelon works with.
whatsappMessage: Hello Pixelon, I am writing from your References page.

sections:
  # 1 — HERO
  - type: hero
    background: dark
    eyebrow: Our References
    headingLines:
      - "A Partner in Every Brand's Growth Journey."
    lead: >-
      We work with brands from healthcare to finance, e-commerce to non-profits — supporting each goal end to end, from strategy and design to advertising and production. To us, every reference is a story we grew together.
    breadcrumb:
      - label: Home
        href: /en/
      - label: References
    ctas:
      - label: Explore Our Projects
        href: /en/projects
        variant: primary
      - label: Contact Us
        href: /en/contact
        variant: outline

  # 2 — BRAND WALL
  - type: logos
    kind: wall
    anchor: brands
    background: dark
    eyebrow: Brands We Work With
    heading: What Trust Looks Like
    lead: >-
      From small businesses to enterprise brands, we bring the same care to every partner, at every scale.

  # 3 — HOW WE WORK
  - type: text
    anchor: how-we-work
    background: light
    layout: split
    eyebrow: How We Work
    heading: A reference is not a delivered project; it is an ongoing relationship.
    body: >-
      We met most of the brands on this page through a single project — a website, a campaign, a brand identity. Over time those engagements grew to cover measurement, content and advertising as well. A brand becoming our reference means the work was not just delivered, but that its results are still being tracked together.


      The spread of industries here is deliberate: healthcare and health tourism, e-commerce, finance, non-profits. What works in one sector is often untried in the next. The multilingual patient communication flow we built for a health tourism clinic and the post-purchase flow of an e-commerce brand are, technically, two versions of the same problem.


      If you want to see why a piece of work was built the way it was, we wrote the starting point of each engagement on our [projects](/en/projects/) page. The services that run alongside each other are set out on the [services](/en/services/) page.
    highlight: The same care on the smallest project as on the largest.

  # 4 — CLOSING CTA
  - type: cta
    kind: spot
    anchor: contact
    background: dark
    eyebrow: Be our next reference
    heading: Shall we grow your brand together?
    lead: >-
      Tell us your goal — and let's map the road ahead with a team that unites strategy, design and technology under one roof.
    ctas:
      - label: Tell Us About Your Project →
        href: /en/contact
        variant: primary
      - label: Message Us on WhatsApp
        href: https://wa.me/905065229034
        variant: outline
