      We work with brands from healthcare to finance, e-commerce to non-profits — supporting each goal end to end, from strategy and design to advertising and production. To us, every reference is a story we grew together.
    breadcrumb:
      - label: Home
        href: /en/
      - label: References
    ctas:
      - label: Explore Our Projects
        href: /en/projects
        variant: primary
      - label: Contact Us
        href: /en/contact
        variant: outline

  # 2 — BRAND WALL
  - type: logos
    kind: wall
    anchor: brands
    background: dark
    eyebrow: Brands We Work With
    heading: What Trust Looks Like
    lead: >-
      From small businesses to enterprise brands, we bring the same care to every partner, at every scale.

