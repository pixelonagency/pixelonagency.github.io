seo:
  title: Our References | Pixelon 360° Digital Agency
  description: >-
    From healthcare to finance, e-commerce to non-profits, we partner with brands across industries. Explore the brands Pixelon works with.
whatsappMessage: Hello Pixelon, I am writing from your References page.

sections:
  # 1 — HERO
