seo:
  title: Pixelon | 360° Digital Marketing Agency Istanbul
  description: >-
    Pixelon delivers 360° digital solutions across web design, social media,
    digital advertising, SEO, e-commerce, brand design and health tourism.

whatsappMessage: Hello Pixelon, I would like to learn more about your digital marketing services for my brand.

sections:
  # 1 — HERO
  - type: hero
    background: dark
    eyebrow: Your 360° Digital Marketing Partner
    # Words wrapped in *stars* are printed in lime (accent) — see src/lib/highlight.ts
    headingLines:
      - "We Grow Your Brand with *Strategy*, *Design* and *Technology*."
    lead: |-
      Pixelon is a 360° digital marketing agency that turns creative ideas into powerful design and digital strategy into measurable results. From web design to social media management, from performance advertising to SEO, we bring every digital solution your brand needs together under one roof.
    tagline: Have an idea? Let us grow it together.
    chips:
      - '*15+* Years of Experience'
      - '*180+* Completed Projects'
      - '*50+* Brand Partnerships'
      - Experience in Turkish and Global Markets
    ctas:
      - label: Reach Us on WhatsApp
        href: https://wa.me/905065229034
        variant: primary
        icon: whatsapp
        external: true
      - label: Explore Our Projects
        href: /en/projects
        variant: outline
      - label: Call Us Now
        href: 'tel:+905065229034'
        variant: link

  # 2 — LIME MARQUEE (decorative strip, below the hero)
  - type: marquee
    kind: strip
    background: dark
    items: [Strategy, Design, Technology, Performance, Growth, Conversion]

  # 3 — REFERENCES (logo marquee, from the references collection)
  - type: logos
    background: light
    anchor: referanslar
    eyebrow: Our References
    heading: Strong Brands, Long-Lasting Partnerships
    lead: |-
      Every brand has its own story, goals and needs. At Pixelon we never approach a project with ready-made templates; we build strategies designed for that specific brand. Through work that reaches from Turkey to the rest of the world, we accompany corporate brands, healthcare organisations, e-commerce ventures and growing businesses on their digital transformation journey.
    ctas:
      - label: See All Our References →
        href: /en/projects
        variant: outline

  # 4 — WHAT PIXELON DOES
  - type: text
    background: light
    anchor: pixelon
    eyebrow: What Does Pixelon Do?
    heading: We Make Your Idea Visible, Your Brand Strong and Your Results Measurable.
    body: |-
      Pixelon does more than produce good-looking design. We develop integrated solutions that connect brands with the right audience, help them build a strong position in the digital world and generate measurable returns on their investment.

      We start by understanding your brand, your industry and your audience. Then we bring strategy, design, content, technology and performance marketing together around a single goal. Instead of disconnected efforts, the result is a sustainable growth system in which all of your digital channels move as one.

  # 5 — Dark highlight box inside the "What Pixelon Does" section
  # NOTE: the SECTION itself is LIGHT (white) — a dark card sits inside it.
  # `background: dark` would turn the whole section black and lose the
  # card look (white margin + rounded corners).
  - type: cta
    background: light
    heading: >-
      We do not work to make you merely visible; we work to make you *the
      brand people choose*.
    ctas:
      - label: Get to Know Pixelon
        href: /en/about-us
        variant: primary

  # 6 — SERVICES (from the services collection; 10 services listed in the reference)
  - type: services
    background: dark
    anchor: hizmetler
    eyebrow: 360° Digital Solutions
    heading: Every Digital Solution Your Brand Needs, from a Single Team
    lead: |-
      We treat every digital touchpoint of your brand as one strategic whole. From design to advertising, from content to technology, we manage all the solutions you need from a single centre.
    ctas:
      - label: Discover All Our Services
        href: /en/services
        variant: primary

  # 7 — PROJECTS (from the projects collection; 3 selected projects in the reference)
  - type: projects
    background: light
    anchor: projeler
    eyebrow: Selected Projects
    heading: We Do Not Just Design, We Add Value to Brands.
    lead: |-
      Every project is a new journey for us. By analysing a brand's current position, goals and needs, we produce solutions that are aesthetic, functional and results-driven.
    limit: 3
    showFilters: false
    # ctaLabel/ctaHref is the section button below the grid in ProjectsSection —
    # the in-card "View Project →" link comes from the component itself.
    ctaLabel: View All Our Projects
    ctaHref: /en/projects

  # 8 — BY THE NUMBERS
  - type: stats
    background: dark
    eyebrow: Experience, Output and Results
    heading: >-
      We Add Value to the Digital Transformation and Marketing Strategies of
      Brands.
    items:
      - value: 15
        suffix: '+'
        label: Years of industry experience
        description: Years of hands-on experience in digital design, brand communication and marketing.
      - value: 180
        suffix: '+'
        label: Completed projects
        description: Digital projects successfully delivered for a wide range of industries and needs.
      - value: 120
        suffix: '+'
        label: Success stories
        description: Brands whose digital visibility, communication and performance we have improved.
      - value: 50
        suffix: '+'
        label: Brand partnerships
        description: Corporate brands we work with across Turkish and global markets.
      - value: 500
        suffix: '+'
        label: Creative ideas and cups of coffee
        description: >-
          Because behind every strong idea there is curiosity, research, teamwork
          and a little coffee.
    ctas:
      - label: ☕ Let Us Talk About Your Project Over Coffee
        href: /en/contact
        variant: outline

  # 9 — INDUSTRIES
  - type: cards
    background: light
    eyebrow: We Understand Your Industry
    heading: Not the Same Solution for Every Industry, but a Strategy Built for Your Brand.
    lead: |-
      Every industry has its own audience, purchase journey and tone of voice. In the sectors where we have proven experience, Pixelon analyses user behaviour and market dynamics to build solutions tailored to your brand.
    columns: 3
    items:
      - title: Healthcare and Clinic Brands
        icon: health
        description: |-
          We build digital systems that strengthen patient trust, comply with ethical communication rules and support appointment conversion.
      - title: Health Tourism Companies
        icon: tourism
        description: |-
          We develop multilingual websites, advertising campaigns and patient communication processes designed to attract international patients.
      - title: E-Commerce Brands
        icon: ecommerce
        featured: true
        description: |-
          We create solutions that present products better, reach the right audience and increase sales conversion.
      - title: Construction and Real Estate Companies
        icon: construction
        description: |-
          We prepare corporate websites and digital marketing programmes that convey the trust, quality and investment value of your projects.
      - title: SME and Corporate Service Brands
        icon: sme
        description: |-
          We set up sustainable systems that give businesses a professional identity in the digital world and help them reach new customers.
      - title: Education and Consultancy Brands
        icon: education
        description: |-
          We build digital structures that make your expertise visible, establish trust and increase application conversion.

  # 10 — PROCESS
  - type: steps
    background: dark
    eyebrow: How Does the Process Work?
    heading: From Idea to Launch, from Launch to Growth, We Are with You.
    lead: |-
      We believe successful projects come not only from good design, but from a well-planned process.
    items:
      - title: Discovery and Brief
        description: |-
          We listen in detail to your brand, your goals, your target audience and your needs.
      - title: Research and Strategy
        description: |-
          We analyse your industry, your competitors and user behaviour to build the road map of the project.
      - title: Design and Content
        description: |-
          We design the visual language, user experience and content structure that fit your brand identity.
      - title: Development and Implementation
        description: |-
          We turn approved designs into fast, secure, mobile-friendly and easily manageable digital systems.
      - title: Testing and Launch
        description: |-
          We complete performance, user experience, form and redirect tests on every device, then take the project live.
      - title: Optimization and Growth
        description: |-
          After launch we track the data, analyse the results and keep improving the system so your brand keeps growing.
    ctas:
      - label: Let Us Plan Your Project Together
        href: /en/contact
        variant: primary

  # 11 — WHY PIXELON (listed in the right-hand column in the reference)
  - type: cards
    background: light
    eyebrow: More Than an Agency
    heading: A Strategic, Creative and Results-Driven Team for Your Brand
    columns: 1
    items:
      - title: We Start with Strategy
        description: |-
          We begin every project not with design, but by asking the right questions and understanding what the brand truly needs.
      - title: We Build for Your Brand
        description: |-
          Instead of ready-made templates and look-alike solutions, we create work that belongs to your brand identity alone.
      - title: We Combine Design and Technology
        description: |-
          We make sure work that looks beautiful is also fast, functional and easy to use.
      - title: We Measure the Results
        description: |-
          We follow not only how our work looks, but its impact on traffic, engagement, enquiries and conversion.
      - title: We Manage the Whole Process in One Team
        description: |-
          We run strategy, design, development, content, advertising and optimization in full alignment with each other.

  # 12/13 — GLOBAL (country chip marquee + world map + closing line, single block)
  - type: worldMap
    background: dark
    eyebrow: Where Are We?
    heading: Pixelon Is Everywhere in the World!
    lead: |-
      In projects reaching from Turkey to Europe and Africa, we develop communication strategies suited to different cultures, languages and target markets. From taking a local brand into global markets to the digital transformation of an international company, we approach every project with the same care, whatever its scale.
    countries:
      - { label: Turkey, flag: 🇹🇷, highlighted: true }
      - { label: Germany, flag: 🇩🇪 }
      - { label: United Kingdom, flag: 🇬🇧 }
      - { label: France, flag: 🇫🇷 }
      - { label: Italy, flag: 🇮🇹 }
      - { label: Spain, flag: 🇪🇸 }
      - { label: Romania, flag: 🇷🇴 }
      - { label: Bulgaria, flag: 🇧🇬 }
      - { label: Netherlands, flag: 🇳🇱 }
      - { label: Ireland, flag: 🇮🇪 }
      - { label: Africa, flag: 🌍 }
    closingLine: Borders change; *the rules of a strong brand experience* do not.
    mapImageAlt: World map of Pixelon global digital marketing projects
    ctas:
      - label: Explore Our Global Projects
        href: /en/projects
        variant: outline

  # 14 — CLIENT TESTIMONIALS (3 placeholder cards in the reference)
  # The decorative five-star badge above the card (★★★★★) was deliberately left out of the content.
  - type: cards
    background: light
    eyebrow: What We Built Together
    heading: What Do Our Clients Say About Pixelon?
    lead: |-
      We measure our success not only by the projects we complete, but by the long-lasting partnerships we build.
    columns: 3
    items:
      - eyebrow: Web Design
        title: Full Name
        rating: 5
        description: |-
          "A real client testimonial, published with permission, will be added here."
          Position · Brand
      - eyebrow: Health Tourism
        title: Full Name
        rating: 5
        description: |-
          "A real client testimonial, published with permission, will be added here."
          Position · Brand
      - eyebrow: Digital Advertising
        title: Full Name
        rating: 5
        description: |-
          "A real client testimonial, published with permission, will be added here."
          Position · Brand

  # 15 — BLOG (from the posts collection; 3 posts in the reference)
  # ctaLabel/ctaHref is the section button below the grid in PostsSection (the arrow is added
  # by the component); the in-card "Read the Article →" link is the card itself.
  - type: posts
    background: light
    anchor: blog
    eyebrow: Pixelon Blog
    heading: Let Us Read the Digital World Together
    limit: 3
    ctaLabel: Browse All Articles
    ctaHref: /en/blog

  # 16 — PROFESSIONAL PARTNERS (scrolling text strip)
  - type: marquee
    kind: wordmarks
    background: light
    heading: Our Professional Partners
    lead: |-
      We work with the leading platforms and technologies of the industry so that brands can build a strong presence in the digital world.
    items:
      - Google
      - Meta
      - Instagram
      - Facebook
      - WhatsApp
      - YouTube
      - TikTok
      - LinkedIn
      - Yandex

  # 17/18 — CONTACT (intro text + contact info + form, single unified block as in the reference)
  # Field placeholders: First Name · Last Name · Phone Number · E-mail Address ·
  # Company Name · Service You Are Interested In · Estimated Project Budget ·
  # "What would you like to tell us about your project?"
  # Service options: Web Design and Development · Social Media Management ·
  # Digital Advertising Management · SEO and Content Marketing · Brand and Corporate Identity ·
  # UX/UI Design · Video and Production · E-Commerce · Health Tourism Consultancy ·
  # CRM and Digital Transformation · Other
  # Budget options: Under 50,000 TRY · 50,000 - 150,000 TRY · 150,000 - 500,000 TRY ·
  # Over 500,000 TRY · Not decided yet
  # KVKK consent: "I consent to the processing of my personal data for the purpose of
  # evaluating my contact request."
  # Post-submit screen: "We have received your request!" /
  # "The Pixelon team will review your project and get in touch with you as soon as possible." /
  # button: "Continue on WhatsApp"
  - type: contact
    background: dark
    anchor: iletisim
    eyebrow: Let Us Start a New Project
    heading: Let Us Grow Your Brand Together.
    lead: |-
      Do you need a new website, an effective advertising campaign or a comprehensive strategy to grow your brand digitally? Tell us about your project. Let the Pixelon team listen to your needs and share solution proposals built around your brand.
    ctas:
      - label: Message Us on WhatsApp
        href: https://wa.me/905065229034
        variant: primary
      - label: Call Us Now
        href: 'tel:+905065229034'
        variant: outline
    contactItems:
      - label: Phone and WhatsApp
        value: +90 506 522 90 34
        href: 'tel:+905065229034'
      - label: E-mail
        value: info@pixelon.com.tr
        href: 'mailto:info@pixelon.com.tr'
      - label: Address
        value: Kadıköy, Istanbul
    formHeading: Tell Us About Your Project
    formLead: Fill in the form and our team will get back to you as soon as possible.
    formId: contact
    submitLabel: Send Project Request
