seo:
  title: Dijital Pazarlama Hizmetleri | Pixelon 360° Dijital Ajans
  description: >-
    Web tasarım, sosyal medya, dijital reklam, SEO, marka tasarımı, e-ticaret,
    prodüksiyon ve sağlık turizmi çözümlerimizi keşfedin.

whatsappMessage: Merhaba Pixelon, Hizmetlerimiz sayfasından yazıyorum.

sections:
  - type: hero
    background: dark
    eyebrow: 360° Dijital Çözümler
    breadcrumb:
      - label: Ana Sayfa
        href: /
      - label: Hizmetlerimiz
    headingLines:
      - "Markanızı Birlikte *Büyütelim!*"
    lead: >-
      Web tasarımından dijital reklama, sosyal medya yönetiminden marka
      kimliğine kadar markanızın dijital dünyada ihtiyaç duyduğu tüm çözümleri
      tek çatı altında sunuyoruz. Pixelon olarak her markaya aynı hizmet paketini
      sunmak yerine; hedeflerinize, sektörünüze ve hedef kitlenize özel bir
      dijital yol haritası oluşturuyoruz.
    video:
      desktopMp4: /media/hero/hizmetler/hero-hizmetler-desktop.mp4
      desktopWebm: /media/hero/hizmetler/hero-hizmetler-desktop.webm
      desktopPoster: /media/hero/hizmetler/hero-hizmetler-desktop-poster.webp
      mobileMp4: /media/hero/hizmetler/hero-hizmetler-mobile.mp4
      mobileWebm: /media/hero/hizmetler/hero-hizmetler-mobile.webm
      mobilePoster: /media/hero/hizmetler/hero-hizmetler-mobile-poster.webp
    ctas:
      - label: WhatsApp'tan Bize Ulaşın
        href: https://wa.me/905065229034
        variant: primary
      - label: Projelerimizi İnceleyin
        href: /projelerimiz
        variant: outline

  - type: bullets
    kind: orbit
    background: light
    eyebrow: 360° Yaklaşım
    heading: Markanız İçin 360° Dijital Çözümler
    lead: >-
      Strateji, tasarım, içerik, teknoloji ve performansı aynı hedef doğrultusunda bir
      araya getiriyoruz. Böylece markanızın tüm dijital kanallarda tutarlı, güçlü ve
      sonuç odaklı bir iletişim kurmasını sağlıyoruz. Bir hizmetle başlayabilir,
      ihtiyaç büyüdükçe diğer disiplinleri aynı ekiple devreye alabilirsiniz.
    items:
      - Strateji
      - Tasarım
      - İçerik
      - Teknoloji
      - Performans

  - type: services
    kind: showcase
    background: dark
    anchor: hizmetler
    eyebrow: Ne Sunuyoruz?
    heading: Markanızı Dijitalde Büyüten Altı Disiplin
    lead: >-
      İhtiyacınıza göre tek bir hizmetle çalışabilir ya da altısını aynı strateji
      altında birleştirebilirsiniz.
  - type: cards
    kind: feature
    background: light
    eyebrow: Bir Ajansın Ötesinde
    heading: Neden Pixelon?
    items:
      - title: Markanıza Özel Strateji
        icon: bespoke
        description: >-
          Hazır paketler yerine markanızın ihtiyaçlarına ve hedeflerine uygun
          çözümler oluşturuyoruz.
      - title: Tüm Süreç Tek Ekipte
        icon: orbit
        description: >-
          Strateji, tasarım, içerik, yazılım ve reklam süreçlerini birbiriyle
          uyumlu biçimde yönetiyoruz.
      - title: Ölçülebilir Sonuçlar
        icon: strategy
        description: >-
          Trafik, etkileşim, talep, satış ve dönüşüm verilerini takip ederek
          çalışmalarımızı sürekli geliştiriyoruz.
      - title: Uzun Vadeli İş Birliği
        icon: partnership
        description: >-
          Yalnızca proje teslim etmiyor, markanızın değişen ihtiyaçlarına göre
          büyüme sürecinize eşlik ediyoruz.

  - type: sectorCards
    background: dark
    eyebrow: Sektör Deneyimimiz
    heading: Hangi Sektörlerle Çalışıyoruz?
    body: >-
      Sağlık ve klinik markaları, sağlık turizmi firmaları, e-ticaret markaları,
      inşaat ve gayrimenkul şirketleri ile hizmet sektöründeki KOBİ ve kurumsal
      işletmelere özel dijital çözümler sunuyoruz.
    cards:
      - label: Sağlık ve Klinik
        image: '/src/assets/images/sector-saglik-klinik.webp'
        alt: Modern bir diş kliniğinde hastasıyla ilgilenen hekim
      - label: Sağlık Turizmi
        image: '/src/assets/images/sector-saglik-turizmi.webp'
        alt: Hastane resepsiyonunda karşılanan yurt dışından gelen hasta
      - label: Estetik ve Kozmetik
        image: '/src/assets/images/sector-estetik-kozmetik.webp'
        alt: Güzellik kliniğinde cilt bakımı uygulanan danışan
      - label: E-Ticaret
        image: '/src/assets/images/sector-e-ticaret.webp'
        alt: Depoda kargo paketini okutan e-ticaret çalışanı
      - label: İnşaat ve Gayrimenkul
        image: '/src/assets/images/sector-insaat-gayrimenkul.webp'
        alt: Gün batımında modern bir konut projesinin cephesi
      - label: Kurumsal Hizmet
        image: '/src/assets/images/sector-kurumsal-hizmet.webp'
        alt: Aydınlık bir ofiste toplantı hâlindeki kurumsal ekip

  - type: cta
    background: dark
    anchor: iletisim
    eyebrow: Birlikte Karar Verelim
    heading: Markanız İçin Doğru Çözümü Birlikte Belirleyelim
    lead: >-
      Hangi hizmete ihtiyacınız olduğundan emin olmasanız bile markanızı ve
      hedeflerinizi bize anlatabilirsiniz. Pixelon ekibi ihtiyaçlarınızı analiz
      ederek size uygun dijital çözüm planını oluştursun.
    ctas:
      - label: WhatsApp'tan Yazın
        href: https://wa.me/905065229034
        variant: primary
      - label: Hemen Arayın
        href: tel:+905065229034
        variant: outline
      - label: İletişim Formunu Doldurun
        href: /iletisim
        variant: outline

  - type: contactInfo
    background: dark
    items:
      - label: Telefon ve WhatsApp
        value: +90 506 522 90 34
        href: tel:+905065229034
      - label: E-posta
        value: info@pixelon.com.tr
        href: mailto:info@pixelon.com.tr
      - label: Konum
        value: Kadıköy, İstanbul
