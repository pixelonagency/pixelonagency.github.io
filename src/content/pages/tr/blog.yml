seo:
  title: Dijital Pazarlama, Tasarım ve Teknoloji Blogu | Pixelon
  description: |-
    Dijital pazarlama, web tasarım, sosyal medya, SEO, reklam, e-ticaret ve marka iletişimi hakkında güncel bilgiler Pixelon Blog'da.

whatsappMessage: Merhaba Pixelon, blog üzerinden ulaşıyorum, bir projem hakkında bilgi almak istiyorum.

sections:
  # HERO (kompakt) — arama kutusu yer tutucusu: "Bir konu veya içerik ara..."
  - type: hero
    background: dark
    breadcrumb:
      - label: Ana Sayfa
        href: /
      - label: Blog
    eyebrow: Pixelon Blog
    headingLines:
      - "Dijital Dünyayı Birlikte Okuyalım."
    lead: |-
      Dijital pazarlama, tasarım, teknoloji ve marka iletişimindeki güncel gelişmeleri; deneyimlerimiz, rehberlerimiz ve uygulanabilir önerilerimizle paylaşıyoruz.

  # ÖNE ÇIKAN YAZI
  # İçerik koleksiyondan gelir: "Öne Çıkan" işaretli en yeni yazı, kapağıyla.
  # Belirli bir yazıyı sabitlemek için `slug` alanını doldurun.
  - type: featuredPost
    background: light
    eyebrow: Öne Çıkan
    ctaLabel: Yazıyı Okuyun

  # KATEGORİ FİLTRELERİ + SON YAZILAR (posts koleksiyonundan)
  # Referanstaki filtre çipleri (posts şemasında karşılığı yok):
  # Tümü · Dijital Pazarlama · Web Tasarım · Sosyal Medya · Dijital Reklam ·
  # SEO ve İçerik · Marka ve Tasarım · E-Ticaret · Sağlık Pazarlaması · Teknoloji ve CRM
  # Ayrıca sayfalama: ← Önceki · 1 · 2 · 3 · Sonraki →
  - type: posts
    background: light
    eyebrow: Güncel İçerikler
    heading: Son Eklenen Yazılar
    lead: |-
      Dijital dünyadaki gelişmeleri, deneyimlerimizi ve markanızda uygulayabileceğiniz pratik bilgileri keşfedin.
    # Sınır YOK: blog listesi yayımlanan her yazıyı gösterir. `limit` verildiğinde
    # listeye girmeyen yazılar hiçbir sayfadan bağlantı almıyor, yalnız sitemap
    # üzerinden keşfedilebiliyordu.
    ctaLabel: Yazıyı Oku →
    ctaHref: /blog

  # EDİTÖRÜN SEÇTİKLERİ
  # Her kart yayındaki bir yazıya bağlanır; blog merkezinden en çok okunmasını
  # istediğimiz rehberlere iç bağlantı taşır.
  - type: cards
    background: dark
    eyebrow: Pixelon Öneriyor
    heading: Editörün Seçtikleri
    columns: 4
    items:
      - eyebrow: Sağlık Pazarlaması
        title: Sağlık Markaları İçin Dijital Pazarlama Stratejisi
        description: |-
          Web sitesi, içerik, reklam ve hasta iletişimini tek bir planda birleştirmenin yolu.
        href: /blog/saglik-markalari-icin-dijital-pazarlama-stratejisi-nasil-olusturulur/
      - eyebrow: Web Tasarım
        title: Kurumsal Web Sitesi Nasıl Olmalı?
        description: |-
          Ziyaretçinin ne yapması gerektiğini anladığı bir kurumsal sitenin on temel özelliği.
        href: /blog/kurumsal-web-sitesi-nasil-olmali/
      - eyebrow: Sağlık Pazarlaması
        title: Sağlık Turizminde Uluslararası Hasta Güveni
        description: |-
          Başka bir ülkede tedavi olmaya karar veren hastanın güvenini neyin kazandığı.
        href: /blog/saglik-turizminde-uluslararasi-hasta-guveni-nasil-kazanilir/
      - eyebrow: Marka
        title: Marka Kimliği Nedir, Neleri Kapsar?
        description: |-
          Logonun altında duran yapı: markanın kime ne vaat ettiği ve nasıl konuştuğu.
        href: /blog/marka-kimligi-nedir-neleri-kapsar/

  # SEKTÖRLERE GÖRE: her kart o sektöre yaptığımız işi anlatan sayfaya gider.
  - type: cards
    background: light
    eyebrow: Sektörünüze Özel
    heading: İşletmenize Uygun Çözümleri Keşfedin
    columns: 4
    items:
      - title: Sağlık ve Klinikler
        description: |-
          Tedavi başına sayfa, çok dilli hasta sayfaları ve randevu akışıyla kurduğumuz klinik siteleri.
        href: /hizmetlerimiz/web-tasarim-ve-yazilim/doktor-ve-klinik-web-sitesi/
      - title: Sağlık Turizmi
        description: |-
          Uluslararası hasta kazanımı, çok dilli iletişim ve yurt dışı reklam yönetimi.
        href: /hizmetlerimiz/saglik-turizmi-danismanligi/
      - title: E-Ticaret
        description: |-
          Ürün sunumu, ödeme akışı ve satış dönüşümüne odaklanan e-ticaret siteleri.
        href: /hizmetlerimiz/e-ticaret-cozumleri/
      - title: İnşaat ve Kurumsal Markalar
        description: |-
          Projeleri kanıt olarak öne çıkaran kurumsal web siteleri ve marka iletişimi.
        href: /hizmetlerimiz/web-tasarim-ve-yazilim/kurumsal-web-tasarim/

  # SON CTA
  - type: cta
    background: light
    anchor: iletisim
    heading: Okuduklarınızı Markanız İçin Uygulamaya Dönüştürelim.
    lead: |-
      Web tasarım, sosyal medya, dijital reklam, SEO veya marka iletişimi konusunda profesyonel desteğe ihtiyacınız varsa Pixelon ekibiyle iletişime geçin.
    ctas:
      - label: WhatsApp'tan Yazın
        href: https://wa.me/905065229034
        variant: primary
      - label: Hizmetlerimizi İnceleyin
        href: /hizmetlerimiz
        variant: outline
      - label: Projenizi Anlatın
        href: /iletisim
        variant: link
