  # 14 — SSS
  - type: faq
    background: light
    eyebrow: Sıkça Sorulan Sorular
    heading: Pixelon Hakkında Sıkça Sorulan Sorular
    items:
      - question: Pixelon hangi alanlarda hizmet veriyor?
        answer: >-
          Pixelon; web tasarım ve yazılım, sosyal medya yönetimi, dijital reklam,
          SEO ve içerik pazarlaması, marka ve kurumsal kimlik ile e-ticaret
          çözümleri sunmaktadır.
      - question: Pixelon hangi sektörlerle çalışıyor?
        answer: >-
          Sağlık ve klinik markaları, sağlık turizmi firmaları, e-ticaret
          markaları, inşaat ve gayrimenkul şirketleri, KOBİ'ler ve kurumsal
          hizmet markalarıyla çalışıyoruz.
      - question: Pixelon yurt dışındaki markalara hizmet veriyor mu?
        answer: >-
          Evet. Çok dilli web sitesi, uluslararası reklam yönetimi, içerik
          üretimi ve hedef pazara özel dijital pazarlama çalışmalarıyla farklı
          ülkelerdeki markalara hizmet veriyoruz.
      - question: Pixelon ile proje süreci nasıl başlıyor?
        answer: >-
          Süreç, markanızı ve ihtiyaçlarınızı anlamaya yönelik bir ön görüşmeyle
          başlar. Ardından ihtiyaç analizi, strateji, teklif, tasarım, uygulama
          ve optimizasyon aşamaları planlanır.
      - question: Pixelon ile nasıl iletişime geçebilirim?
        answer: >-
          +90 506 522 90 34 numarası üzerinden WhatsApp'tan yazabilir, telefonla
          arayabilir veya iletişim formunu doldurabilirsiniz.
