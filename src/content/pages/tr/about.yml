seo:
  title: Biz Kimiz? | Pixelon 360° Dijital Pazarlama Ajansı
  description: >-
    Pixelon'u yakından tanıyın. Strateji, tasarım, teknoloji ve performansı
    birleştirerek markalara 360° dijital pazarlama çözümleri sunuyoruz.

whatsappMessage: Merhaba Pixelon, Biz Kimiz sayfasından yazıyorum.

sections:
  # 1 — HERO
  - type: hero
    background: dark
    eyebrow: 360° Dijital Pazarlama Partneriniz
    breadcrumb:
      - label: Ana Sayfa
        href: /
      - label: Biz Kimiz?
    headingLines:
      - "Biz *Pixelon* Ekibiyiz!"
    lead: >-
      Strateji, yaratıcılık, teknoloji ve performansı aynı hedef doğrultusunda
      buluşturan 360° dijital pazarlama ajansıyız. Markaların dijital dünyada
      yalnızca görünür olmasını değil; doğru hedef kitleyle buluşmasını, güven
      oluşturmasını ve sürdürülebilir biçimde büyümesini sağlıyoruz.
    tagline: Strateji ✦ Yaratıcılık ✦ Teknoloji ✦ Performans ✦ Tasarım ✦ Büyüme
    ctas:
      - label: Projelerimizi İnceleyin
        href: /projelerimiz
        variant: primary
      - label: Bizimle İletişime Geçin
        href: /iletisim
        variant: outline
    image: '/src/assets/images/pixelon-ekip-pixel-art.webp'
    imageAlt: >-
      Pixelon dijital pazarlama ekibi - sosyal etkileşim, hız ve topluluk odaklı
      yaklaşımı simgeleyen pixel-art görsel

  # 2 — PIXELON NEDİR (referans: başlık solda sticky, paragraflar sağda)
  - type: text
    background: light
    layout: split
    eyebrow: Pixelon'da Ne Var?
    heading: Fikirleri Markalara, Markaları Güçlü Dijital Deneyimlere Dönüştürüyoruz.
    body: |-
      Pixelon; markaların dijital dünyadaki ihtiyaçlarını tek bir bakış açısıyla ele alan, strateji ve yaratıcılığı teknolojiyle birleştiren 360° dijital pazarlama ajansıdır. Web tasarım ve yazılım, sosyal medya yönetimi, dijital reklam yönetimi, SEO ve içerik pazarlaması, marka ve kurumsal kimlik ile e-ticaret çözümleri alanlarında markaya özel işler üretiyoruz.

      Ancak bizim için dijital pazarlama yalnızca bir web sitesi hazırlamak, sosyal medya paylaşımı yapmak veya reklam kampanyası yayınlamak değildir. Her çalışmayı markanın hedefleri, hedef kitlesi, sektörü ve büyüme planları doğrultusunda birbirini tamamlayan bir sistem olarak ele alıyoruz. Sağlık ve klinik markalarından sağlık turizmi firmalarına, e-ticaret girişimlerinden inşaat ve gayrimenkul şirketlerine kadar farklı sektörlerdeki markaların dijital dönüşüm yolculuklarına eşlik ediyoruz.
    highlight: Pixelon'da her fikir bir stratejiyle, her tasarım bir amaçla ve her kampanya ölçülebilir bir hedefle başlar.

  # 3 — NE YAPIYORUZ
  - type: steps
    kind: flow
    background: accent
    eyebrow: Nasıl Çalışıyoruz?
    heading: Süreç Nasıl İşliyor?
    lead: >-
      Web sitesi, sosyal medya, reklam ve marka kimliğini birbirinden bağımsız
      işler olarak değil, aynı stratejinin parçaları olarak planlıyoruz. Her
      proje aynı altı adımdan geçiyor.
    items:
      - title: Dinleme
        description: Markanızı, sektörünüzü ve hedeflerinizi anlamakla başlıyoruz.
      - title: Analiz
        description: Hedef kitlenizi, rakiplerinizi ve mevcut dijital varlığınızı inceliyoruz.
      - title: Strateji
        description: İhtiyacınıza uygun yol haritasını ve kanal planını çıkarıyoruz.
      - title: Üretim
        description: Tasarım, içerik ve yazılım süreçlerini aynı ekip içinde yürütüyoruz.
      - title: Yayın
        description: Projeyi yayına alıyor, ölçüm altyapısını birlikte kuruyoruz.
      - title: İyileştirme
        description: Sonuçları ölçüyor, verinin gösterdiği yönde geliştirmeye devam ediyoruz.

  # 4 — NEDEN PIXELON
  - type: cards
    kind: feature
    background: dark
    eyebrow: Bir Ajansın Ötesinde
    heading: Neden Pixelon?
    lead: >-
      Markanız için yalnızca hizmet sağlayan bir ekip değil, hedeflerinizi
      anlayan ve büyüme yolculuğunuza eşlik eden uzun vadeli bir iş ortağı olmak
      istiyoruz.
    items:
      - title: Strateji ve Sonuç Odaklı Yaklaşım
        icon: strategy
        description: Yaratıcı fikirleri ölçülebilir hedeflerle buluşturuyoruz.
      - title: Markaya Özel Çözümler
        icon: bespoke
        description: Hazır şablon değil, markanıza ait işler tasarlıyoruz.
      - title: Tasarım ve Teknoloji Bir Arada
        icon: craft
        description: Estetik, işlevsellik ve teknolojiyi aynı deneyimde birleştiriyoruz.
      - title: 360° Dijital Pazarlama
        icon: orbit
        description: >-
          Web tasarım, sosyal medya, reklam, SEO ve marka iletişimini tek ekip ve
          ortak bir stratejiyle yönetiyoruz.
      - title: Şeffaf Süreç, Uzun Soluklu Ortaklık
        icon: partnership
        description: >-
          Gelişmeleri anlaşılır biçimde paylaşıyor, projeyi teslim etmekle
          kalmayıp markanızla birlikte büyüyoruz.

  # 5 — VİZYON + MİSYON (referans: tek bölümde yan yana, üst çizgili iki blok)
  - type: cards
    background: dark
    kind: panels
    columns: 2
    items:
      - eyebrow: Geleceğe Bakışımız
        title: Dijital Dünyada Güçlü, Özgün ve Sürdürülebilir Markalar Oluşturmak
        description: >-
          Vizyonumuz; strateji, yaratıcılık ve teknolojiyi bir araya getirerek
          markaların yalnızca bugünkü ihtiyaçlarına değil, gelecekteki büyüme
          hedeflerine de cevap veren dijital sistemler oluşturmaktır. Türkiye'de
          ve uluslararası pazarlarda faaliyet gösteren markalar için güvenilir,
          yenilikçi ve sonuç odaklı bir dijital çözüm ortağı olmayı hedefliyoruz.
      - eyebrow: Nasıl Değer Üretiyoruz?
        title: Markaların Potansiyelini Görünür ve Ölçülebilir Sonuçlara Dönüştürmek
        description: >-
          Misyonumuz; markaları doğru analiz etmek, hedef kitleleriyle güçlü
          bağlar kurmalarını sağlamak ve dijital pazarlama yatırımlarını
          sürdürülebilir büyümeye dönüştürmektir. Her projede estetik, kullanıcı
          deneyimi, teknoloji ve performans arasında doğru dengeyi kurarak
          markaya gerçek bir değer kazandırmayı amaçlıyoruz.

  # 6 — DEĞERLERİMİZ (referans: krem dolgulu, çerçevesiz kartlar)
  - type: cards
    background: light
    kind: ledger
    eyebrow: Çalışma Kültürümüz
    heading: Ürettiğimiz Her İşin Temelinde Bu Değerler Var
    items:
      - title: Yaratıcılık
        description: >-
          Yeni fikirler üretir, markaları benzerlerinden ayıracak özgün yollar
          ararız.
      - title: Stratejik Düşünce
        description: >-
          Her kararın markanın hedeflerine ve kullanıcı beklentilerine hizmet
          etmesini önemseriz.
      - title: Şeffaflık
        description: >-
          Süreçleri açık biçimde paylaşır, müşterilerimizle güvene dayalı
          iletişim kurarız.
      - title: Sorumluluk
        description: >-
          Üstlendiğimiz her projeyi kendi markamızın bir parçası gibi
          sahipleniriz.
      - title: Sürekli Gelişim
        description: >-
          Dijital dünyanın değişen teknolojilerini, platformlarını ve kullanıcı
          alışkanlıklarını yakından takip ederiz.
      - title: İş Birliği
        description: >-
          En güçlü sonuçların müşteriyle ajansın aynı hedef doğrultusunda
          çalışmasıyla ortaya çıktığına inanırız.





  # 11 — GLOBAL (referans: ortalanmış blok + lime vurgulu büyük kapanış cümlesi)
  - type: text
    background: dark
    layout: center
    eyebrow: Yerelden Globale
    heading: Markaları Farklı Pazarlarda Hedef Kitleleriyle Buluşturuyoruz.
    body: |-
      Pixelon olarak Türkiye'nin yanı sıra Avrupa ve Afrika pazarlarında faaliyet gösteren markalar için projeler geliştiriyoruz. Farklı ülkelerin kullanıcı alışkanlıklarını, iletişim dillerini ve pazar dinamiklerini dikkate alarak çok dilli web siteleri, uluslararası reklam kampanyaları ve hedef pazara özel içerik stratejileri hazırlıyoruz.
    highlight: İstanbul'da üretiyor, markaları *dünyanın farklı noktalarındaki* hedef kitlelerle buluşturuyoruz.


  # 13 — CTA + İLETİŞİM
  - type: cta
    background: dark
    anchor: iletisim
    eyebrow: Sıradaki Başarı Hikâyesi Sizin Olabilir
    heading: Markanızı Birlikte Büyütelim.
    lead: >-
      Yeni bir web sitesi, etkili bir dijital reklam kampanyası, güçlü bir sosyal
      medya iletişimi veya kapsamlı bir dijital dönüşüm projesi için Pixelon
      ekibiyle tanışın. Markanızı dinleyelim, ihtiyaçlarınızı anlayalım ve
      hedeflerinize ulaşmanızı sağlayacak yol haritasını birlikte oluşturalım.
    ctas:
      - label: WhatsApp'tan Yazın
        href: https://wa.me/905065229034
        variant: primary
      - label: Hemen Arayın
        href: tel:+905065229034
        variant: outline
      - label: Projenizi Anlatın
        href: mailto:info@pixelon.com.tr
        variant: link

  - type: contactInfo
    background: dark
