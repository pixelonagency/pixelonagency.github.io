seo:
  title: İletişim | Pixelon 360° Dijital Pazarlama Ajansı
  description: >-
    Web tasarım, sosyal medya, dijital reklam, SEO ve marka projeleriniz için
    Pixelon ile iletişime geçin. WhatsApp'tan yazın veya proje formunu doldurun.

whatsappMessage: Merhaba Pixelon, markam için dijital pazarlama hizmetleri hakkında bilgi almak istiyorum.

sections:
  - type: hero
    background: dark
    align: center
    eyebrow: Pixelon ile İletişime Geçin
    headingLines:
      - "Birlikte Harika Bir Şey Üretelim."
    lead: >-
      Web sitesi, reklam kampanyası, sosyal medya ya da kapsamlı bir dijital
      strateji — ne planlıyorsanız anlatın. Dinleyelim, hedefinizi anlayalım ve
      doğru yol haritasını birlikte çıkaralım.
    video:
      desktopMp4: /media/hero/iletisim/hero-iletisim-desktop.mp4
      desktopWebm: /media/hero/iletisim/hero-iletisim-desktop.webm
      desktopPoster: /media/hero/iletisim/hero-iletisim-desktop-poster.webp
      mobileMp4: /media/hero/iletisim/hero-iletisim-mobile.mp4
      mobileWebm: /media/hero/iletisim/hero-iletisim-mobile.webm
      mobilePoster: /media/hero/iletisim/hero-iletisim-mobile-poster.webp
    chips:
      - İlk görüşme ücretsiz
      - Kadıköy, İstanbul
      - Uzaktan ve yüz yüze
    tagline: >-
      Mesajınızı aldıktan sonra projenizi inceleyerek en kısa sürede sizinle
      iletişime geçeceğiz.
    ctas:
      - label: WhatsApp'tan Yazın
        href: https://wa.me/905065229034
        variant: primary
      - label: Hemen Arayın
        href: 'tel:+905065229034'
        variant: outline

  - type: contactInfo
    background: dark
    anchor: form
    eyebrow: Size En Uygun Kanaldan Bize Ulaşın
    heading: Projeniz hakkında hızlıca bilgi alın
    lead: WhatsApp'tan yazabilir, bizi arayabilir veya iletişim formunu doldurabilirsiniz.
    items:
      - label: WhatsApp ve Telefon
        icon: whatsapp
        value: |-
          +90 506 522 90 34
          Yeni proje talepleri, hizmetlerimiz ve çalışma süreçlerimiz hakkında bizimle doğrudan iletişime geçin.
        href: 'tel:+905065229034'
      - label: E-posta
        icon: mail
        value: |-
          info@pixelon.com.tr
          Proje dosyalarınızı, briefinizi veya iş birliği taleplerinizi e-posta üzerinden iletebilirsiniz.
        href: 'mailto:info@pixelon.com.tr'
      - label: Konum
        icon: location
        value: |-
          Kadıköy, İstanbul
          Türkiye'den ve dünyanın farklı noktalarından markalarla çevrim içi ve yüz yüze çalışma süreçleri yürütüyoruz.
      - label: Sosyal Medya
        icon: social
        value: |-
          Instagram: @pixelonagency
          Facebook: pixelonagency
          LinkedIn: pixelonagency
        href: https://www.instagram.com/pixelonagency/

  - type: form
    background: light
    eyebrow: Projenizden Bize Bahsedin
    heading: Markanız İçin Nasıl Bir Çözüm Arıyorsunuz?
    lead: >-
      Formu doldurun; Pixelon ekibi ihtiyaçlarınızı değerlendirerek size uygun
      hizmet ve proje modeli hakkında geri dönüş sağlasın.
    formId: contact
    submitLabel: Proje Talebini Gönder
    # Gönderim sonrası ekranlar — metinler referans tasarımdan birebir alındı.
    successHeading: Talebiniz Bize Ulaştı!
    successBody: >-
      Projenizle ilgili paylaştığınız bilgileri inceleyerek en kısa sürede sizinle
      iletişime geçeceğiz.
    successCtas:
      - label: Bu Sırada Projelerimizi İnceleyin
        href: /projelerimiz
        variant: primary
    errorHeading: Form Gönderilemedi
    errorBody: >-
      Teknik bir sorun oluştu. Lütfen tekrar deneyin veya doğrudan WhatsApp üzerinden
      bizimle iletişime geçin.

  - type: cta
    background: dark
    heading: Formla Uğraşmak İstemiyor musunuz?
    lead: >-
      Bize WhatsApp'tan kısaca ihtiyacınızı yazın. Ekibimiz size uygun hizmet ve
      süreç hakkında bilgi versin.
    ctas:
      - label: WhatsApp Görüşmesini Başlat
        href: https://wa.me/905065229034
        variant: primary

  - type: faq
    background: light
    eyebrow: Merak Edilenler
    heading: İletişim Hakkında Sıkça Sorulan Sorular
    items:
      - question: İlk görüşme ücretli mi?
        answer: >-
          Hayır. Markanızı ve ihtiyaçlarınızı anlamaya yönelik ilk tanışma
          görüşmesi ücretsizdir.
      - question: Proje teklifi ne kadar sürede hazırlanır?
        answer: >-
          Teklif süresi projenin kapsamına göre değişebilir. İhtiyaçlar
          netleştirildikten sonra proje kapsamı, zaman planı ve fiyatlandırma
          hazırlanır.
      - question: Yalnızca İstanbul'daki markalarla mı çalışıyorsunuz?
        answer: >-
          Hayır. Türkiye'nin ve dünyanın farklı bölgelerindeki markalarla çevrim
          içi olarak çalışıyoruz.
      - question: Birden fazla hizmeti birlikte alabilir miyiz?
        answer: >-
          Evet. Web sitesi, sosyal medya, reklam, SEO, prodüksiyon ve diğer
          hizmetler birbirini destekleyecek şekilde birlikte planlanabilir.
      - question: Hangi kanaldan iletişime geçmeliyim?
        answer: >-
          Hızlı bilgi almak için WhatsApp'ı, detaylı proje dokümanları paylaşmak
          için e-postayı veya kapsamlı talep iletmek için iletişim formunu
          kullanabilirsiniz.

  - type: cta
    background: dark
    anchor: iletisim
    eyebrow: Sıradaki Proje Sizin Olabilir
    heading: Fikrinizi Birlikte Gerçeğe Dönüştürelim.
    lead: >-
      Markanızın dijital dünyada daha güçlü görünmesi, doğru hedef kitleye
      ulaşması ve ölçülebilir biçimde büyümesi için Pixelon ekibiyle iletişime
      geçin.
    ctas:
      - label: WhatsApp'tan Yazın
        href: https://wa.me/905065229034
        variant: primary
      - label: Hemen Arayın
        href: 'tel:+905065229034'
        variant: outline
      - label: Hizmetlerimizi İnceleyin
        href: /hizmetlerimiz
        variant: link
