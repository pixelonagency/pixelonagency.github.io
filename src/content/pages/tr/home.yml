seo:
  title: Pixelon | 360° Dijital Pazarlama Ajansı İstanbul
  description: >-
    Pixelon; web tasarım, sosyal medya, dijital reklam, SEO, e-ticaret, marka
    tasarımı ve sağlık turizmi alanlarında 360° dijital çözümler sunar.

whatsappMessage: Merhaba Pixelon, markam için dijital pazarlama hizmetleri hakkında bilgi almak istiyorum.

sections:
  # 1 — HERO
  - type: hero
    background: dark
    eyebrow: 360° Dijital Pazarlama Partneriniz
    # *yıldız* içine alınan kelimeler lime (aksan) renkle basılır — bkz. src/lib/highlight.ts
    headingLines:
      - "Markanızı *Strateji*, *Tasarım* ve *Teknolojiyle* Büyütüyoruz."
    lead: |-
      Pixelon; yaratıcı fikirleri güçlü tasarımlara, dijital stratejileri ölçülebilir sonuçlara dönüştüren 360° dijital pazarlama ajansıdır. Markanızın tüm dijital ihtiyaçlarına tek çatı altında çözüm sunar.
    tagline: Bir fikriniz mi var? Birlikte büyütelim.
    image: '/src/assets/images/pixelon-ekip-pixel-art.webp'
    imageAlt: >-
      Pixelon marka görseli - sosyal etkileşim, hız ve topluluk odaklı yaklaşımı
      simgeleyen pixel-art illüstrasyon
    chips:
      - '*15+* Yıllık Deneyim'
      - '*180+* Tamamlanan Proje'
      - '*50+* Marka İş Birliği'
      - Türkiye ve Global Pazar Deneyimi
    ctas:
      - label: WhatsApp'tan Bize Ulaşın
        href: https://wa.me/905065229034
        variant: primary
        icon: whatsapp
        external: true
      - label: Projelerimizi İnceleyin
        href: /projelerimiz
        variant: outline
      - label: Hemen Arayın
        href: 'tel:+905065229034'
        variant: link

  # 2 — LİME MARQUEE (dekoratif şerit, hero altında)
  - type: marquee
    kind: strip
    background: dark
    items: [Strateji, Tasarım, Teknoloji, Performans, Büyüme, Dönüşüm]

  # 3 — REFERANSLAR (logo marquee, references koleksiyonundan)
  - type: logos
    background: light
    anchor: referanslar
    eyebrow: Referanslarımız
    heading: Güçlü Markalar, Uzun Soluklu İş Birlikleri
    lead: |-
      Her markanın hikâyesi, hedefleri ve ihtiyaçları farklıdır. Pixelon olarak her projeye hazır kalıplarla değil, markaya özel stratejilerle yaklaşıyoruz. Türkiye'den dünyaya uzanan çalışmalarımızla kurumsal markaların, sağlık kuruluşlarının, e-ticaret girişimlerinin ve büyümek isteyen işletmelerin dijital dönüşüm yolculuklarına eşlik ediyoruz.
    ctas:
      - label: Tüm Referanslarımızı İnceleyin →
        href: /projelerimiz
        variant: outline

  # 4 — PIXELON NE YAPAR
  - type: text
    background: light
    anchor: pixelon
    eyebrow: Pixelon Ne Yapar?
    heading: Fikrinizi Görünür, Markanızı Güçlü, Sonuçlarınızı Ölçülebilir Hale Getiriyoruz.
    body: |-
      Pixelon; yalnızca güzel görünen tasarımlar üretmez. Markaların doğru hedef kitleyle buluşmasını, dijital dünyada güçlü bir konum elde etmesini ve yatırımlarından ölçülebilir sonuçlar almasını sağlayan bütünleşik çözümler geliştirir.

      İşe markanızı, sektörünüzü ve hedef kitlenizi anlayarak başlarız. Ardından strateji, tasarım, içerik, teknoloji ve performans pazarlamasını aynı hedef doğrultusunda bir araya getiririz. Böylece birbirinden bağımsız çalışmalar yerine, tüm dijital kanallarınızın birlikte hareket ettiği sürdürülebilir bir büyüme sistemi oluştururuz.

  # 5 — "PIXELON NE YAPAR" bölümünün içindeki koyu vurgu kutusu
  # NOT: bölümün kendisi (background) LIGHT — beyaz zemin üstünde duran, kendi
  # içinde koyu bir kart. `background: dark` yapılırsa bölümün tamamı siyaha
  # döner ve kart görünümü (beyaz kenar boşluğu + yuvarlak köşe) kaybolur.
  - type: cta
    background: light
    heading: >-
      Sadece görünür olmanız için değil, *tercih edilen bir marka* olmanız
      için çalışıyoruz.
    ctas:
      - label: Pixelon'u Yakından Tanıyın
        href: /biz-kimiz
        variant: primary

  # 6 — HİZMETLER VİTRİNİ (6 ana disiplin; tam liste /hizmetlerimiz'de)
  - type: services
    background: dark
    anchor: hizmetler
    kind: showcase
    eyebrow: Hizmetler
    heading: Markanızı dijitalde ileri taşıyan 6 temel disiplin.
    lead: |-
      Stratejiden tasarıma, içerikten teknolojiye. İhtiyacınıza göre tek bir hizmetle veya tüm disiplinleri bir araya getirerek çalışıyoruz.
    items:
      - service: web-tasarim-ve-yazilim
        title: Web Tasarım & Geliştirme
        description: Markanızı doğru anlatan, hızlı ve dönüşüm odaklı dijital deneyimler tasarlıyor ve geliştiriyoruz.
        image: '/src/assets/images/service-web-design.webp'
        imageAlt: Karanlık stüdyoda süzülen katmanlı web arayüzü panelleri
      - service: sosyal-medya-yonetimi
        title: Sosyal Medya
        description: Strateji, tasarım ve video üretimini bir araya getirerek markanız için güçlü bir sosyal medya dünyası oluşturuyoruz.
        image: '/src/assets/images/service-social-media.webp'
        imageAlt: Akıllı telefon çevresinde süzülen dikey içerik kartları
      - service: dijital-reklam-yonetimi
        title: Dijital Reklam
        description: Google ve Meta reklamlarıyla daha fazla talep, satış ve ölçülebilir büyüme sağlayan kampanyalar oluşturuyoruz.
        image: '/src/assets/images/service-digital-ads.webp'
        imageAlt: Yükselen performans grafikleri ve hedefleme halkalarından oluşan veri heykeli
      - service: video-ve-produksiyon
        title: Video & Prodüksiyon
        description: Fikirden çekime, kurgudan motion tasarıma kadar markanızı hareketle anlatan içerikler üretiyoruz.
        image: '/src/assets/images/service-video-production.webp'
        imageAlt: Sinema lensi, storyboard kareleri ve kurgu zaman çizelgesi katmanları
      - service: marka-ve-kurumsal-kimlik
        title: Marka & Kurumsal Kimlik
        description: Logo, görsel sistem ve marka uygulamalarıyla güçlü, özgün ve tutarlı marka kimlikleri oluşturuyoruz.
        image: '/src/assets/images/service-brand-identity.webp'
        imageAlt: Kartvizit, tipografi örnekleri ve marka kılavuzu sayfalarından natürmort
      - service: seo-ve-icerik-pazarlamasi
        title: SEO & İçerik
        description: Teknik SEO ve içerik stratejileriyle markanızın organik görünürlüğünü sürdürülebilir şekilde büyütüyoruz.
        image: '/src/assets/images/service-seo-content.webp'
        imageAlt: Birbirine bağlı içerik düğümleri ve arama arayüzü katmanları
    ctas:
      - label: Tüm Hizmetleri Keşfet →
        href: /hizmetlerimiz
        variant: primary

  # 7 — PROJELER (projects koleksiyonundan; referansta 3 seçili proje)
  - type: projects
    background: light
    anchor: projeler
    eyebrow: Seçili Projeler
    heading: Sadece Tasarlamıyor, Markalara Değer Katıyoruz.
    lead: |-
      Her proje bizim için yeni bir yolculuktur. Markanın mevcut durumunu, hedeflerini ve ihtiyaçlarını analiz ederek estetik, işlevsel ve sonuç odaklı çözümler üretiyoruz.
    limit: 3
    showFilters: false
    # ctaLabel/ctaHref, ProjectsSection'da ızgaranın altındaki bölüm butonudur —
    # kart içi "Projeyi İnceleyin →" bağlantısı bileşenin kendisinden gelir.
    ctaLabel: Tüm Projelerimizi Görüntüleyin
    ctaHref: /projelerimiz

  # 8 — RAKAMLARLA
  - type: stats
    background: dark
    eyebrow: Deneyim, Üretim ve Sonuç
    heading: >-
      Markaların Dijital Dönüşümüne ve Pazarlama Stratejilerine Değer
      Katıyoruz.
    items:
      - value: 15
        suffix: '+'
        label: Yıl sektör deneyimi
        description: Dijital tasarım, marka iletişimi ve pazarlama alanında yıllara dayanan deneyim.
      - value: 180
        suffix: '+'
        label: Tamamlanan proje
        description: Farklı sektörler ve ihtiyaçlar için başarıyla tamamlanan dijital projeler.
      - value: 120
        suffix: '+'
        label: Başarı hikâyesi
        description: Dijital görünürlüğünü, iletişimini ve performansını geliştirdiğimiz markalar.
      - value: 50
        suffix: '+'
        label: Marka iş birliği
        description: Türkiye ve global pazarlarda birlikte çalıştığımız kurumsal markalar.
      - value: 500
        suffix: '+'
        label: Yaratıcı fikir ve kahve
        description: >-
          Çünkü güçlü fikirlerin arkasında merak, araştırma, ekip çalışması ve
          biraz da kahve var.
    ctas:
      - label: ☕ Bir Kahve İçip Projenizi Konuşalım
        href: /iletisim
        variant: outline

  # 9 — SEKTÖRLER
  - type: cards
    background: light
    eyebrow: Sektörünüzü Anlıyoruz
    heading: Her Sektör İçin Aynı Çözümü Değil, Markanıza Özel Stratejiyi Üretiyoruz.
    lead: |-
      Her sektörün hedef kitlesi, satın alma süreci ve iletişim dili farklıdır. Pixelon olarak deneyim sahibi olduğumuz sektörlerde kullanıcı davranışlarını ve pazar dinamiklerini analiz ederek markaya özel çözümler oluşturuyoruz.
    columns: 3
    items:
      - title: Sağlık ve Klinik Markaları
        icon: health
        description: |-
          Hasta güvenini güçlendiren, etik iletişim kurallarına uygun ve randevu dönüşümünü destekleyen dijital sistemler oluşturuyoruz.
      - title: Sağlık Turizmi Firmaları
        icon: tourism
        description: |-
          Uluslararası hasta kazanımına yönelik çok dilli web siteleri, reklam kampanyaları ve hasta iletişim süreçleri geliştiriyoruz.
      - title: E-Ticaret Markaları
        icon: ecommerce
        featured: true
        description: |-
          Ürünlerin daha iyi sunulmasını, doğru hedef kitleye ulaşmasını ve satış dönüşümlerinin artmasını sağlayan çözümler üretiyoruz.
      - title: İnşaat ve Gayrimenkul Firmaları
        icon: construction
        description: |-
          Projelerin güven, kalite ve yatırım değerini etkili biçimde anlatan kurumsal web siteleri ve dijital pazarlama çalışmaları hazırlıyoruz.
      - title: KOBİ ve Kurumsal Hizmet Markaları
        icon: sme
        description: |-
          İşletmelerin dijital dünyada profesyonel bir kimliğe kavuşmasını ve yeni müşterilere ulaşmasını sağlayan sürdürülebilir sistemler kuruyoruz.
      - title: Eğitim ve Danışmanlık Markaları
        icon: education
        description: |-
          Uzmanlığınızı görünür kılan, güven oluşturan ve başvuru dönüşümünü artıran dijital yapılar kuruyoruz.

  # 10 — SÜREÇ
  - type: steps
    background: dark
    eyebrow: Süreç Nasıl İşliyor?
    heading: Fikirden Yayına, Yayından Büyümeye Yanınızdayız.
    lead: |-
      Başarılı projelerin yalnızca iyi tasarımla değil, doğru planlanan bir süreçle ortaya çıktığına inanıyoruz.
    items:
      - title: Keşif ve Brief
        description: |-
          Markanızı, hedeflerinizi, hedef kitlenizi ve ihtiyaçlarınızı detaylı biçimde dinliyoruz.
      - title: Araştırma ve Strateji
        description: |-
          Sektörünüzü, rakiplerinizi ve kullanıcı davranışlarını analiz ederek projenin yol haritasını oluşturuyoruz.
      - title: Tasarım ve İçerik
        description: |-
          Markanızın kimliğine uygun görsel dili, kullanıcı deneyimini ve içerik yapısını tasarlıyoruz.
      - title: Geliştirme ve Uygulama
        description: |-
          Onaylanan tasarımları hızlı, güvenli, mobil uyumlu ve yönetilebilir dijital sistemlere dönüştürüyoruz.
      - title: Test ve Yayın
        description: |-
          Tüm cihazlarda performans, kullanıcı deneyimi, form ve yönlendirme testlerini tamamlayarak projeyi yayına alıyoruz.
      - title: Optimizasyon ve Büyüme
        description: |-
          Yayın sonrasında verileri takip ediyor, sonuçları analiz ediyor ve markanızın büyümesi için sistemi sürekli geliştiriyoruz.
    ctas:
      - label: Projenizi Birlikte Planlayalım
        href: /iletisim
        variant: primary

  # 11 — NEDEN PIXELON (referansta sağ sütunda alt alta sıralanan liste)
  - type: cards
    background: light
    eyebrow: Bir Ajansın Ötesinde
    heading: Markanız İçin Stratejik, Yaratıcı ve Sonuç Odaklı Bir Ekip
    columns: 1
    items:
      - title: Stratejiyle Başlarız
        description: |-
          Her projeye tasarımla değil, doğru soruları sorarak ve markanın gerçek ihtiyacını anlayarak başlarız.
      - title: Markaya Özel Üretiriz
        description: |-
          Hazır şablonlar ve birbirine benzeyen çözümler yerine markanızın kimliğine özel çalışmalar oluştururuz.
      - title: Tasarım ve Teknolojiyi Birleştiririz
        description: |-
          Estetik görünen çalışmaların aynı zamanda hızlı, işlevsel ve kullanıcı dostu olmasını sağlarız.
      - title: Sonuçları Ölçeriz
        description: |-
          Yaptığımız çalışmaların yalnızca görünümünü değil, trafik, etkileşim, talep ve dönüşüm üzerindeki etkisini takip ederiz.
      - title: Tüm Süreci Tek Ekipte Yönetiriz
        description: |-
          Strateji, tasarım, yazılım, içerik, reklam ve optimizasyon süreçlerini birbiriyle uyumlu biçimde yürütürüz.

  # 12/13 — GLOBAL (ülke çipleri marquee'si + dünya haritası + kapanış cümlesi, tek blok)
  - type: worldMap
    background: dark
    eyebrow: Nerelerdeyiz?
    heading: Pixelon Dünyanın Her Yerinde!
    lead: |-
      Türkiye'den Avrupa'ya ve Afrika'ya uzanan projelerimizde; farklı kültürlere, dillere ve hedef pazarlara uygun iletişim stratejileri geliştiriyoruz. Yerel bir markanın global pazara açılmasından uluslararası bir firmanın dijital dönüşümüne kadar her ölçekte projeye aynı özenle yaklaşıyoruz.
    countries:
      - { label: Türkiye, flag: 🇹🇷, highlighted: true }
      - { label: Almanya, flag: 🇩🇪 }
      - { label: Birleşik Krallık, flag: 🇬🇧 }
      - { label: Fransa, flag: 🇫🇷 }
      - { label: İtalya, flag: 🇮🇹 }
      - { label: İspanya, flag: 🇪🇸 }
      - { label: Romanya, flag: 🇷🇴 }
      - { label: Bulgaristan, flag: 🇧🇬 }
      - { label: Hollanda, flag: 🇳🇱 }
      - { label: İrlanda, flag: 🇮🇪 }
      - { label: Afrika, flag: 🌍 }
    closingLine: Sınırlar değişir, *güçlü marka deneyiminin* kuralları değişmez.
    mapImageAlt: Pixelon global dijital pazarlama projeleri dünya haritası
    ctas:
      - label: Global Projelerimizi İnceleyin
        href: /projelerimiz
        variant: outline

  # 14 — MÜŞTERİ YORUMLARI (referansta 3 yer tutucu kart)
  # Kart üstündeki dekoratif 5 yıldız rozeti (★★★★★) bilinçli olarak içeriğe alınmadı.
  - type: cards
    background: light
    eyebrow: Birlikte Ürettiklerimiz
    heading: Müşterilerimiz Pixelon İçin Ne Diyor?
    lead: |-
      Başarımızı yalnızca tamamladığımız projelerle değil, kurduğumuz uzun soluklu iş birlikleriyle ölçüyoruz.
    columns: 3
    items:
      - eyebrow: Web Tasarım
        title: Ad Soyad
        rating: 5
        description: |-
          "Yayın izni alınmış gerçek müşteri yorumu bu alana eklenecek."
          Pozisyon · Marka
      - eyebrow: Sağlık Turizmi
        title: Ad Soyad
        rating: 5
        description: |-
          "Yayın izni alınmış gerçek müşteri yorumu bu alana eklenecek."
          Pozisyon · Marka
      - eyebrow: Dijital Reklam
        title: Ad Soyad
        rating: 5
        description: |-
          "Yayın izni alınmış gerçek müşteri yorumu bu alana eklenecek."
          Pozisyon · Marka

  # 15 — BLOG (posts koleksiyonundan; referansta 3 yazı)
  # ctaLabel/ctaHref, PostsSection'da ızgaranın altındaki bölüm butonudur (ok işareti
  # bileşen tarafından eklenir); kart içi "Yazıyı Okuyun →" bağlantısı kartın kendisidir.
  - type: posts
    background: light
    anchor: blog
    eyebrow: Pixelon Blog
    heading: Dijital Dünyayı Birlikte Okuyalım
    limit: 3
    ctaLabel: Tüm Yazıları İnceleyin
    ctaHref: /blog

  # 16 — PROFESYONEL PARTNERLER (kayan metin şeridi)
  - type: marquee
    kind: wordmarks
    background: light
    heading: Profesyonel Partnerlerimiz
    lead: |-
      Markaların dijital dünyada güçlü bir varlık oluşturması için sektörün önde gelen platformları ve teknolojileriyle çalışıyoruz.
    items:
      - Google
      - Meta
      - Instagram
      - Facebook
      - WhatsApp
      - YouTube
      - TikTok
      - LinkedIn
      - Yandex

  # 17/18 — İLETİŞİM (metin + iletişim bilgileri + form, referanstaki gibi tek birleşik blok)
