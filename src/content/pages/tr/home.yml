  # ctaLabel/ctaHref, PostsSection'da ızgaranın altındaki bölüm butonudur (ok işareti
  # bileşen tarafından eklenir); kart içi "Yazıyı Okuyun →" bağlantısı kartın kendisidir.
  - type: posts
    background: light
    anchor: blog
    eyebrow: Pixelon Blog
    heading: Dijital Dünyayı Birlikte Okuyalım
    limit: 3
    ctaLabel: Tüm Yazıları İnceleyin
    ctaHref: /blog

  - type: contact
    background: dark
    anchor: iletisim
    eyebrow: Yeni Bir Projeye Başlayalım
    heading: Markanızı Birlikte Büyütelim.
    lead: |-
      Yeni bir web sitesine, etkili bir reklam kampanyasına veya markanızı dijitalde büyütecek kapsamlı bir stratejiye mi ihtiyacınız var? Bize projenizden bahsedin. Pixelon ekibi ihtiyaçlarınızı dinlesin, markanıza özel çözüm önerilerini sizinle paylaşsın.
    ctas:
      - label: WhatsApp'tan Yazın
        href: https://wa.me/905065229034
        variant: primary
      - label: Hemen Arayın
        href: 'tel:+905065229034'
