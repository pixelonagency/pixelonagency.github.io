  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: SEO Danışmanlığı Hakkında Sorular
    items:
      - question: SEO uzmanı ile SEO ajansı arasındaki fark ne?
        answer: >-
          Uzman genellikle tek kişi ve tek bir alanda derin. Ajansta teknik, içerik,
          tasarım ve yazılım aynı ekipte olduğu için bulgular uygulamaya daha hızlı dönüyor.
          Ayrıntısını [SEO uzmanı ne iş yapar](/blog/seo-uzmani-ne-is-yapar/) yazısında
          anlattık.
      - question: Sıralama garantisi veriyor musunuz?
        answer: >-
          Hayır. Sıralamayı Google belirliyor. Garanti yerine ölçülebilir hedefler ve
          gelişmeyi gösteren düzenli bir rapor veriyoruz.
      - question: Danışmanlık ne kadar tutuyor?
        answer: >-
          Kapsama göre değişiyor. Aylık SEO çalışmasının fiyat aralığını
          [SEO fiyatları](/hizmetlerimiz/seo-ve-icerik-pazarlamasi/seo-fiyatlari/)
          sayfasında yazdık.
      - question: Denetime nereden başlanır?
        answer: >-
          Kendi sitenize bakmak isterseniz adımları
          [SEO analizi nasıl yapılır](/blog/seo-analizi-nasil-yapilir/) yazısında
          anlattık.

  - type: cta
    background: dark
    kind: spot
