    headingLines:
      - 'Ne Yapılacağını Değil, *Önce Neyin* Yapılacağını Bilin.'
    lead: >-
      Çoğu sitede SEO'nun sorunu bilgi eksikliği değil, öncelik eksikliği. Sitenizi
      inceliyor, bulguları etkisine göre sıralıyor ve ekibinizin ya da bizim uygulayacağı
      net bir yol haritası çıkarıyoruz.
    video:
