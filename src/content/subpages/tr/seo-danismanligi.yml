  - type: text
    background: light
    layout: split
    eyebrow: Danışmanlık mı, Yönetim mi?
    heading: Uygulamayı Kimin Yapacağına Göre Seçin
    body: |-
      Sitenizde içerik yazan, geliştirme yapan bir ekibiniz varsa eksik olan çoğu zaman yön. Hangi sayfa önce düzeltilmeli, hangi aramaya hangi sayfa cevap vermeli, hangi teknik hata gerçekten önemli? Danışmanlık bu soruların cevabını verir, uygulamayı ekibiniz yapar.

      Ekibiniz yoksa ya da zamanı yetmiyorsa, aynı yol haritasını biz uygularız. İki durumda da başlangıç aynı: sitenin bugünkü halini veriyle görmek.

      Ölçümü tahminle değil kaynağından yapıyoruz: Search Console'da hangi sorgunun hangi sayfaya geldiğini, Semrush'ta rakiplerin hangi aramalarda güçlü olduğunu, Analytics'te organik trafiğin işe dönüşüp dönüşmediğini okuyoruz.
    highlight: İyi bir SEO planı kısa bir listedir; uzun olan, önceliği belirlenmemiş olandır.

  - type: cards
    background: dark
    kind: feature
    columns: 2
    eyebrow: Danışmanlık Kapsamı
    heading: Neye Bakıyor, Ne Teslim Ediyoruz?
    items:
      - title: Teknik denetim
        description: >-
          Tarama, indeksleme, hız, mobil uyumluluk, yönlendirmeler, canonical ve
          yapılandırılmış veri.
        icon: seo
      - title: Anahtar kelime ve rakip araştırması
        description: >-
          Hangi aramaların gerçekten aranıp aranmadığı, rakiplerin güçlü olduğu alanlar ve
          sizin gerçekçi şansınız.
        icon: strategy
      - title: İçerik ve sayfa planı
        description: >-
          Hangi sayfanın hangi aramaya cevap vereceği, hangi içeriklerin eksik olduğu ve
          birbiriyle yarışan sayfalar.
        icon: craft
      - title: Önceliklendirilmiş yol haritası
        description: >-
          Bulguların etkisine ve emeğine göre sıralandığı, ekibinizin takip edebileceği bir
          uygulama listesi.
        icon: orbit

  - type: steps
    background: light
    kind: timeline
    eyebrow: Süreç
    heading: Denetimden Yol Haritasına
    items:
      - title: Erişim ve veri
        description: Search Console ve Analytics erişimiyle sitenin bugünkü hali ölçülüyor.
      - title: Denetim
        description: Teknik, içerik ve rakip tarafı ayrı ayrı inceleniyor.
      - title: Yol haritası
        description: Bulgular etkisine göre sıralanıp yazılı bir plana dönüşüyor.
      - title: Sunum ve yönlendirme
        description: Plan ekibinizle birlikte konuşuluyor, uygulama sırasında sorular cevaplanıyor.

  - type: projects
    background: light
    eyebrow: Projeler
    heading: Arama Görünürlüğünü Kurduğumuz Markalar
    slugs:
