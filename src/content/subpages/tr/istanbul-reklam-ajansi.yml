  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: İstanbul Reklam Ajansı Hakkında Sorular
    items:
      - question: Ofisinize gelip yüz yüze görüşebilir miyiz?
        answer: >-
          Evet. Ekibimiz Kadıköy'de. İstanbul'daysanız ilk görüşmeyi yüz yüze yapabiliriz,
          değilseniz ekran başında aynı şekilde çalışıyoruz.
      - question: Sadece İstanbul'daki işletmelerle mi çalışıyorsunuz?
        answer: >-
          Hayır. Türkiye'nin farklı şehirlerinde ve yurt dışında da kampanya yönetiyoruz;
          20'den fazla ülkede, 13 dilde reklam yönettik. Sağlık turizmi tarafını
          [sağlık turizmi reklamları](/hizmetlerimiz/dijital-reklam-yonetimi/saglik-turizmi-reklamlari/)
          sayfasında anlattık.
      - question: Reklam yönetimi ne kadar?
        answer: >-
          Reklam yönetimi aylık 15.000 TL ile 25.000 TL arasında, KDV hariç; reklam bütçesi
          ayrı. Ayrıntılar
          [reklam yönetimi fiyatları](/hizmetlerimiz/dijital-reklam-yonetimi/reklam-yonetimi-fiyatlari/)
          sayfasında.
      - question: Reklamın videosunu da çekiyor musunuz?
        answer: >-
          Evet. Çekimi işletmenizde, yerinde yapıyoruz. Çekim ve kurgu tarafını
          [içerik üretimi ve Reels](/hizmetlerimiz/sosyal-medya-yonetimi/icerik-uretimi-ve-reels/)
          sayfasında anlattık.
      - question: Web sitemizi ve SEO'muzu da yapıyor musunuz?
        answer: >-
          Evet. Kadıköy'deki aynı ekiple [İstanbul web tasarım](/hizmetlerimiz/web-tasarim-ve-yazilim/istanbul-web-tasarim/) ve [İstanbul SEO ajansı](/hizmetlerimiz/seo-ve-icerik-pazarlamasi/istanbul-seo-ajansi/) hizmeti de veriyoruz; reklamın indiği sayfa ve organik görünürlük birlikte planlanıyor.

