  - type: text
    background: light
    layout: split
    eyebrow: Şehir İçinde Reklam
    heading: İstanbul Tek Bir Pazar Değil
    body: |-
      İstanbul'da reklam verirken en sık yapılan hata, şehri tek bir hedef bölge olarak seçmek. Kadıköy'deki bir kliniğin hastası çoğu zaman Anadolu Yakası'ndan geliyor; Beylikdüzü'ndeki biri için köprüyü geçmek ayrı bir karar. Bütçe şehrin tamamına yayıldığında gelmesi zor kişilere de harcanıyor.

      Bu yüzden kampanyaları hizmetin gerçekten ulaşabildiği ilçelere göre kuruyoruz. Google'da yakın çevrede arayan kişiye, Instagram'da işletmenin çevresindeki kitleye ulaşan ayrı kampanyalar açıyor, hangi bölgenin talep getirdiğini ölçüyoruz. Aynı yaklaşımı Almanya'da Çağla Aytaç için de uyguladık: Castrop, Köln ve Frankfurt'taki her hizmet noktası kendi çevresine kendi reklamıyla ulaşıyor.

      Aynı şehirde olmanın bir faydası da çekim. Reklamın videosunu işletmenizde, yerinde çekiyoruz; Touch Consulting'in videolarını da biz çektik.
    highlight: Reklam bütçesi şehrin tamamına değil, müşterinin gerçekten geldiği yere harcanmalı.

