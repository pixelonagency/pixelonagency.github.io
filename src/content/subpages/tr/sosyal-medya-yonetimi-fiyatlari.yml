      - sera-natura
      - cagla-aytac
    columns: 3
    kind: grid
    ctaLabel: Sosyal medya örneklerini inceleyin
    ctaHref: /projelerimiz/sosyal-medya/

  # 8. SSS: fiyat aramalarındaki soru kalıpları.
  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: Sosyal Medya Yönetimi Fiyatları Hakkında Sorular
    items:
      - question: Sosyal medya yönetimi aylık ne kadar?
        answer: >-
          Pixelon'da sosyal medya yönetimi aylık 20.000 TL'den, video çekimli paket
          30.000 TL'den, reklam yönetimli paket 45.000 TL'den başlıyor, KDV hariç. Kesin
          rakamı içeriğin nereden geldiği, platform ve dil sayısı belirliyor.
      - question: Reklam bütçesi fiyata dahil mi?
        answer: >-
          Hayır. Paket fiyatı yönetim ücretidir. Reklam bütçesi ayrı bir kalem olarak
          doğrudan Meta'ya ödenir; ne kadar harcandığını reklam hesabında siz de
          görürsünüz.
      - question: Video çekimi ayrıca alınabilir mi?
        answer: >-
          Evet. Çekim ve kurgu, hesap yönetimi olmadan da planlanabiliyor. Nasıl
          çalıştığımızı [içerik üretimi ve Reels çekimi](/hizmetlerimiz/sosyal-medya-yonetimi/icerik-uretimi-ve-reels/)
          sayfasında anlattık.
      - question: Şehir dışında ya da yurt dışında çekim yapıyor musunuz?
        answer: >-
          Evet. Uygun şartlar sağlandığında Türkiye'nin ve dünyanın her yerinde çekim
          yapıyoruz; Antalya'da ve Kenya'da yaptığımız çekimler bunlardan ikisi.
      - question: Teklifleri nasıl karşılaştırmalıyım?
        answer: >-
          Rakama değil kapsama bakın: ayda kaç içerik, hangi formatta, çekim var mı, reklam
          yönetimi dahil mi, rapor neyi ölçüyor? Ajansla çalışırken nelere dikkat
          edileceğini [sosyal medya ajansı ne iş yapar](/blog/sosyal-medya-ajanslari-ne-is-yapar/)
          yazısında anlattık.

  # 9. KAPANIŞ
