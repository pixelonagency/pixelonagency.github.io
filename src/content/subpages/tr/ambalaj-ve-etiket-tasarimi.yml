  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: Ambalaj ve Etiket Tasarımı Hakkında Sorular
    items:
      - question: Tek bir ürün için de etiket tasarlıyor musunuz?
        answer: >-
          Evet. Ama ileride yeni ürün eklenecekse etiketi baştan bir sistem olarak kurmayı
          öneriyoruz; böylece her yeni ürün için tasarım sıfırdan başlamıyor.
      - question: Etikette hangi bilgiler yer almalı?
        answer: >-
          Ürün grubuna göre zorunlu bilgiler değişiyor; bunları üretici ya da ilgili mevzuat
          belirliyor. Biz bu bilgilerin okunabilir bir hiyerarşiyle yerleşmesini sağlıyoruz.
          Ayrıntısı [ambalaj ve etiket tasarımı](/blog/ambalaj-ve-etiket-tasarimi/)
          yazısında.
      - question: Ambalaj tasarımı ne kadar tutuyor?
        answer: >-
          Ürün sayısına ve kapsama göre değişiyor; kurumsal kimlik çalışması 15.000 TL'den
          başlıyor, KDV hariç. Ayrıntılar
          [kurumsal kimlik fiyatları](/hizmetlerimiz/marka-ve-kurumsal-kimlik/kurumsal-kimlik-fiyatlari/)
          sayfasında.
      - question: Ürün fotoğrafı ve e-ticaret de yapıyor musunuz?
        answer: >-
          Evet. Ambalajın ürün sayfasında ve sosyal medyada nasıl göründüğü de işin parçası;
          e-ticaret tarafını [e-ticaret çözümleri](/hizmetlerimiz/e-ticaret-cozumleri/)
          sayfasında anlattık.

