  - type: text
    background: light
    layout: split
    eyebrow: Sera Natura
    heading: Yeni Ürün Eklendiğinde Tasarım Yeniden Kurgulanmıyor
    body: |-
      Doğal ürün kategorisinde iki uç var: fazla sade kalıp ucuz görünmek ya da fazla süsleyip inandırıcılığı kaybetmek. Sera Natura'yı bu ikisinin arasında konumlandırdık. Amber cam şişe ve altın kapak seçiminin üzerine, her ürünün kendi botanik illüstrasyonunu taşıyan bir etiket sistemi kurduk.

      Nioli, Servi ve Portakal Kabuğu gibi her üründe merkezde marka arması, yanında ürünün botanik illüstrasyonu ve köşede "%100 Pure" rozeti var. Yerleşim, tipografi ve rozet düzeni aynı; değişen yalnızca bitki illüstrasyonu ve renk aksanı. Latince ad, hacim ve buhar distilasyonu yöntemi gibi bilgiler okunabilir bir hiyerarşiyle yerleşiyor.

      Sistemi amber cam üzerinde, açık ve koyu sunum zeminlerinde test ederek her yerde aynı okunaklılığı koruduğunu doğruladık. Aynı dil sosyal medyaya, reklama ve e-postaya taşındı.
    highlight: İyi bir etiket sistemi, yirminci ürünü ilk ürün kadar kolay tasarlatır.

  - type: cards
    background: dark
    kind: feature
    columns: 2
    eyebrow: Nasıl Çalışıyoruz
    heading: Bir Ambalaj Sisteminin Dört Kararı
    items:
      - title: Konumlandırma
        description: >-
          Ürün rafta kimin yanında duruyor, alıcı neye bakarak güveniyor? Tasarımın yönü bu
          cevaptan çıkıyor.
        icon: strategy
      - title: Gam sistemi
        description: >-
          Sabit kalan ve ürüne göre değişen öğeler baştan belirleniyor; yeni ürün aynı
          sisteme kolayca ekleniyor.
        icon: orbit
      - title: Bilgi hiyerarşisi
        description: >-
          Ürün adı, içerik ve zorunlu bilgiler, görsel yük yaratmadan okunabilir bir sırayla
          yerleşiyor.
        icon: craft
      - title: Baskı ve test
        description: >-
          Farklı zeminlerde ve malzemelerde okunaklılık test ediliyor, dosyalar baskıya
          hazır teslim ediliyor.
        icon: commerce

  - type: projects
