  - type: text
    background: light
    layout: split
    eyebrow: Bir Videonun Ömrü
    heading: Her Video Tek Bir Soruya Cevap Veriyor
    body: |-
      Sosyal medyada izlenen videoların çoğu, izleyicinin zaten merak ettiği bir soruyu başlıkta açıkça soruyor. "Karın germe sonrası doğum yapılabilir mi?", "Cilt bariyeri bozulursa ne olur?" Op. Dr. İsmail Büyükçayır ve Dr. Ayşe Cinkaya Kahveci için çektiğimiz videolar bu sorular üzerine kurulu.

      Bu yüzden çekim günü değil, senaryo masası önemli. Hangi sorunun cevaplanacağı, ilk iki saniyede ne söyleneceği ve videonun nasıl biteceği çekimden önce yazılıyor. Kamera karşısına geçen kişi ne anlatacağını biliyor ve tek bir çekim gününden birden fazla videonun malzemesi çıkıyor.

      Kurguda altyazı standart. Sosyal medyada izlemelerin çoğu sesi kapalı başlıyor; altyazısız bir video, izleyicinin büyük kısmına hiçbir şey anlatmıyor.
    highlight: İyi bir video çekim gününde değil, senaryo masasında başlıyor.

