  - type: faq
    background: light
    eyebrow: Merak Edilenler
    heading: İçerik Üretimi ve Reels Çekimi Hakkında Sorular
    items:
      - question: Çekimleri kendi ekibiniz mi yapıyor?
        answer: >-
          Evet. Senaryo, çekim, kurgu ve tasarım aynı ekipte. Klinik, saha ya da ofis;
          çekimi içeriğin gerektirdiği yerde yapıyoruz.
      - question: İstanbul dışında çekim yapıyor musunuz?
        answer: >-
          Evet. Ekibimiz Kadıköy'de, ama uygun şartlar sağlandığında Türkiye'nin ve
          dünyanın her yerinde çekim yapıyoruz; Antalya'da ve Kenya'da yaptığımız
          çekimler bunlardan ikisi. Lokasyon ve yol planı, çekim gününün içerik
          listesiyle birlikte önceden hazırlanıyor.
      - question: Ayda kaç video çekiliyor?
        answer: >-
          Markanın hedefine ve seçilen kapsama göre değişiyor. Tek bir çekim gününde
          birden fazla videonun malzemesi çıkarılıyor; bu yüzden çekimler önceden
          planlanan içerik listesine göre yapılıyor.
      - question: Kamera karşısına geçmek zorunda mıyım?
        answer: >-
          Zorunlu değil, ama güveni en çok kuran içerik genellikle işi yapan kişinin
          kendi anlatımı. Kamera karşısında rahat değilseniz ürün, saha ve UGC
          formatlarıyla da çalışılabiliyor.
      - question: Sadece içerik üretimi alabilir miyim, hesap yönetimi olmadan?
        answer: >-
          Evet. Çekim ve tasarım tek başına da planlanabiliyor. Hesap yönetimiyle birlikte
          yürüdüğünde hangi içeriğin işe yaradığını ölçüp bir sonraki çekimi ona göre
          planlayabiliyoruz.

