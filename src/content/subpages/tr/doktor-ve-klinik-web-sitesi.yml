  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: Doktor ve Klinik Web Sitesi Hakkında Sorular
    items:
      - question: Doktor web sitesinde nelere dikkat etmek gerekiyor?
        answer: >-
          Sağlık hizmetlerinin tanıtımı kurallara bağlı. Sitede abartılı vaat, kesin sonuç
          ya da karşılaştırmalı üstünlük iddiası yerine bilgilendirici bir dil kullanıyoruz
          ve uygulama sayfalarına bilgilendirme notu ekliyoruz. Metinlerin son onayı her
          zaman hekimde.
      - question: Siteyi birden fazla dilde yapabiliyor musunuz?
        answer: >-
          Evet, en çok yaptığımız işlerden biri bu. Dentasay'ı 13 dile, Dr. Ayşe Cinkaya
          Kahveci'yi 6 dile taşıdık. Her dil için ayrı içerik, dil etiketleri ve panelde çift
          dilli düzen kuruluyor.
      - question: Klinik web sitesi ne kadar sürede hazır olur?
        answer: >-
          Ortalama 30 gün. Süreyi en çok hekim onayı ve fotoğraf çekimi belirliyor; bu yüzden
          ilk hafta içerik ve çekim takvimini birlikte çıkarıyoruz.
      - question: Klinik web sitesi fiyatı ne kadar?
        answer: >-
          Kurumsal siteler 50.000 TL'den başlıyor, KDV hariç. Dil sayısı ve randevu ya da CRM
          bağlantısı fiyatı değiştiriyor. Paketlerin tamamı
          [web sitesi fiyatları](/hizmetlerimiz/web-tasarim-ve-yazilim/web-sitesi-fiyatlari/)
          sayfasında.

