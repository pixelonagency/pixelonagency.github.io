  # Sonuç önce: sağlık okuru kanıt arıyor.
  - type: stats
    background: light
    eyebrow: Klinik Projelerimizden
    heading: Sitenin Arkasındaki Sonuçlar
    items:
      - value: 13
        suffix: ' dil'
        label: Dentasay
        description: Tek dilli siteden 20 ülkeye hitap eden yapıya.
      - value: 25
        prefix: '%'
        label: Dr. Ayşe Cinkaya Kahveci
        description: İlk yılda hasta potansiyelindeki artış, altı dilli siteyle.
      - value: 30
        prefix: '%'
        label: Çağla Aytaç
        description: Almanya'da yeni ön görüşmelerdeki artış, üç şehirde.

  - type: text
    background: dark
    layout: split
    eyebrow: Hasta Ne Arıyor
    heading: Hasta Sizi Değil, Kendi Şikâyetini Arıyor
    body: |-
      Kimse "dermatoloji kliniği" yazıp gelmiyor. "Göz altı morluğu neden geçmez", "dudak dolgusu ne kadar kalıcı" yazıp geliyor. Sitenin ilk işi, o soruyu soran kişiyi kendi durumunun anlatıldığı sayfaya indirmek.

      Dr. Ayşe Cinkaya Kahveci'nin sitesinde her uygulama kendi sayfasını aldı; dolgu sayfasında burun, dudak, göz altı ve çene bölgeleri tek tek seçilebiliyor. Genel dermatoloji ise ayrı bir ızgarada: egzama, sedef, vitiligo. Şikâyetiyle gelen hasta kendi durumunu saniyeler içinde buluyor.

      Sonra güven geliyor: hekimin özgeçmişi, danışan yorumları, cihaz sertifikaları. Ve her sayfa bir randevu çağrısıyla bitiyor.
    highlight: Hasta aradığını bulduğu sayfada karar veriyor. O sayfanın sonunda randevu yolu yoksa karar başka bir kliniğe gidiyor.

  - type: cards
    background: light
    kind: feature
    columns: 2
    eyebrow: Kurduğumuz Yapılar
    heading: Bir Klinik Sitesinde Dört Karar
    items:
      - title: Tedaviye göre değil, şikâyete göre mimari
        description: >-
          Uygulamalar kendi kategorisinde, hastalıklar kendi ızgarasında. Hasta tıp dilini
          bilmek zorunda kalmadan kendi durumuna ulaşıyor.
        icon: strategy
      - title: Her dilde ayrı bir hasta kapısı
        description: >-
          Dentasay'da 13, Dr. Ayşe Cinkaya Kahveci'de 6 dil. Çeviri değil, her pazarın kendi
          sorularına göre kurgulanmış sayfalar ve dil etiketleri.
        icon: orbit
      - title: Yerel kanıt, gerçek mekân
        description: >-
          Çağla Aytaç'ta üç şubenin gerçek fotoğrafları, Google ve Trustpilot değerlendirmeleri
          ve ekibin tek tek tanıtıldığı bir bölüm. Stok görsel yok.
        icon: craft
      - title: Randevu her sayfanın sonunda
        description: >-
          Form, WhatsApp ve telefon her tedavi sayfasında aynı yerde. Hangi sayfanın kaç
          randevu getirdiği ölçülüyor.
        icon: partnership

  - type: bullets
    background: dark
    kind: check
    eyebrow: Kontrol Listesi
    heading: Bir Klinik Sitesinde Olması Gerekenler
    items:
      - Her tedavi ve uygulama için ayrı, açıklayıcı bir sayfa
      - Hekimin özgeçmişi, uzmanlığı ve fotoğrafı
      - Kliniğin gerçek fotoğrafları, adresi ve haritası
      - Randevu formu, WhatsApp ve telefon her sayfada
      - Yurt dışından hasta alıyorsanız her dilde ayrı sayfalar
      - Bilgilendirici, abartısız ve tanıtım kurallarına uygun dil
      - Telefonda hızlı açılan, rahat okunan sayfalar
      - Randevu taleplerinin ölçüldüğü analiz kurulumu

  - type: projects
    background: light
    eyebrow: Projeler
    heading: Kurduğumuz Sağlık Siteleri
    slugs:
