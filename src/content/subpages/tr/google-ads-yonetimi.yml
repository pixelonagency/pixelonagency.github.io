  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: Google Ads Yönetimi Hakkında Sorular
    items:
      - question: Google Ads ajansı ile Google Ads uzmanı arasındaki fark ne?
        answer: >-
          Uzman genellikle yalnızca reklam hesabını yönetir. Ajans ise reklamın indiği
          sayfayı, reklam içeriğini, dönüşüm takibini ve gelen talebin nasıl karşılandığını
          da kapsar. Reklam performansı çoğu zaman hesabın içinde değil, bu halkalarda
          kaybedilir.
      - question: Google Ads yönetimi ne kadar?
        answer: >-
          Reklam yönetimi aylık 15.000 TL ile 25.000 TL arasında, KDV hariç; reklam bütçesi
          ayrı ve doğrudan Google'a ödenir. Ayrıntılar
          [reklam yönetimi fiyatları](/hizmetlerimiz/dijital-reklam-yonetimi/reklam-yonetimi-fiyatlari/)
          sayfasında. Bütçenin nasıl belirlendiğini
          [Google Ads bütçesi](/blog/google-ads-butcesi-nasil-belirlenir/) yazısında anlattık.
      - question: Reklam hesabı kimin adına açılıyor?
        answer: >-
          Sizin adınıza. Hesap, geçmiş veriler ve dönüşüm kurulumları çalışma sona erdiğinde
          de sizde kalıyor.
      - question: Google mı Meta mı?
        answer: >-
          Hizmetiniz aranıyorsa Google, gösterilerek anlatılması gerekiyorsa Meta genellikle
          daha iyi başlangıç. Çoğu markada ikisi birlikte çalışıyor; farkını
          [Google Ads mi Meta Ads mi](/blog/google-ads-mi-meta-ads-mi/) yazısında anlattık.

