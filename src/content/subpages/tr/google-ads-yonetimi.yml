    background: dark
    kind: spot
    heading: Bütçenizin Nereye Gittiğini Birlikte Görelim
    lead: >-
      Mevcut hesabınızı ya da hedefinizi anlatın; hangi aramalarda, hangi sayfayla ve ne
      kadar bütçeyle başlamak gerektiğini ilk görüşmede çıkaralım.
