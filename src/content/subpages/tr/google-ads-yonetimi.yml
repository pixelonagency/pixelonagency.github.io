  - type: stats
    background: light
    eyebrow: Rakamlarla
    heading: Google ve Meta'da Yönettiğimiz Kampanyalar
    items:
      - value: 1000
        suffix: '+'
        label: Yayına alınan kampanya
        description: Arama, görüntülü, video, alışveriş ve talep toplama.
      - value: 20
        suffix: '+'
