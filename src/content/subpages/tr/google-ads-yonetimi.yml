  - type: text
    background: dark
    layout: split
    eyebrow: Arama Niyeti
    heading: Google'da Reklam, Talebi Yaratmaz, Yakalar
    body: |-
      Instagram'da reklam, kişiyi henüz aramadığı bir şeyle tanıştırır. Google'da ise kişi zaten arıyor: "Manavgat dermatolog", "implant fiyatı", "kurumsal web sitesi". Bu yüzden Google reklamında asıl iş, doğru aramayı seçmek ve o aramayı yapan kişiye doğru sayfayı göstermek.

      Bütçenin en çok kaybolduğu yer de burası. Geniş eşlemeli anahtar kelimeler, ilgisiz aramalardan gelen tıklamalar ve ana sayfaya düşen reklamlar tıklama sayısını büyütüyor, talebi değil. Hesabı arama terimi raporuyla düzenli olarak temizliyor, her hizmet için ayrı bir sayfaya yönlendiriyoruz.

      Dentasay'da her tedavinin kendi landing page'i var ve kampanyalar ülke ve dil bazında ayrışıyor. Reklamın indiği sayfa, kampanyanın bir parçası olarak kuruluyor.
    highlight: Google reklamında tıklamayı reklam getirir, talebi reklamın indiği sayfa.

  - type: cards
    background: light
    kind: feature
    columns: 2
    eyebrow: Kampanya Türleri
    heading: Hangi Google Kampanyası, Ne İşe Yarar?
    items:
      - title: Arama ağı
        description: >-
          Hizmetinizi arayan kişiye arama sonucunda çıkan metin reklamlar. Talep toplamak
          için çoğu işletmenin başlangıç noktası.
        icon: strategy
      - title: Performance Max
        description: >-
          Arama, YouTube, Gmail, Haritalar ve görüntülü ağda tek kampanya. Doğru dönüşüm
          verisiyle beslendiğinde güçlü, veri olmadan kontrolsüz.
        icon: orbit
      - title: YouTube ve video
        description: >-
          Ürünü ya da hizmeti göstermek gereken işlerde bilinirlik ve yeniden pazarlama
          için video reklamlar.
        icon: craft
      - title: Yeniden pazarlama
        description: >-
          Sitenizi ziyaret edip talep bırakmayan kişilere yeniden ulaşan kampanyalar.
          Kararı uzun süren hizmetlerde en verimli bütçe kalemlerinden biri.
        icon: partnership

  - type: steps
    background: dark
    kind: timeline
    eyebrow: Süreç
    heading: Hesap Denetiminden Rapora
    items:
      - title: Hesap denetimi
        description: Mevcut hesap varsa kayıp bütçe, ilgisiz aramalar ve eksik ölçüm tespit ediliyor.
      - title: Anahtar kelime ve yapı
        description: Aramalar hizmetlere göre gruplanıyor, negatif kelimeler baştan ekleniyor.
      - title: Reklam ve sayfa
        description: Reklam metni ile indiği sayfa aynı sözü veriyor, her hizmet kendi sayfasına gidiyor.
      - title: Dönüşüm takibi
        description: Form, arama ve WhatsApp tıklamaları Google Ads'e dönüşüm olarak bağlanıyor.
      - title: Optimizasyon ve rapor
        description: Arama terimleri, teklif ve bütçe düzenli olarak gözden geçiriliyor, sonuç aylık raporlanıyor.

  - type: bullets
    background: light
    kind: check
    eyebrow: Google Ads Danışmanlığı
    heading: Hesabı Kendiniz mi Yönetiyorsunuz?
    lead: >-
      Yönetimi devralmadan da çalışabiliyoruz. Kendi ekibiyle reklam veren firmalar için
      denetim ve danışmanlık kapsamında şunlara bakıyoruz:
    items:
      - Bütçenin hangi aramalara harcandığı
      - Negatif anahtar kelime listesinin durumu
      - Dönüşüm takibinin doğru kurulup kurulmadığı
      - Reklamların hangi sayfaya indiği
      - Kampanya yapısının hizmetlerle örtüşmesi
      - Ekibinizin bundan sonra neye bakması gerektiği

  - type: projects
    background: light
    eyebrow: Projeler
    heading: Google Reklamlarını Yönettiğimiz Markalar
    slugs:
