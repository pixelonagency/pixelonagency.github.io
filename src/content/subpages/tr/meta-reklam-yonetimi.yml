  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: Meta Reklam Yönetimi Hakkında Sorular
    items:
      - question: Gönderiyi öne çıkarmak ile Reklam Yöneticisi arasındaki fark ne?
        answer: >-
          Öne çıkarma hızlı ama sınırlı: hedef, yerleşim ve ölçüm seçenekleri az. Reklam
          Yöneticisi'nde kampanya hedefi, kitle, yerleşim ve dönüşüm takibi ayrı ayrı
          kuruluyor. Adım adım anlatımı
          [Instagram reklam nasıl verilir](/blog/instagram-reklam-nasil-verilir/) yazısında.
      - question: Meta reklam yönetimi ne kadar?
        answer: >-
          Reklam yönetimi aylık 15.000 TL ile 25.000 TL arasında, KDV hariç; reklam bütçesi
          ayrı ve doğrudan Meta'ya ödenir. Ayrıntılar
          [reklam yönetimi fiyatları](/hizmetlerimiz/dijital-reklam-yonetimi/reklam-yonetimi-fiyatlari/)
          sayfasında.
      - question: Reklamlarım neden sonuç vermiyor?
        answer: >-
          En sık sebepler yanlış kampanya hedefi, zayıf kreatif ve reklamdan sonraki
          adımın kopuk olması. Ayrıntısını
          [Meta reklamları neden sonuç vermiyor](/blog/meta-reklamlari-neden-sonuc-vermiyor/)
          yazısında anlattık.
      - question: Sosyal medya yönetimiyle birlikte alınabilir mi?
        answer: >-
          Evet. Hesap yönetimi, aylık çekim ve reklam birlikte 45.000 TL'den başlıyor, KDV
          hariç. Paketleri
          [sosyal medya yönetimi fiyatları](/hizmetlerimiz/sosyal-medya-yonetimi/sosyal-medya-yonetimi-fiyatlari/)
          sayfasında yazdık.

