  - type: text
    background: dark
    layout: split
    eyebrow: Hedefleme ve Kreatif
    heading: Kitleyi Platform Buluyor, Durduran Şey Reklam
    body: |-
      Birkaç yıl önce Meta reklamında iş, ilgi alanlarını tek tek seçmekti. Bugün geniş hedeflemeyle açılan kampanyalarda kimin göreceğine büyük ölçüde platform karar veriyor. Bizim karar verdiğimiz şey, o kişinin akışta karşısına ne çıkacağı.

      Sera Natura'da ürünün ne işe yaradığını gerçek kullanıcının anlattığı UGC videoları reklamda bir milyonun üzerinde izlendi. Çağla Aytaç'ta reklamların tamamı Almanca ve videoya dayalı; her şehir için ayrı kampanya kuruldu. Dr. Ayşe Cinkaya Kahveci'de reklamlar Türkçenin yanında Rusça, Almanca, İngilizce ve Arapça yayınlandı.

      Reklamın sonu da en az başı kadar önemli. Mesaja açılan bir kampanyada ilk cevabın hızı, formla toplanan talepte ise formun kaç soru sorduğu sonucu belirliyor.
    highlight: Aynı bütçe, farklı bir videoyla bambaşka sonuç veriyor.

  - type: cards
    background: light
    kind: feature
    columns: 2
    eyebrow: Kampanya Türleri
    heading: Neyi Hedefliyorsanız, Ona Göre Kampanya
    items:
      - title: Mesaj kampanyaları
        description: >-
          WhatsApp, Instagram ya da Messenger'a açılan reklamlar. Klinik ve hizmet
          işletmelerinde en hızlı talep yolu.
        icon: partnership
      - title: Form kampanyaları
        description: >-
          Uygulamadan çıkmadan doldurulan kısa formlar. Az soru daha çok talep, doğru soru
          daha nitelikli talep getiriyor.
        icon: strategy
      - title: Satış ve katalog
        description: >-
          E-ticaret için ürün kataloğu ve satın alma hedefli kampanyalar; piksel ve
          dönüşüm verisiyle besleniyor.
        icon: commerce
      - title: Video ve UGC reklam
        description: >-
          Reklamın videosunu, metnini ve görselini de biz üretiyoruz; aynı mesaj için
          birden fazla kreatif hazırlanıyor.
        icon: craft

  - type: steps
    background: dark
    kind: timeline
    eyebrow: Süreç
    heading: Kurulumdan Rapora
    items:
      - title: Hesap ve piksel
        description: İşletme hesabı, reklam hesabı, piksel ve dönüşüm olayları kontrol ediliyor.
      - title: Hedef ve kitle
        description: Mesaj, form ya da satış; hedef ve kitle kurgusu buna göre seçiliyor.
      - title: Kreatif üretimi
        description: Aynı mesaj için birden fazla video ve görsel hazırlanıyor.
      - title: Test
        description: Kreatifler ve kitleler karşılaştırılıyor, kazanan ölçeklendiriliyor.
      - title: Optimizasyon ve rapor
        description: Talep başına maliyet ve gelen talebin kalitesi aylık raporlanıyor.

