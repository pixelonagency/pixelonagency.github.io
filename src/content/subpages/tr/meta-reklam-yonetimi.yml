    heading: Reklamınızın İlk Saniyesini Birlikte Kuralım
    lead: >-
      Ne sattığınızı ve reklamdan ne beklediğinizi anlatın; hangi kampanya türüyle ve
      hangi kreatifle başlamak gerektiğini birlikte çıkaralım.
