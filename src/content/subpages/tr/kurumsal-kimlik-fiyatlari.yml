  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: Kurumsal Kimlik Fiyatları Hakkında Sorular
    items:
      - question: Kurumsal kimlik çalışması ne kadar?
        answer: >-
          Pixelon'da kurumsal kimlik çalışması 15.000 TL'den başlıyor, KDV hariç. Kesin
          rakamı uygulama sayısı, kılavuzun kapsamı ve varsa ambalaj ihtiyacı belirliyor.
      - question: Logo tasarımı ne kadar?
        answer: >-
          Logo tasarımının fiyatı isteğe göre değişiyor: yalnızca yazıdan oluşan bir logo
          ile özel bir amblem ve birden fazla konsept farklı emek istiyor. Süreci
          [logo tasarımı](/hizmetlerimiz/marka-ve-kurumsal-kimlik/logo-tasarimi/)
          sayfasında anlattık.
      - question: Neden tek bir fiyat vermiyorsunuz?
        answer: >-
          Çünkü aynı adı taşıyan iki kimlik çalışması bambaşka kapsamlar olabiliyor.
          Başlangıç rakamını yayınlıyoruz ki bütçesi bunun altında kalan işletme vakit
          kaybetmesin.
      - question: Kurumsal kimliğe neler dahil?
        answer: >-
          Kapsama göre logo, renk paleti, yazı karakteri, kartvizit, antetli kağıt, sunum ve
          sosyal medya şablonları ile kullanım kılavuzu. Kılavuzun içeriğini
          [kurumsal kimlik kılavuzu nedir](/blog/kurumsal-kimlik-kilavuzu-nedir/) yazısında
          anlattık.

