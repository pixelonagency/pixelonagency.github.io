    eyebrow: Merak Edilenler
    heading: Sağlık Turizmi Reklamları Hakkında Sorular
    items:
      - question: Klinikler reklam verebilir mi?
        answer: >-
          Türkiye'de sağlık hizmetlerinin tanıtımı yönetmelikle sınırlı; Google ve Meta'nın
          da sağlık reklamları için ayrı politikaları var. Bilgilendirici içerik ile talep
          yaratmaya yönelik tanıtım arasındaki çizgi ülkeye ve platforma göre değişiyor.
          Kampanyanın dilini bu çerçevede kuruyoruz; hukuki değerlendirme için kliniğin
          kendi danışmanının görüşü esas.
      - question: Hangi ülkelerde reklam veriyorsunuz?
        answer: >-
          Avrupa, Körfez, Kuzey Afrika ve Rusça konuşulan pazarlar dahil 20'den fazla
          ülkede kampanya yönettik. Hedef ülkeyi hastanın nereden geldiğine ve kliniğin
          hangi dilde hizmet verebildiğine göre seçiyoruz.
      - question: Reklam yönetimi ne kadar?
        answer: >-
          Reklam yönetimi aylık 15.000 TL ile 25.000 TL arasında, KDV hariç; reklam bütçesi
          ayrı. Çok ülkeli ve çok dilli büyük projeler için ayrıca teklif veriyoruz.
          Ayrıntılar [reklam yönetimi fiyatları](/hizmetlerimiz/dijital-reklam-yonetimi/reklam-yonetimi-fiyatlari/)
          sayfasında.
      - question: Sosyal medyayı da yönetiyor musunuz?
        answer: >-
          Evet. Hekimin kendi anlatımıyla video ve hasta sorularına dayalı içerikle
          çalışıyoruz; ayrıntısı
          [doktor ve klinik sosyal medya](/hizmetlerimiz/sosyal-medya-yonetimi/doktor-ve-klinik-sosyal-medya/)
          sayfasında.

