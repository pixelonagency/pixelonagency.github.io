    eyebrow: Çeviri Değil Yerelleştirme
    heading: Aynı Reklam, Her Ülkede Başka Bir Soruya Cevap Veriyor
    body: |-
      İki farklı ülkedeki hasta aynı tedaviyi farklı sebeplerle araştırabiliyor: biri fiyatı ve süreyi, diğeri güveni ve süreci merak ediyor. Türkçe bir reklamın çevirisi bu farkı görmüyor.

      Dentasay'da kampanyalar ülke ve dil bazında ayrışıyor; implant, zirkonyum ve diğer tedaviler için her dilde ayrı reklam ve her tedavi için ayrı landing page var. Reklam metinleri çeviriyle değil, o pazarın diliyle yazılıyor.

      Sağlık turizminde bütçeden daha belirleyici bir şey daha var: ilk cevabın hızı ve dili. Bu yüzden reklamın yanına WhatsApp iletişim akışları kurduk; hasta ilk mesajına kendi dilinde, beklemeden cevap alıyor.
    highlight: Reklam hastayı getirir, ilk cevap onu tutar.

