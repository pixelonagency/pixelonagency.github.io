  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: İstanbul SEO Ajansı Hakkında Sorular
    items:
      - question: Ofisinize gelip yüz yüze görüşebilir miyiz?
        answer: >-
          Evet. Ekibimiz Kadıköy'de. İstanbul'daysanız ilk görüşmeyi yüz yüze yapabiliriz,
          değilseniz ekran başında aynı şekilde çalışıyoruz.
      - question: Sadece İstanbul'daki işletmelerle mi çalışıyorsunuz?
        answer: >-
          Hayır. Manavgat'taki bir dermatoloji kliniğinden 13 dilde aranan bir sağlık
          turizmi markasına kadar farklı şehir ve ülkelerde SEO yapıyoruz. Yerel aramanın
          ayrıntısını [yerel SEO](/hizmetlerimiz/seo-ve-icerik-pazarlamasi/yerel-seo/)
          sayfasında anlattık.
      - question: SEO çalışması ne kadar tutuyor?
        answer: >-
          Aylık SEO çalışması projenin büyüklüğüne göre 20.000 TL ile 100.000 TL arasında,
          KDV hariç. Ayrıntılar
          [SEO fiyatları](/hizmetlerimiz/seo-ve-icerik-pazarlamasi/seo-fiyatlari/) sayfasında.
      - question: Her ilçe için ayrı sayfa açmalı mıyım?
        answer: >-
          Yalnızca orada gerçekten bir şubeniz ya da o ilçeye özel bir hizmetiniz varsa.
          Aynı metnin ilçe adı değiştirilerek çoğaltılması Google'ın spam politikasına
          takılıyor ve sitenin tamamına zarar verebiliyor.

