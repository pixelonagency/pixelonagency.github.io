  - type: text
    background: light
    layout: split
    eyebrow: İstanbul'da Arama
    heading: Aynı Şehirde, Farklı Aramalar
    body: |-
      İstanbul'da "diş kliniği" arayan biri Kadıköy'deyse Kadıköy'deki sonuçları, Beşiktaş'taysa Beşiktaş'takileri görüyor. Şehir geneli bir sayfa bu aramaların çoğunda geri planda kalıyor. Yerel SEO'da asıl iş, hizmetin gerçekten ulaşabildiği ilçeler için doğru sayfayı ve doğru işletme profilini kurmak.

      Ama ilçe başına ayrı bir sayfa açıp aynı metni kopyalamak işe yaramıyor; Google bu tür sayfaları spam olarak değerlendiriyor. Bunun yerine her şube için gerçek bir konum sayfası, her hizmet için içeriği dolu bir sayfa ve tutarlı bir Google İşletme Profili kuruyoruz.

      Aynı şehirde olmanın bir faydası da içerik. Sitede kullanılacak fotoğraf ve videoyu işletmenizde, yerinde çekebiliyoruz; gerçek mekân görüntüsü hem ziyaretçide hem de aramada güven sinyali.
    highlight: İstanbul'daysanız ilk analizi yüz yüze konuşalım. Değilseniz ekran başında aynı şekilde çalışırız.

