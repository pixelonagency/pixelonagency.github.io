  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: Doktor ve Klinik Sosyal Medyası Hakkında Sorular
    items:
      - question: Doktorlar sosyal medyada neleri paylaşabilir?
        answer: >-
          Sağlık hizmetlerinin tanıtımı kurallara bağlı. Bilgilendirici içerikler,
          hekimin uzmanlık alanını anlatan videolar ve hastanın sık sorduğu soruların
          cevapları güvenli bir zemin. Kesin sonuç vaadi, başka hekimlere karşı üstünlük
          iddiası ve yanıltıcı öncesi-sonrası kullanımı ise uzak durulması gereken
          alanlar. Metinlerin son onayı her zaman hekimde.
      - question: Hekimin çekim için ne kadar zaman ayırması gerekiyor?
        answer: >-
          Senaryolar önceden hazırlandığı için tek bir çekim gününde birden fazla videonun
          malzemesi çıkarılıyor. Hekim ne anlatacağını çekimden önce biliyor.
      - question: Hasta mesajlarına kim cevap veriyor?
        answer: >-
          Bu klinikle birlikte kararlaştırılıyor. Genel sorulara hazırlanan cevaplarla biz
          dönebiliyoruz; tıbbi değerlendirme gerektiren sorular kliniğe yönlendiriliyor.
          Cevapsız kalan mesaj, kaybedilmiş bir randevu talebi.
      - question: Kliniğin web sitesini de yapıyor musunuz?
        answer: >-
          Evet. Sosyal medyadan gelen hastanın indiği sayfa da işin parçası; klinik
          sitelerini nasıl kurduğumuzu
          [doktor ve klinik web sitesi](/hizmetlerimiz/web-tasarim-ve-yazilim/doktor-ve-klinik-web-sitesi/)
          sayfasında anlattık.

