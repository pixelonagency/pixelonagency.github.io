  - type: text
    background: dark
    layout: split
    eyebrow: Tonu Doğru Kurmak
    heading: Ne Fazla İddialı, Ne Fazla Mesafeli
    body: |-
      Sağlık iletişiminin bilinen bir riski var. Sonuç vaat eden bir dil hekimi tüccarlaştırıyor, fazla mesafeli bir klinik dil ise hastanın "bana ne olacak?" sorusunu cevapsız bırakıyor.

      Op. Dr. İsmail Büyükçayır'ın hesabını bu iki ucun ortasına kurduk. İçerikler hastanın gerçekten merak ettiği sorulardan çıkıyor: estetik ameliyatlarda iz kalır mı, botoks ifadeyi dondurur mu, meme küçültme ameliyatı kimler için uygundur. Abartılı öncesi ve sonrası kurgusundan bilinçli olarak kaçındık.

      Dr. Ayşe Cinkaya Kahveci'de de videolar hekimin kendi anlatımına dayanıyor: 30'lu yaşlarda ciltte ilk ne değişir, cilt bariyeri bozulursa ne olur, kolajen nasıl artırılır. Her video tek bir soruyu cevaplıyor.
    highlight: Sağlıkta güveni kuran şey görsel değil, hekimin kendisi.

  - type: cards
    background: light
    kind: feature
    columns: 2
    eyebrow: Nasıl Çalışıyoruz
    heading: Bir Klinik Hesabında Dört Karar
    items:
      - title: İçerik hastanın sorusundan çıkıyor
        description: >-
          Muayenede en sık sorulan sorular listeleniyor; her biri bir video ya da
          bilgi kartının konusu oluyor.
        icon: strategy
      - title: Hekimin kendi sesi
        description: >-
          Stok görüntü ya da animasyon yerine hekimin kendi anlatımı. Çekim, kurgu ve
          altyazı bizde; hekimin zamanı en verimli şekilde kullanılıyor.
        icon: craft
      - title: Kurallara uygun, abartısız dil
        description: >-
          Kesin sonuç, üstünlük iddiası ve abartılı öncesi-sonrası kurgusu yerine
          bilgilendirici bir dil. Her içeriğin son onayı hekimde.
        icon: partnership
      - title: Her dilde ayrı hasta kapısı
        description: >-
          Dr. Ayşe Cinkaya Kahveci'de Türkçenin yanında Rusça, Almanca, İngilizce ve
          Arapça kampanyalarla bölgedeki yabancı misafirlere kendi dillerinde ulaştık.
        icon: orbit

  - type: bullets
    background: dark
    kind: check
    eyebrow: Kontrol Listesi
    heading: Bir Klinik Hesabında Olması Gerekenler
    items:
      - Hekimin yüzü ve kendi anlatımıyla düzenli videolar
      - Hastanın en sık sorduğu soruların cevapları
      - Biyografide randevu ve WhatsApp bağlantısı
      - Öne çıkanlarda tedavi başlıkları, adres ve ulaşım
      - Yorum ve mesajlara zamanında, kayıt altında cevap
      - Kesin sonuç vaat etmeyen, bilgilendirici bir dil
      - Hangi içeriğin randevu getirdiğinin ölçülmesi

