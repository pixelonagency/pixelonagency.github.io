    heading: Bu Fiyatlara Ne Aldığınızı Görün
    lead: >-
      Dr. Ayşe Cinkaya Kahveci'nin kliniği "Manavgat dermatolog" aramasında ilk sayfada;
      site bir yılda Google'da 487 bin kez göründü.
    slugs:
      - dr-ayse-cinkaya-kahveci
      - dentasay
      - xray-groupe
    columns: 3
    kind: grid
    ctaLabel: Tüm projelerimizi inceleyin
    ctaHref: /projelerimiz/

  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: SEO Fiyatları Hakkında Sorular
    items:
      - question: SEO hizmeti aylık ne kadar?
        answer: >-
          Pixelon'da aylık SEO çalışması projenin büyüklüğüne ve sitenin durumuna göre
          20.000 TL ile 100.000 TL arasında, KDV hariç. Kesin rakamı ilk analizden sonra
          veriyoruz.
      - question: Neden tek bir fiyat değil de aralık veriyorsunuz?
        answer: >-
          Çünkü aynı adı taşıyan iki SEO işi bambaşka emek istiyor. Başlangıç rakamını
          yayınlıyoruz ki bütçesi bunun altında kalan işletme vakit kaybetmesin.
      - question: Sıralama garantisi veriyor musunuz?
        answer: >-
          Hayır. Sıralamayı Google belirliyor; garanti veren bir teklif ya kontrol
          edemeyeceği bir şeyi vaat ediyor ya da kimsenin aramadığı bir kelimeyi hedefliyor.
          Biz ölçülebilir hedefler koyuyor, gelişmeyi aylık raporluyoruz.
      - question: SEO ne kadar sürede sonuç verir?
        answer: >-
          Sitenin durumuna ve rekabete göre değişiyor. Ayrıntısını
          [SEO ne kadar sürede sonuç verir](/blog/seo-ne-kadar-surede-sonuc-verir/)
          yazısında anlattık.

