          Kimin için: bir şehirde ya da bölgede hizmet veren işletmeler.
      - eyebrow: Kurumsal ve rekabetçi alanlar
        title: Aralığın orta kısmı
        description: |-
          Çok sayıda hizmet ya da kategori sayfası, rekabetçi aramalar, düzenli içerik üretimi ve bağlantı çalışması.

          Kimin için: ulusal ölçekte rakiplerle aynı aramalarda yarışan markalar.
        featured: true
      - eyebrow: Çok dilli ve büyük projeler
        title: Aralığın üst kısmı
        description: |-
          Birden fazla dil ve ülke, yüzlerce sayfa, e-ticaret kategorileri ya da sağlık turizmi gibi uluslararası aramalar.

          Kimin için: birden fazla pazarda aranmak isteyen markalar.
    note: >-
      Tüm fiyatlar KDV hariçtir. Kesin rakam, sitenizi ilk analizde inceledikten sonra
