      - title: Sayfa ve içerik hacmi
        description: >-
          Kaç hizmet ya da kategori sayfası optimize edilecek, ayda kaç yeni içerik
          üretilecek?
      - title: Rekabet düzeyi
        description: >-
          Mahalle ölçeğinde bir arama ile ulusal bir arama aynı emeği istemiyor.
      - title: Dil ve ülke sayısı
        description: >-
          Her dil ayrı anahtar kelime araştırması, ayrı içerik ve doğru hreflang yapısı
          demek.
      - title: Bağlantı ve dijital PR
        description: >-
          Güvenilir sitelerden doğal bağlantı kazanmak için yapılan çalışma kapsamın
          büyük bir parçası olabiliyor.

  - type: bullets
    background: dark
