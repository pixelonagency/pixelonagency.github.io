  - type: text
    background: dark
    layout: split
    eyebrow: Yerel Arama
    heading: Harita, Arama Sonucu ve Yapay Zekâ Aynı Sinyallere Bakıyor
    body: |-
      Yerel aramada üç yerde görünmek gerekiyor: Google Haritalar'daki işletme listesi, altındaki arama sonuçları ve giderek daha sık kullanılan yapay zekâ cevapları. Üçü de aynı sinyallere bakıyor: işletmenin bilgileri her yerde tutarlı mı, yorumları gerçek ve güncel mi, sitesi o hizmeti o bölge için anlatıyor mu?

      Dr. Ayşe Cinkaya Kahveci'nin sitesinde estetik uygulama arayan ziyaretçi ile dermatolojik şikâyetle gelen hastayı ayrı kategori yapılarına oturttuk; her uygulama kendi sayfasını aldı ve Sağlık Rehberi bölümü sık sorulan soruları cevapladı. Bugün "Manavgat dermatolog" araması kliniği ilk sayfada buluyor, ChatGPT'ye "Manavgat en iyi dermatolog" sorulduğunda da klinik ilk sırada çıkıyor.
    highlight: Yerel aramada kazanan, en büyük işletme değil, en net anlatılan işletme.

  - type: cards
    background: light
    kind: feature
    columns: 2
    eyebrow: Nasıl Çalışıyoruz
    heading: Yerel SEO'nun Dört Parçası
    items:
      - title: Google İşletme Profili
        description: >-
          Kategori, hizmetler, çalışma saatleri, fotoğraflar ve düzenli paylaşımlar.
          Profilin eksiksiz ve güncel olması harita sonuçlarının temeli.
        icon: strategy
      - title: Yorumlar
        description: >-
          Memnun müşteriden yorum istemenin düzenli bir yolu ve her yoruma, olumsuzlara da,
          zamanında cevap. Sahte ya da teşvikli yorum yok.
        icon: partnership
      - title: Konum ve hizmet sayfaları
        description: >-
          Her hizmetin ve varsa her şubenin kendi sayfası; adres, harita ve bölgeye özel
          bilgiyle.
        icon: web
      - title: Tutarlı işletme bilgisi
        description: >-
          Ad, adres ve telefonun site, profil ve rehber sitelerinde aynı yazılması, yerel
          yapılandırılmış veriyle desteklenmesi.
        icon: seo

  - type: bullets
    background: dark
    kind: check
    eyebrow: Kontrol Listesi
    heading: Yerel Aramada Görünmek İçin
    items:
      - Google İşletme Profili doğrulanmış ve eksiksiz
      - Doğru ana kategori ve ek kategoriler seçilmiş
      - İşletme bilgisi her yerde aynı yazılmış
      - Her hizmetin kendi sayfası var
      - Yorumlar düzenli geliyor ve cevaplanıyor
      - Sitede yerel yapılandırılmış veri kurulu
      - Harita ve arama görünürlüğü aylık ölçülüyor

  - type: projects
    background: light
    eyebrow: Projeler
    heading: Yerel ve Uluslararası Aramada Kurduğumuz Siteler
    slugs:
      - dr-ayse-cinkaya-kahveci
      - cagla-aytac
      - dentasay
