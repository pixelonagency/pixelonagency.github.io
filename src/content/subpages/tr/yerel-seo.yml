    ctaLabel: Tüm projelerimizi inceleyin
    ctaHref: /projelerimiz/

  - type: faq
    background: dark
    eyebrow: Merak Edilenler
    heading: Yerel SEO Hakkında Sorular
    items:
      - question: Google Haritalar'a işletme nasıl eklenir?
        answer: >-
          Google İşletme Profili açılıp doğrulandığında işletme haritada görünür. Adım adım
          anlatımı [Google İşletme Profili nasıl oluşturulur](/blog/google-isletme-profili-nasil-olusturulur/)
          yazısında.
      - question: Yorum sayısı sıralamayı etkiler mi?
        answer: >-
          Yorumlar yerel sıralamada ve güvende önemli bir sinyal. Nasıl yorum istenip
          cevaplanacağını [Google yorumları nasıl artırılır](/blog/google-yorumlari-nasil-artirilir/)
          yazısında anlattık.
      - question: Birden fazla şubem var, ne yapmalıyım?
        answer: >-
          Her şube için ayrı bir işletme profili ve sitede ayrı bir konum sayfası gerekir.
          Çağla Aytaç'ın sitesinde üç hizmet noktasının her birinin iletişim bilgisi ve
          çalışma saatleri ayrı sekmede duruyor.
      - question: Yerel SEO ne kadar tutuyor?
        answer: >-
          Aylık SEO çalışması 20.000 TL'den başlıyor, KDV hariç. Ayrıntılar
          [SEO fiyatları](/hizmetlerimiz/seo-ve-icerik-pazarlamasi/seo-fiyatlari/) sayfasında.

