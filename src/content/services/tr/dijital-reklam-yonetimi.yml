cta:
  eyebrow: Reklam Bütçenizi Birlikte Büyümeye Dönüştürelim
  heading: Daha Fazla Talep, Satış ve Randevu Almaya Hazır mısınız?
  lead: |-
    Mevcut reklamlarınızdan yeterli sonuç alamıyorsanız veya markanız için sıfırdan profesyonel bir reklam sistemi kurmak istiyorsanız Pixelon ekibiyle iletişime geçin. Hedeflerinizi analiz edelim ve markanıza özel dijital reklam planını birlikte oluşturalım.

faq:
  eyebrow: Merak Edilenler
  heading: Dijital Reklam Yönetimi Hakkında Sıkça Sorulan Sorular
  items:
    - question: Dijital reklam yönetimi hizmetine neler dahildir?
      answer: |-
        Hizmet kapsamına hedef kitle analizi, kampanya stratejisi, reklam kurulumu, reklam metni ve tasarımları, dönüşüm takibi, optimizasyon ve raporlama dâhil edilebilir.
    - question: Reklam bütçesi hizmet ücretine dâhil mi?
      answer: |-
        Hayır. Reklam platformlarına ödenen medya bütçesi ile Pixelon reklam yönetim hizmet bedeli ayrı olarak planlanır.
    - question: Ne kadar reklam bütçesi ayırmalıyız?
      answer: |-
        Uygun bütçe; sektörünüze, hedeflediğiniz bölgeye, rekabet düzeyine ve kampanya hedeflerinize göre belirlenir. İlk analiz sonrasında size uygun bir bütçe önerisi sunulur.
    - question: Reklamlardan ne zaman sonuç alınır?
      answer: |-
        Sonuç süresi sektör, teklif, bütçe, hedef kitle ve kullanılan platforma göre değişir. Kampanyaların ilk döneminde veri toplanır, testler yapılır ve performans düzenli optimizasyonlarla geliştirilir.
    - question: Reklam içeriklerini Pixelon hazırlıyor mu?
      answer: |-
        Evet. Hizmet kapsamına göre reklam metinleri, statik tasarımlar, hareketli görseller ve kısa video içerikleri Pixelon tarafından hazırlanabilir.
    - question: Google Ads ve Meta Ads birlikte yönetilebilir mi?
      answer: |-
        Evet. Markanın hedeflerine göre Google, Instagram ve Facebook reklamları birbirini destekleyecek şekilde birlikte planlanabilir.
    - question: Reklam yönetim ücretini neye göre belirliyorsunuz?
      answer: |-
        Ücret, yönetilecek platform sayısı, kampanya kurgusunun karmaşıklığı, hedeflenen ülke ve dil sayısı ile içerik üretim ihtiyacına göre belirlenir. Tek platformda yürüyen yurt içi bir kampanya ile altı dilde yürüyen sağlık turizmi kampanyası aynı emeği gerektirmez. İlk görüşmede ihtiyacınızı netleştirir, kapsamı ve buna karşılık gelen ücreti yazılı olarak paylaşırız.
    - question: Reklam hesabımı ben yönetiyorum, yalnızca danışmanlık alabilir miyim?
      answer: |-
        Evet. Google Ads danışmanlığı kapsamında mevcut hesabınızı denetliyor, kayıp bütçeyi ve yapısal hataları raporluyor, kampanya kurgusunu birlikte planlıyor ve ekibinizi yönlendiriyoruz. Yönetimi devralmamız zorunlu değil.
    - question: Google Ads uzmanı ile ajans arasındaki fark nedir?
      answer: |-
        Uzman genellikle yalnızca reklam hesabını yönetir. Ajans ise reklamın indiği sayfayı, reklam içeriğini, dönüşüm takibini ve gelen talebin nasıl karşılandığını da kapsar. Reklam performansı çoğu zaman hesabın içinde değil, hesabın dışında kalan bu halkalarda kaybedilir.
    - question: Reklam hesapları kimin adına açılır?
      answer: |-
        Reklam hesapları sizin adınıza açılır ve mülkiyeti size aittir. Çalışmamız sona erdiğinde hesaplar, geçmiş veriler ve dönüşüm kurulumları sizde kalır.
    - question: Yurt dışına yönelik reklam verebiliyor musunuz?
      answer: |-
        Evet. 20'den fazla ülkede, 13 dilde kampanya yönettik. Yurt dışı kampanyalarında reklam metni, görseli ve indiği sayfa hedef dilde ayrı kurgulanır; Türkçe kampanyanın çevirisi kullanılmaz.
    - question: TikTok, Yandex veya Snapchat reklamı da veriyor musunuz?
      answer: |-
        Evet. Google ve Meta ağırlıklı çalışıyoruz, ancak hedef kitleniz oradaysa TikTok, Yandex Direct, LinkedIn ve Snapchat kampanyalarını da kuruyor ve yönetiyoruz.
