intro:
  eyebrow: "Sıralama Bir Sonuçtur, Hedef Değildir"
  heading: "Sizi Arayan Kullanıcının Karşısına Doğru Sayfayla Çıkıyoruz"
  body: |-
    SEO, bir listeye anahtar kelime yazıp beklemek değildir. Kullanıcının ne aradığını, o aramanın arkasında hangi ihtiyacın olduğunu ve hangi sayfanın o ihtiyacı karşıladığını birlikte çözmek gerekir. Teknik altyapı bunun zeminidir; içerik ise cevabın kendisidir.

    Pixelon olarak önce sitenizin taranabilir ve indekslenebilir olduğundan emin oluyor, sonra hedef kitlenizin gerçekten arattığı kelimeleri belirliyor ve her aramanın karşısına o niyete uygun bir sayfa koyuyoruz. Ölçümü baştan kuruyoruz ki gelişmenin nereden geldiği tartışma konusu olmasın.
  highlight: |-
    Amacımız tek bir kelimede birinci olmak değil; markanızın aranan her yerde bulunabilir olması.

