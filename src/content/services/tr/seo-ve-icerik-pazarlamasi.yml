value:
  eyebrow: "SEO Neden Önemlidir?"
  heading: "Reklam Bütçesine Bağımlı Olmadan Sürekli Görünürlük Sağlayın"
  lead: "SEO, markanızın ürün veya hizmetlerinizi araştıran kullanıcıların karşısına doğru anda çıkmasını sağlar. Reklam kampanyaları durduğunda trafik azalabilir; doğru planlanan SEO çalışmaları ise zaman içerisinde kalıcı ve sürdürülebilir bir dijital değer oluşturur."
  bullets:
    - "Google'daki görünürlüğünüzü artırabilirsiniz."
    - "Daha nitelikli ziyaretçiler elde edebilirsiniz."
    - "Marka güveninizi güçlendirebilirsiniz."
    - "Reklam maliyetlerine olan bağımlılığınızı azaltabilirsiniz."
    - "Daha fazla form, WhatsApp, arama veya satış dönüşümü sağlayabilirsiniz."
sectors:
  eyebrow: "Sektör Deneyimimiz"
  heading: "Hangi Sektörlerle Çalışıyoruz?"
  body: "Sağlık ve klinik markaları, sağlık turizmi firmaları, e-ticaret işletmeleri, inşaat ve gayrimenkul şirketleri ile hizmet sektöründeki KOBİ ve kurumsal markalar için SEO ve içerik pazarlaması hizmetleri sunuyoruz. Her sektörün arama davranışlarını, rekabet düzeyini ve kullanıcı karar sürecini ayrı bir stratejiyle değerlendiriyoruz."
cta:
  eyebrow: "Markanızı Google'da Birlikte Öne Çıkaralım"
