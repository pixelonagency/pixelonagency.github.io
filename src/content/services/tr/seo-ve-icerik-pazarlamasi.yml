      icon: cycle
      description: "Hedef kitlenizin hangi kelimeleri, soruları ve hizmetleri aradığını analiz ederek içerik fırsatlarını belirliyoruz."
    - title: "Teknik SEO Optimizasyonu"
      icon: team
      description: "Site hızı, mobil uyumluluk, indeksleme, URL yapısı ve teknik hataları kontrol ederek arama motoru performansını geliştiriyoruz."
    - title: "Otorite ve Backlink Stratejisi"
      icon: conversion
      description: "Markanızın dijital otoritesini destekleyen güvenilir ve doğal bağlantı fırsatları üzerine çalışıyoruz."
    - title: "Düzenli Raporlama"
      icon: report
      featured: true
      description: "Organik trafik, sıralamalar, kullanıcı davranışları ve dönüşümleri düzenli olarak analiz edip raporluyoruz."
scope:
  eyebrow: "Hizmet Kapsamı"
  heading: "Organik Büyüme İçin Bütüncül SEO Çözümleri"
  layout: list
  items:
    - title: "SEO Analizi ve Yol Haritası"
      description: "Mevcut web sitenizi teknik yapı, içerik, sıralamalar ve rakipler açısından analiz ediyoruz."
    - title: "Teknik SEO"
      description: "Tarama ve indeksleme problemleri, site hızı, mobil uyumluluk, yönlendirmeler ve yapılandırılmış veri çalışmalarını gerçekleştiriyoruz."
    - title: "Anahtar Kelime Araştırması"
      description: "Hizmetlerinize, ürünlerinize ve hedef kitlenizin arama davranışlarına uygun anahtar kelimeleri belirliyoruz."
    - title: "Site İçi SEO"
      description: "Sayfa başlıkları, meta açıklamaları, heading yapısı, URL'ler, iç bağlantılar ve görselleri optimize ediyoruz."
    - title: "SEO Uyumlu İçerik Üretimi"
      description: "Hizmet sayfaları, kategori açıklamaları, blog yazıları ve landing page içerikleri hazırlıyoruz."
    - title: "İçerik Stratejisi"
      description: "Hangi konuların, hangi içerik formatıyla ve hangi yayın planıyla hazırlanacağını belirleyen içerik takvimi oluşturuyoruz."
    - title: "Yerel SEO"
      description: "İstanbul, Kadıköy veya hizmet verdiğiniz farklı bölgelerde yerel aramalarda daha görünür olmanızı destekliyoruz."
    - title: "Rakip Analizi"
      description: "Rakiplerinizin güçlü olduğu anahtar kelimeleri, içerik yapılarını ve büyüme fırsatlarını inceliyoruz."
    - title: "Performans Takibi"
      description: "Google Search Console, Analytics ve diğer ölçüm araçları üzerinden sonuçları takip ederek stratejiyi geliştiriyoruz."
principles:
  eyebrow: "SEO Çalışmasında Neleri Birlikte Ele Alıyoruz?"
  heading: "Teknik Zemin, Doğru Kelime, Gerçek Cevap"
  items:
    - title: "Arama Niyeti Analizi"
      icon: audience
      description: |-
        Aynı kelimeyi arayan iki kullanıcı farklı şey isteyebilir. Bilgi mi arıyor, karşılaştırma mı yapıyor, satın almaya mı hazır — sayfayı bu ayrıma göre kurguluyoruz.
    - title: "Anahtar Kelime Stratejisi"
      icon: strategy
      description: |-
        Hacim tek başına yeterli değil. Rekabet düzeyini, ticari değeri ve sizin gerçekçi şansınızı birlikte değerlendirip öncelik sırası çıkarıyoruz.
    - title: "İçerik Üretimi"
      icon: creative
      description: |-
        Arama sonucunda çıkan sorunun cevabını gerçekten veren, özgün ve marka dilinize uygun içerikler yazıyoruz. Kelime doldurmuyoruz.
    - title: "Sayfa İçi Optimizasyon"
      icon: landing
      description: |-
        Başlık, meta açıklama, başlık hiyerarşisi, iç bağlantılar, görsel alt metinleri ve yapılandırılmış veri — sayfanın anlaşılmasını sağlayan her katmanı düzenliyoruz.
    - title: "Teknik SEO ve Ölçüm"
      icon: tracking
      description: |-
        Tarama bütçesi, indeksleme, site hızı, mobil uyumluluk ve yönlendirme zincirleri. Search Console ve Analytics kurulumunu baştan doğru yapıyoruz.
    - title: "Sürekli İyileştirme"
      icon: optimize
      description: |-
        SEO bir kerelik iş değil. Sıralama hareketlerini, düşen sayfaları ve yeni fırsatları takip edip planı her ay güncelliyoruz.

platforms:
  eyebrow: "Arama Yüzeyleri ve Ölçüm Araçları"
  heading: "Nerede Görünür Kılıyoruz, Nereden Ölçüyoruz?"
  lead: |-
    Arama artık tek bir kutudan ibaret değil. Google'ın yanına yapay zekâ yanıt motorları eklendi ve markanızın orada da alıntılanması gerekiyor. Ölçümü ise tahminle değil, kaynağından yapıyoruz.
  items:
    - title: "Google Arama"
      logo: google
      featured: true
      description: |-
        Çalışmanın merkezi. Teknik altyapı, sayfa içi optimizasyon ve içerik üretiminin tamamı Google'ın sayfanızı doğru anlaması ve doğru aramada göstermesi için kurgulanıyor.
    - title: "Yapay Zekâ Yanıt Motorları"
      logo: perplexity
      featured: true
      description: |-
        Perplexity ve benzeri yanıt motorları cevabı kaynak göstererek veriyor. Yapılandırılmış veri, net başlık hiyerarşisi ve kaynak gösterilebilir içerikle markanızın o cevapların içinde geçmesini hedefliyoruz.
    - title: "Yandex"
      logo: yandex
      description: |-
        Rusça ve Türkçe aramalarda hâlâ ciddi pay tutuyor. Rusya ve çevre pazarlara satış yapan markalar için ayrı kurgu gerektiriyor.
    - title: "Google Search Console"
      logo: searchconsole
      description: |-
        Sıralama, gösterim ve tıklama verisinin birinci elden kaynağı. Hangi sorgunun hangi sayfaya geldiğini buradan okuyor, içerik planını buna göre güncelliyoruz.
    - title: "Google Analytics"
      logo: analytics
      description: |-
        Organik trafiğin sitede ne yaptığını gösterir. Form, WhatsApp ve arama gibi dönüşümleri kurup SEO'nun getirdiği trafiğin işe dönüşüp dönüşmediğini ölçüyoruz.
    - title: "Semrush"
      logo: semrush
      description: |-
        Anahtar kelime hacmi, zorluk derecesi ve rakip analizi için kullanıyoruz. Hangi kelimenin gerçekten aranıp aranmadığını varsaymak yerine ölçüyoruz.

