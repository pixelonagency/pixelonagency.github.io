cta:
  eyebrow: "Markanızı Google'da Birlikte Öne Çıkaralım"
  heading: "Daha Fazla Organik Trafik ve Nitelikli Talep Almaya Hazır mısınız?"
  lead: "Web sitenizin Google performansını geliştirmek, hizmetlerinizi doğru aramalarda görünür hale getirmek ve sürdürülebilir organik büyüme sağlamak için Pixelon ekibiyle iletişime geçin. Mevcut durumunuzu analiz edelim ve markanıza özel SEO yol haritasını oluşturalım."
faq:
  eyebrow: "Merak Edilenler"
  heading: "SEO Ajansı Seçerken ve SEO Çalışmasında Sıkça Sorulanlar"
  items:
    - question: "SEO çalışması ne kadar sürede sonuç verir?"
      answer: "SEO uzun vadeli bir çalışmadır. İlk gelişmeler teknik durum, sektör rekabeti ve içerik kapsamına bağlı olarak değişir. Düzenli çalışma ve optimizasyonla sonuçlar zaman içerisinde güçlenir."
    - question: "SEO hizmetine içerik üretimi dâhil mi?"
      answer: "Hizmet kapsamına göre hizmet sayfası içerikleri, blog yazıları, kategori açıklamaları ve landing page metinleri hazırlanabilir."
    - question: "Google'da birinci sıra garantisi veriyor musunuz?"
      answer: "Arama sonuçları Google algoritmaları ve rekabet koşullarına bağlı olduğu için belirli bir sıra garantisi doğru değildir. Hedefimiz sürdürülebilir görünürlük, nitelikli trafik ve ölçülebilir gelişim sağlamaktır."
    - question: "Mevcut web sitemiz için SEO yapılabilir mi?"
      answer: "Evet. Öncelikle mevcut site teknik ve içerik açısından analiz edilir, ardından geliştirme planı hazırlanır."
    - question: "SEO raporlarında hangi veriler bulunur?"
      answer: "Organik trafik, anahtar kelime sıralamaları, gösterim, tıklama, kullanıcı davranışları, teknik sorunlar ve dönüşüm verileri raporlanabilir."
    - question: "SEO ajansı ile çalışmanın maliyeti neye göre belirlenir?"
      answer: "Sabit bir liste fiyatı yok; kapsam ve süre belirler. Sitenin mevcut teknik durumu, hedeflenen kelime sayısı, üretilecek içerik hacmi, dil sayısı ve rekabet düzeyi çalışmanın büyüklüğünü değiştirir. Önce ücretsiz bir analiz yapıp neyin gerektiğini çıkarıyor, kapsamı birlikte belirledikten sonra teklif hazırlıyoruz."
    - question: "SEO mu Google Ads mi? Hangisiyle başlamalıyım?"
      answer: "İkisi birbirinin alternatifi değil. Google Ads ilk günden talep getirir ama bütçe durunca trafik de durur. SEO geç başlar, karşılığında reklam harcamasından bağımsız kalıcı bir kanal bırakır. Hızlı talebe ihtiyacınız varsa reklamla başlayıp SEO'yu paralel kurmak çoğu markada en sağlıklı yol oluyor."
    - question: "Yerel aramalarda (örneğin şehir adıyla) görünmek için ne yapılıyor?"
      answer: "Google Business profili, hizmet ve konum sayfalarının yapısı, yerel yapılandırılmış veri ve tutarlı işletme bilgisi birlikte çalışır. Birden fazla şubesi olan markalarda her lokasyon için ayrı sayfa kurgusu gerekir."
    - question: "İçerikleri yapay zekâ mı yazıyor?"
      answer: "Hayır. Araştırma ve taslak aşamasında araçlardan yararlanıyoruz ama yayınlanan her içerik konuya hâkim bir insan tarafından yazılıyor ve kontrol ediliyor. Şablonla çoğaltılmış içerik kısa vadede sayfa sayısı artırır, uzun vadede sitenin tamamına zarar verir."
