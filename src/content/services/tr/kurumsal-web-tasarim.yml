  whatsappMessage: "Merhaba Pixelon, kurumsal web tasarım hizmeti hakkında bilgi almak istiyorum."

intro:
  eyebrow: İlk İzlenim
  heading: Şirketinizin Ciddiyeti İlk Ekranda Anlaşılır
  body: |-
    Bir alıcı sitenize girdiğinde önce izlenim edinir: burası düzenli mi, güncel mi, güvenilir mi. Bu izlenim çoğu zaman metin okunmadan önce oluşur; tipografi, hiyerarşi, yükleme hızı ve bilginin nerede durduğu üzerinden.

    Bu yüzden işi görsel bir tasarım işi olarak değil, bilgi mimarisi işi olarak ele alıyoruz. Kim olduğunuz, ne yaptığınız ve kiminle çalıştığınız; ziyaretçinin aradığı sırayla karşısına çıkmalı. Bir web sitesinin nasıl olması gerektiğini [ayrıntılı olarak da yazdık](/blog/kurumsal-web-sitesi-nasil-olmali/).

    Şirketler zamanla değişir: yeni hizmet eklenir, yeni pazara açılırsınız, ekip büyür. Kurduğumuz yapının bu değişimi kaldırması gerekir. Bu nedenle projelerde içeriğin sizin ekibiniz tarafından yönetilebilir olmasına öncelik veriyoruz. Daha geniş kapsam için [web tasarım ve yazılım hizmetlerimize](/hizmetlerimiz/web-tasarim-ve-yazilim/) bakabilirsiniz.

scope:
  eyebrow: Kapsamımız
  heading: Şirketinizin Ölçeğine Uygun Yapılar
  items:
    - title: Tanıtım Sitesi
      description: >-
        Şirket profili, hizmetler, referanslar ve iletişim akışını; ziyaretçinin
        aradığını kısa sürede bulacağı bir hiyerarşiyle kuruyoruz.
    - title: Çok Dilli Yapı
      description: >-
        Farklı pazarlara açılan şirketler için her dilin kendi içeriğine sahip
        olduğu siteler geliştiriyoruz. Makine çevirisiyle çoğaltılmış sayfa
        üretmiyoruz.
    - title: Yatırımcı, Kariyer ve Basın Bölümleri
      description: >-
        İletişimin yalnızca müşteriye değil; yatırımcıya, aday çalışana ve
        basına da hitap ettiği durumlarda bu kitleler için ayrı bölümler
        kuruyoruz.
    - title: İçerik Yönetimi
      description: >-
        Metin, görsel, ekip ve referans güncellemelerini kendi ekibinizin
        yapabilmesi için yönetim paneli kuruyoruz ve kullanımını birlikte
        gözden geçiriyoruz.
    - title: Marka Kimliği Entegrasyonu
      description: >-
        Marka kılavuzunuz varsa dijitale birebir taşıyoruz; yoksa web için
        tutarlı bir görsel sistem kuruyoruz. Basılı ve dijital iletişim aynı
        dili konuşur.
    - title: Sistem Entegrasyonları
      description: >-
        Form verilerinin CRM'e akması, e-posta pazarlama aracınıza bağlanması
        ya da mevcut sistemlerinizle konuşması gerekiyorsa entegrasyonu
        geliştirme aşamasında kuruyoruz.

why:
  eyebrow: Standartlarımız
  heading: Güzel Görünmenin Ötesinde, İşleyen Bir Yapı
  lead: >-
    Aşağıdakiler her projede gözettiğimiz başlıklar. Hangisinin ne ölçüde
    gerekli olduğu projenin kapsamına göre değişir; keşif aşamasında birlikte
    netleştiriyoruz.
  items:
    - title: Ölçülen Performans
      description: >-
        Görselleri modern formatlarda ve doğru boyutlarda sunuyor, yazı tipi
        sayısını sınırlı tutuyor, düzen kaymasını önlemek için görsel
        boyutlarını baştan tanımlıyoruz. Hızı varsaymak yerine ölçüyoruz.
    - title: Her Ekranda Aynı Deneyim
      description: >-
        Trafiğin önemli bölümü telefondan geldiği için mobil deneyimi ayrı
        ele alıyoruz; arayüz kararlarını [kullanıcı deneyimi
        tasarımı](/hizmetlerimiz/ux-ui-tasarimi/) yaklaşımımızla birlikte
        veriyoruz.
    - title: Arama Motoru Altyapısı
      description: >-
        Başlık hiyerarşisi, meta bilgiler, canonical, sitemap, yapılandırılmış
        veri ve iç bağlantı düzeni yayın anında hazır olur. Bu altyapı sonradan
        eklenen bir katman değil, geliştirmenin parçası.
    - title: Erişilebilirlik
      description: >-
        Renk kontrastı, klavye ile gezinme, odak göstergeleri ve anlamlı görsel
        açıklamalarını gözetiyoruz. Bu hem daha geniş bir kitleye ulaşmak hem de
        kullanılabilirlik meselesi.
    - title: Güvenlik ve Süreklilik
      description: >-
        HTTPS, güncel bağımlılıklar ve form doğrulaması temel kabul. Yedekleme
        ve bakım ihtiyacını projenin barındırma yapısına göre birlikte
        planlıyoruz.
    - title: Ölçümleme
      description: >-
        Sitenin ne getirdiğini bilmiyorsanız geliştiremezsiniz. İhtiyaç duyan
        projelerde analiz ve dönüşüm takibi kurulumunu yayın öncesinde
        tamamlıyoruz.

process:
  eyebrow: Adım Adım
  heading: Projelerde İzlediğimiz Yol
  steps:
    - title: Keşif ve Analiz
      description: >-
        Şirketin yapısı, hedef kitleleri, mevcut sitenin verileri ve rakiplerin
        konumlanması. Neyin işe yaradığını varsaymadan bakıyoruz.
    - title: Bilgi Mimarisi
      description: >-
        Sayfa haritası, adres yapısı ve menü düzeni. Tasarıma geçmeden önce
        bilginin nerede duracağı netleşir.
    - title: UX/UI Tasarımı
      description: >-
        Önce tel çerçeve, sonra görsel tasarım. Onaydan sonra geliştirmeye
        geçilir; sürecin ortasında yön değiştirmek maliyetlidir.
    - title: Geliştirme ve İçerik Yönetimi
      description: >-
        Kodlama, yönetim paneli, entegrasyonlar ve çok dilli yapı. Bu aşamada
        gerçek içerikle çalışırız.
    - title: Test, Yayın ve Ölçüm
      description: >-
        Tarayıcı ve cihaz testleri, hız ölçümü, erişilebilirlik kontrolü ve
        analiz doğrulaması. Yayın sonrasında sonuçları birlikte gözden
        geçiriyoruz.

