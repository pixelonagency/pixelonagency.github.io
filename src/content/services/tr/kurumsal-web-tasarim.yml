# Menüden çıkarıldı: hizmet envanteri 6 başlığa indirildi, sayfa yayında kalıyor.
menu: false

seo:
  title: Kurumsal Web Tasarım Hizmeti | Pixelon
  description: >-
    Kurumsal kimliğinizi doğru yansıtan, hızlı ve yönetilebilir web siteleri
    tasarlıyoruz. Bilgi mimarisi, SEO altyapısı ve içerik yönetimi bir arada.

hero:
  eyebrow: Kurumsal Web Tasarım
  headingLines:
    - "Kurumsal Web Tasarımıyla Markanızı Dijitalde Güçlendiriyoruz."
  lead: >-
    Şirketinizin dijitaldeki ilk temsilcisi web sitenizdir. Kimliğinizi doğru
    yansıtan, hızlı çalışan ve içeriğini kendi ekibinizin yönetebildiği siteler
