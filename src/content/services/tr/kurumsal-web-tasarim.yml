value:
  eyebrow: Uygunluk
  heading: Bu Hizmet Kimler İçin Uygun?
  lead: >-
    Her şirketin bu ölçekte bir siteye ihtiyacı yok. Aşağıdaki durumlardan
    birine giriyorsanız hizmet size uygun; girmiyorsanız bunu açıkça söyleriz.
  bullets:
    - Şahıs işletmesi görünümünden çıkıp kurumsal bir kimliğe geçen şirketler
    - Birden fazla lokasyonda veya ülkede faaliyet gösteren markalar
    - İhracat yapan ve yurt dışı alıcıya kendini anlatması gereken üreticiler
    - Klinik grupları gibi güvenin belirleyici olduğu sektörler
    - Sitesi teknik olarak eskimiş, güncellenemez hâle gelmiş kuruluşlar
    - Yatırım süreci öncesi dijital görünürlüğünü düzeltmesi gereken şirketler

cta:
  eyebrow: Projenizi Konuşalım
  heading: Web Sitenizi Birlikte Planlayalım
  lead: >-
    Mevcut sitenizi inceleyip ne yapılması gerektiğini konuşabiliriz. İlk
    görüşme bir teklif sunumu değil, ihtiyaç netleştirme görüşmesidir. Doğrudan
    teklif almak isterseniz [buradan da ulaşabilirsiniz](/web-sitesi-yaptir/).

faq:
  eyebrow: Merak Edilenler
  heading: Sıkça Sorulan Sorular
  items:
    - question: Web sitesi ne kadar sürede hazır olur?
      answer: >-
        Süre içerik hazırlığına ve sayfa sayısına bağlı. Belirleyici olan
        genellikle tasarım değil, kurum içi içerik onay süreci olur. Keşif
        aşamasında sizin için gerçekçi bir takvim çıkarıyoruz. Bütçe aralıklarını
        ise [ayrı bir yazıda](/blog/web-tasarim-fiyatlari/) ele aldık.
    - question: Siteyi yayına girdikten sonra kendimiz yönetebilir miyiz?
      answer: >-
        Evet. İçerik yönetim paneli kuruluyor ve kullanımını ekibinizle
        birlikte gözden geçiriyoruz. Metin, görsel, ekip ve referans
        güncellemeleri için bize dönmeniz gerekmez.
    - question: Mevcut sitemizdeki içerikler ve adresler taşınabilir mi?
      answer: >-
        Taşınabilir. Eski adreslerin yeni sayfalara doğru yönlendirilmesi de
        sürecin parçası; aksi hâlde arama motorlarında biriktirdiğiniz değer
        kaybolur.
    - question: Site çok dilli yapılabilir mi?
      answer: >-
        Yapılabilir. Her dilin kendi içeriğine sahip olduğu, arama motorlarına
        doğru sinyal veren bir yapı kuruyoruz. Tek dilli bir siteyi sonradan
        çok dilliye çevirmek de mümkün, ancak baştan planlamak daha temiz olur.
    - question: SEO çalışması bu hizmete dahil mi?
      answer: >-
        Teknik altyapı dahil: hız, mobil uyum, başlık yapısı, yapılandırılmış
        veri, sitemap ve iç bağlantı düzeni. Sürekli içerik üretimi ve sıralama
        takibi ise [ayrı bir hizmet](/hizmetlerimiz/seo-ve-icerik-pazarlamasi/)
        olarak yürütülüyor.
