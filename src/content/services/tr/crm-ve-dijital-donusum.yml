cta:
  eyebrow: İşletmenizi Birlikte Dijitalleştirelim
  heading: Daha Düzenli, Hızlı ve Ölçülebilir Bir İş Sistemine Hazır mısınız?
  lead: |-
    Müşteri, satış, randevu veya operasyon süreçlerinizi hâlâ farklı uygulamalar ve dosyalar üzerinden yönetiyorsanız Pixelon ekibiyle iletişime geçin. İhtiyaçlarınızı analiz edelim ve işletmenize özel CRM ve dijital dönüşüm yol haritasını birlikte oluşturalım.

faq:
  eyebrow: Merak Edilenler
  heading: CRM ve Dijital Dönüşüm Hakkında Sıkça Sorulan Sorular
  items:
    - question: CRM sistemi nedir?
      answer: |-
        CRM; müşteri bilgileri, talepler, görüşmeler, teklifler ve satış süreçlerinin tek merkezden yönetilmesini sağlayan müşteri ilişkileri yönetim sistemidir.
    - question: Hazır CRM mi, özel CRM mi geliştirilir?
      answer: |-
        İşletmenizin ihtiyaçlarına göre hazır sistemler entegre edilebilir veya tamamen size özel bir CRM yazılımı geliştirilebilir.
    - question: CRM sistemine hangi modüller eklenebilir?
      answer: |-
        Müşteri, satış, teklif, randevu, görev, finans, stok, raporlama, kullanıcı yetkilendirme ve iletişim modülleri projeye göre eklenebilir.
    - question: Sistem farklı kullanıcı rollerini destekler mi?
      answer: |-
        Evet. Yönetici, satış, muhasebe, doktor, asistan veya çağrı merkezi gibi farklı kullanıcı rolleri ve erişim izinleri oluşturulabilir.
    - question: Mevcut veriler sisteme aktarılabilir mi?
      answer: |-
        Mevcut verilerin formatı ve durumu incelendikten sonra uygun kayıtların yeni sisteme aktarılması planlanabilir.
    - question: CRM mobil cihazlarda kullanılabilir mi?
      answer: |-
        Evet. Sistemler telefon, tablet ve masaüstü cihazlarda kullanılabilecek responsive yapıda geliştirilebilir.
