title: CRM ve Dijital Dönüşüm
navLabel: CRM ve Dijital Dönüşüm
translationKey: crm
order: 10

seo:
  title: CRM ve Dijital Dönüşüm Çözümleri | Pixelon
  description: |-
    Müşteri, satış, teklif, randevu ve ekip süreçlerinizi markanıza özel CRM yazılımları ve dijital otomasyonlarla tek merkezden yönetin.

hero:
  eyebrow: CRM ve Dijital Dönüşüm
  headingLines:
    - "Dağınık İş Süreçlerini *Akıllı Sistemlere* Dönüştürüyoruz."
  lead: |-
    Müşteri taleplerinden satış takibine, randevulardan finansal raporlamaya kadar işletmenizin ihtiyaçlarına özel CRM ve yönetim sistemleri geliştiriyoruz.
  tagline: |-
    İşletmenize uyum sağlayan, kolay yönetilen ve büyüdükçe geliştirilebilen dijital sistemler kuruyoruz.
  whatsappMessage: Merhaba Pixelon, CRM ve Dijital Dönüşüm hizmeti hakkında bilgi almak istiyorum.

intro:
  eyebrow: İşletmenizi Yazılıma Değil, Yazılımı İşletmenize Uyduruyoruz
  heading: Verileri, Ekipleri ve Süreçleri Aynı Sistem İçerisinde Buluşturuyoruz.
  body: |-
    Müşteri bilgileri farklı dosyalarda, talepler WhatsApp konuşmalarında ve satış süreçleri tablolar arasında kaldığında hem zaman hem de fırsat kaybı yaşanır.

    Pixelon olarak işletmenizin çalışma biçimini analiz ediyor; müşteri, satış, teklif, randevu, görev, finans ve raporlama süreçlerini tek merkezden yönetebileceğiniz dijital sistemlere dönüştürüyoruz. Hazır yazılımlara uyum sağlamanızı beklemek yerine, sistemin işletmenizin ihtiyaçlarına göre şekillenmesini sağlıyoruz.
  highlight: |-
    Amacımız yalnızca bir yazılım geliştirmek değil, işletmenizin daha düzenli, hızlı ve ölçülebilir çalışmasını sağlamaktır.

why:
  eyebrow: Neden Pixelon?
  heading: Yazılım, Tasarım ve İş Süreçlerini Birlikte Ele Alıyoruz.
  lead: |-
    Hazır bir programı kurup teslim etmek yerine işletmenizin gerçek ihtiyaçlarını anlamaya odaklanıyoruz. Kullanıcı deneyimi, operasyon, teknoloji ve raporlama süreçlerini aynı sistem içerisinde planlıyoruz.
  items:
    - title: İşletmeye Özel Yapı
      description: |-
        Sistemi sektörünüze, ekip yapınıza ve iş akışlarınıza göre şekillendiriyoruz.
    - title: Kullanıcı Dostu Arayüz
      description: |-
        Karmaşık işlemleri sadeleştiren, ekibin kolayca öğrenebileceği ekranlar oluşturuyoruz.
    - title: Yetkilendirme ve Güvenlik
      description: |-
        Her kullanıcının yalnızca görev alanıyla ilgili ekranlara ve verilere erişmesini sağlıyoruz.
    - title: Ölçeklenebilir Altyapı
      description: |-
        İşletmeniz büyüdükçe yeni kullanıcı, şube, modül ve entegrasyonların eklenebileceği sistemler geliştiriyoruz.
    - title: Ölçülebilir Süreçler
      description: |-
        Satış, talep, müşteri, ekip ve finans performansını raporlarla takip etmenizi sağlıyoruz.

scope:
  eyebrow: CRM ve Dijital Dönüşüm Hizmetlerimiz
  heading: İş Süreçlerinize Özel Yönetim Çözümleri
  items:
    - title: Müşteri ve Talep Yönetimi
      description: |-
        Web sitesi, WhatsApp, sosyal medya, telefon ve reklam kanallarından gelen müşteri taleplerini tek ekranda topluyoruz.
    - title: Satış ve Teklif Takibi
      description: |-
        Potansiyel müşterilerinizi satış aşamalarına göre takip edebileceğiniz teklif, görüşme ve ödeme süreçleri oluşturuyoruz.
    - title: Klinik ve Hasta Yönetimi
      description: |-
        Hasta kayıtları, randevular, tedaviler, iletişim geçmişi, ödeme ve doktor süreçlerini yönetebileceğiniz klinik CRM sistemleri geliştiriyoruz.
    - title: Randevu ve Takvim Sistemleri
      description: |-
        Müşteri, personel, hizmet ve şube bazlı çalışan online randevu ve takvim çözümleri oluşturuyoruz.
    - title: Görev ve Ekip Yönetimi
      description: |-
        Görev atama, son teslim tarihi, sorumlu personel ve proje takibi gibi ekip süreçlerini dijitalleştiriyoruz.
    - title: Finans ve Raporlama
      description: |-
        Gelir, gider, ödeme, alacak, teklif ve fatura verilerini takip edebileceğiniz raporlama ekranları hazırlıyoruz.
    - title: Yönetim Paneli Geliştirme
      description: |-
        Web sitenizi, içeriklerinizi, projelerinizi, formlarınızı ve kullanıcı taleplerinizi yönetebileceğiniz özel admin panelleri tasarlıyoruz.
    - title: Otomasyon ve Entegrasyon
      description: |-
        Form, e-posta, WhatsApp, takvim, reklam ve üçüncü taraf sistemleri birbirine bağlayan otomasyonlar kuruyoruz.

process:
  eyebrow: Dijital Dönüşüm Sürecimiz
  heading: Analizden Kullanıma Hazır Sisteme
  steps:
    - title: Süreç Analizi
      description: |-
        Mevcut çalışma düzeninizi, kullandığınız araçları ve yaşadığınız operasyonel sorunları inceliyoruz.
    - title: Sistem Mimarisi
      description: |-
        Modülleri, kullanıcı rollerini, veri yapısını ve süreçler arasındaki bağlantıları planlıyoruz.
    - title: UX/UI Tasarımı
      description: |-
        Ekibinizin kolayca kullanabileceği sade, anlaşılır ve markanıza uygun ekranlar tasarlıyoruz.
    - title: Yazılım ve Entegrasyon
      description: |-
        Onaylanan yapıyı geliştiriyor, ihtiyaç duyulan servis ve iletişim kanallarıyla entegre ediyoruz.
    - title: Test ve Eğitim
      description: |-
        Yetkilendirme, veri, işlem ve kullanıcı senaryolarını test ediyor; ekibinize sistem kullanımını aktarıyoruz.
    - title: Destek ve Geliştirme
      description: |-
        Sistemi yayına aldıktan sonra ihtiyaçlarınıza göre yeni modüller ve özellikler ekliyoruz.

projects:
  eyebrow: Başarıyla Tamamladığımız Projeler
  heading: İşletmelerin Yönetim Süreçlerini Daha Akıllı Hale Getirdik.
  lead: |-
    Markaların operasyonel ihtiyaçlarını analiz ederek karmaşık iş süreçlerini sade, yönetilebilir ve ölçülebilir dijital sistemlere dönüştürdük. Siz de işletmenizi bu projeler arasına eklemek için bizimle iletişime geçin.
  items:
    - eyebrow: Ajans Yönetim Sistemi
      title: Pixelon CRM
      description: |-
        Müşteri, teklif, sözleşme, fatura, ödeme, gider ve raporlama süreçlerini tek merkezden yönetmeye imkân tanıyan kapsamlı bir ajans CRM sistemi geliştirdik.
    - eyebrow: Hasta ve Klinik Yönetim Sistemi
      title: Klinik CRM
      description: |-
        Hasta, tedavi, randevu, iletişim, görev, stok ve finans süreçlerini farklı kullanıcı rolleriyle yönetebilen çok şubeli bir klinik sistemi tasarladık.
    - eyebrow: Randevu ve İşletme Yönetimi
      title: Mobico
      description: |-
        Hizmet işletmelerinin randevularını, çalışanlarını, müşterilerini ve günlük operasyonlarını kolayca yönetebileceği kullanıcı dostu ekranlar oluşturduk.

