seo:
  title: Video ve Prodüksiyon Hizmetleri | Pixelon
  description: >-
    Reklam filmi, sosyal medya videosu, ürün çekimi, kurumsal tanıtım ve
    profesyonel prodüksiyon çözümleriyle markanızı etkileyici biçimde anlatın.

hero:
  eyebrow: Video ve Prodüksiyon
  headingLines:
    - "Markanızı İzlenen Değil, *Hatırlanan* Hikâyelere Dönüştürüyoruz."
  lead: |-
    Yaratıcı fikir, profesyonel çekim ve güçlü kurgu süreçlerini bir araya getirerek markanızı hedef kitlenize etkileyici biçimde anlatan fotoğraf ve video içerikleri üretiyoruz.
  tagline: |-
    Reklam filmlerinden Reels içeriklerine, ürün çekimlerinden kurumsal tanıtımlara kadar tüm prodüksiyon sürecini tek ekipte yönetiyoruz.
  whatsappMessage: Merhaba Pixelon, Video ve Prodüksiyon hizmeti hakkında bilgi almak istiyorum.

why:
  eyebrow: Neden Pixelon?
  heading: Prodüksiyonu Marka Stratejinizle Birlikte Planlıyoruz.
  lead: |-
    Video ve fotoğraf içeriklerini yalnızca estetik bir çalışma olarak değerlendirmiyoruz. İçeriğin nerede yayınlanacağını, hangi hedef kitleye ulaşacağını ve kullanıcıdan hangi aksiyonun beklendiğini baştan planlıyoruz.
  items:
    - title: Yaratıcı Fikir ve Strateji
      description: |-
        Her çekim için markanıza ve iletişim hedefinize uygun özgün bir konsept geliştiriyoruz.
    - title: Profesyonel Prodüksiyon
      description: |-
        Kamera, ışık, ses, çekim ve kurgu süreçlerini deneyimli ekiplerle yönetiyoruz.
    - title: Platforma Uygun İçerik
      description: |-
        İçerikleri Instagram, TikTok, YouTube, web sitesi ve reklam kanallarının teknik gereksinimlerine göre hazırlıyoruz.
    - title: Tek İçerikten Çoklu Kullanım
      description: |-
        Çekilen görüntülerden Reels, reklam videosu, hikâye, kısa versiyon ve fotoğraf gibi farklı içerikler üretiyoruz.
    - title: Marka Bütünlüğü
      description: |-
        Tüm içeriklerin markanızın renkleri, iletişim tonu ve görsel kimliğiyle uyumlu olmasını sağlıyoruz.

scope:
  eyebrow: Video ve Prodüksiyon Hizmetlerimiz
  heading: Fikirden Yayına Tüm Prodüksiyon Süreci
  items:
    - title: Kurumsal Tanıtım Filmi
      description: |-
        Markanızın hikâyesini, ekibini, hizmetlerini ve üretim gücünü profesyonel bir anlatımla sunan kurumsal filmler hazırlıyoruz.
    - title: Reklam Filmi Prodüksiyonu
      description: |-
        Dijital reklam, sosyal medya, YouTube ve web sitelerinde kullanılabilecek dikkat çekici reklam filmleri üretiyoruz.
    - title: Reels ve Sosyal Medya Videoları
      description: |-
        Instagram, TikTok, Facebook ve YouTube Shorts için platform dinamiklerine uygun kısa ve etkili videolar hazırlıyoruz.
    - title: Ürün Fotoğrafı ve Videosu
      description: |-
        E-ticaret, sosyal medya, katalog ve reklam çalışmaları için ürünlerinizi öne çıkaran profesyonel çekimler gerçekleştiriyoruz.
    - title: Mekân ve Hizmet Çekimleri
      description: |-
        Klinik, ofis, fabrika, mağaza, otel, restoran ve hizmet alanlarının atmosferini doğru biçimde yansıtan içerikler üretiyoruz.
    - title: Röportaj ve Müşteri Deneyimi Videoları
      description: |-
        Uzmanlık anlatımları, ekip röportajları ve gerçek müşteri deneyimleriyle marka güvenini destekleyen videolar hazırlıyoruz.
    - title: Etkinlik Fotoğrafı ve Videosu
      description: |-
        Lansman, toplantı, konferans, fuar ve kurumsal organizasyonları profesyonel olarak kayıt altına alıyoruz.
    - title: Drone Çekimi
      description: |-
        Projelerinizi, tesislerinizi ve etkinliklerinizi farklı bir perspektiften gösterecek hava çekimleri gerçekleştiriyoruz.
    - title: Kurgu ve Post-Prodüksiyon
      description: |-
        Renk düzenleme, ses tasarımı, altyazı, animasyon, motion graphic ve kurgu işlemleriyle görüntüleri yayına hazır hale getiriyoruz.

process:
  eyebrow: Prodüksiyon Sürecimiz Nasıl İşler?
  heading: Her Kareyi Önceden Planlıyor, Sonucu Şansa Bırakmıyoruz.
  steps:
    - title: Analiz ve Konsept
      description: |-
        Markanızı, hedef kitlenizi ve içeriğin amacını analiz ederek yaratıcı fikri geliştiriyoruz.
    - title: Senaryo ve Çekim Planı
      description: |-
        Sahne akışını, çekim mekânlarını, ihtiyaç duyulan ekipmanı ve prodüksiyon takvimini belirliyoruz.
    - title: Prodüksiyon
      description: |-
        Profesyonel kamera, ışık ve ses ekipmanlarıyla planlanan çekimleri gerçekleştiriyoruz.
    - title: Kurgu ve Post-Prodüksiyon
      description: |-
        Görüntü seçimi, kurgu, renk, ses, altyazı ve animasyon çalışmalarını tamamlıyoruz.
    - title: Revizyon ve Teslim
      description: |-
        İçeriği onayınıza sunuyor, gerekli düzenlemeleri yaparak farklı platformlara uygun formatlarda teslim ediyoruz.

