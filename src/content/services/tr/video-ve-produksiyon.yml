projects:
  eyebrow: Başarıyla Tamamladığımız Projeler
  heading: Markaların Hikâyelerini Güçlü Görsellerle Anlattık.
  lead: |-
    Yaratıcı fikirler ve profesyonel prodüksiyon süreçleriyle farklı sektörlerdeki markaların ürünlerini, hizmetlerini ve hikâyelerini hedef kitlelerine etkileyici biçimde aktardık. Siz de markanızı bu projeler arasına eklemek için bizimle iletişime geçin.
  items:
    - eyebrow: Sağlık Turizmi Video İçerikleri
      title: Dentasay
      description: |-
        Tedavi süreçleri, klinik deneyimi, doktor anlatımları ve uluslararası hasta iletişiminde kullanılmak üzere sosyal medya ve reklam videoları hazırladık.
    - eyebrow: Dermatoloji ve Uzmanlık Videoları
      title: Dr. Ayşe Cinkaya Kahveci
      description: |-
        Dermatoloji ve estetik uygulamaları anlaşılır, güven veren ve sosyal medya kullanımına uygun kısa video formatlarıyla anlattık.
    - eyebrow: Kurumsal ve Proje Tanıtım İçerikleri
      title: Xray Groupe
      description: |-
        Mimarlık, mühendislik ve inşaat projelerinin ölçeğini ve kurumsal gücünü yansıtan profesyonel görsel içerikler oluşturduk.
    - eyebrow: Ürün Fotoğrafı ve Tanıtım Videoları
      title: Sera Natura
      description: |-
        Ürünlerin doğal, kaliteli ve premium algısını destekleyen fotoğraf, sosyal medya ve reklam içerikleri hazırladık.

value:
  eyebrow: Her Marka Anlatılmaya Değer Bir Hikâyeye Sahiptir
  heading: Hikâyenizi Görsel Bir Deneyime Dönüştürüyoruz.
  lead: |-
    Görsel içerikler, markaların hedef kitleleriyle hızlı ve güçlü bir bağ kurmasını sağlar. Ancak etkili bir video yalnızca kaliteli görüntülerden değil; doğru fikir, güçlü senaryo, profesyonel çekim ve hedefe uygun kurgudan oluşur.

    Pixelon olarak prodüksiyon sürecine markanızı, hedef kitlenizi ve içeriğin yayınlanacağı platformu analiz ederek başlıyoruz. Her kareyi marka algınızı güçlendirecek ve kullanıcıyı harekete geçirecek şekilde planlıyoruz.

    Sadece görüntü çekmiyor, markanızın mesajını izleyiciye hissettiren içerikler üretiyoruz.
  bullets: []

sectors:
  eyebrow: Sektör Deneyimimiz
  heading: Hangi Sektörlerle Çalışıyoruz?
  body: |-
    Sağlık ve klinik markaları, sağlık turizmi firmaları, e-ticaret işletmeleri, inşaat ve gayrimenkul şirketleri ile hizmet sektöründeki KOBİ ve kurumsal markalar için video ve prodüksiyon hizmetleri sunuyoruz. Her sektör için hedef kitleye, kullanılacak platforma ve marka diline uygun ayrı bir görsel anlatım geliştiriyoruz.
  items:
    - Sağlık ve klinik markaları
    - Sağlık turizmi firmaları
    - E-ticaret işletmeleri
    - İnşaat ve gayrimenkul şirketleri
    - Hizmet sektöründeki KOBİ'ler
    - Kurumsal markalar

cta:
  eyebrow: Markanızı Profesyonel Görsellerle Öne Çıkaralım
  heading: Hikâyenizi Anlatmaya Hazır mısınız?
  lead: |-
    Markanızı, ürünlerinizi veya hizmetlerinizi profesyonel fotoğraf ve video içerikleriyle anlatmak için Pixelon ekibiyle iletişime geçin. İhtiyaçlarınızı dinleyelim, yaratıcı konsepti oluşturalım ve markanızı öne çıkaracak prodüksiyon planını birlikte hazırlayalım.

faq:
  eyebrow: Merak Edilenler
  heading: Video ve Prodüksiyon Hakkında Sıkça Sorulan Sorular
  items:
    - question: Video prodüksiyon hizmetine neler dahildir?
      answer: |-
        Projenin kapsamına göre konsept, senaryo, çekim planı, ekipman, prodüksiyon, kurgu, renk düzenleme, ses tasarımı, altyazı ve teslim işlemleri hizmete dâhil edilebilir.
    - question: Fotoğraf ve video çekimi birlikte yapılabilir mi?
      answer: |-
        Evet. Aynı çekim günü içerisinde hem fotoğraf hem de video içerikleri üretilebilir. Bu sayede farklı platformlarda kullanılabilecek daha geniş bir içerik arşivi oluşturulur.
    - question: Çekimler nerede gerçekleştiriliyor?
      answer: |-
        Çekimler markanın ofisinde, kliniğinde, mağazasında, fabrikasında, açık alanda veya projeye uygun kiralık stüdyolarda gerçekleştirilebilir.
    - question: Reels videolarının fikirlerini de hazırlıyor musunuz?
      answer: |-
        Evet. İçerik konuları, video girişleri, senaryolar, sahne planları ve çekim fikirleri Pixelon tarafından hazırlanabilir.
    - question: Videolar farklı formatlarda teslim ediliyor mu?
      answer: |-
        Evet. Videolar ihtiyaca göre dikey, yatay ve kare formatlarda; Instagram, TikTok, YouTube, web sitesi ve reklam platformlarına uygun şekilde teslim edilebilir.
    - question: Drone çekimi yapıyor musunuz?
      answer: |-
        Projenin mekânına, hava koşullarına ve yasal izinlere uygun olması halinde drone çekimi planlanabilir.
