intro:
  eyebrow: Kimlik, Logo Demek Değildir
  heading: Markanızın Her Yerde Aynı Şeyi Söylemesini Sağlıyoruz
  body: |-
    Bir logo markanın yalnız imzasıdır. Kurumsal kimlik ise o imzanın etrafındaki sistemdir: hangi renk nerede kullanılır, başlık hangi puntoyla yazılır, kartvizitte ne durur, sunumda ne durur, ambalajda ne durur.

    Bu sistem kurulmadığında her tasarım sıfırdan başlar ve marka her temas noktasında biraz daha dağılır. Pixelon olarak önce markanın ne söylediğini netleştiriyor, sonra o sözü taşıyacak görsel dili ve uygulama kurallarını yazıyoruz.
  highlight: |-
    Amacımız güzel bir logo teslim etmek değil; sizden sonra da doğru uygulanabilecek bir sistem bırakmak.

why:
  eyebrow: Neden Pixelon?
  heading: Logonuzu Değil, Markanızın Bütününü Tasarlıyoruz.
  lead: |-
    Marka tasarımını tek başına bir logo çalışması olarak değerlendirmiyoruz. Strateji, görsel dil, iletişim tonu ve farklı uygulama alanlarını birbirini tamamlayan bir sistem halinde ele alıyoruz.
  items:
    - title: Stratejiyle Başlarız
      icon: team
      featured: true
      description: |-
        Her tasarım kararını markanızın hedeflerine ve konumlandırmasına göre veririz.
    - title: Markaya Özel Üretiriz
      icon: conversion
      description: |-
        Hazır simgeler ve standart çözümler yerine özgün tasarım fikirleri geliştiririz.
    - title: Tüm Temas Noktalarını Düşünürüz
      icon: cycle
      description: |-
        Kimliğin web sitesi, sosyal medya, reklam, baskı ve ambalajlarda nasıl görüneceğini birlikte planlarız.
    - title: Uygulanabilir Bir Sistem Sunarız
      icon: report
      featured: true
      description: |-
        Kurumsal kimliğinizi farklı ekiplerin ve tedarikçilerin doğru kullanabilmesi için açık bir marka kılavuzu hazırlarız.

scope:
  layout: list
  eyebrow: Marka ve Kurumsal Kimlik Hizmetlerimiz
  heading: Markanızın İhtiyaç Duyduğu Tüm Görsel Sistem
  items:
    - title: Marka Stratejisi
      description: |-
        Markanızın konumlandırmasını, hedef kitlesini, rakiplerinden ayrılan yönlerini ve temel iletişim yaklaşımını belirliyoruz.
    - title: Marka İsmi ve Slogan
      description: |-
        Yeni markalar için akılda kalıcı isim alternatifleri, marka söylemi ve güçlü slogan seçenekleri oluşturuyoruz.
    - title: Logo Tasarımı
      description: |-
        Markanızın karakterini yansıtan, özgün, kolay hatırlanan ve farklı kullanım alanlarına uyum sağlayan logo sistemleri tasarlıyoruz.
    - title: Renk Paleti ve Tipografi
      description: |-
        Markanızın vermek istediği duyguya ve sektörel konumuna uygun renk, yazı karakteri ve görsel stil belirliyoruz.
    - title: Kurumsal Kimlik Kılavuzu
      description: |-
        Logo kullanımı, renk kodları, tipografi, görsel dil ve uygulama kurallarını içeren kapsamlı bir marka kılavuzu hazırlıyoruz.
    - title: Kurumsal Materyaller
      description: |-
        Kartvizit, antetli kâğıt, zarf, dosya, teklif şablonu, sunum, e-posta imzası ve diğer kurumsal dokümanları tasarlıyoruz.
    - title: Sosyal Medya Görsel Sistemi
      description: |-
        Markanızın sosyal medya hesaplarında tutarlı görünmesini sağlayan gönderi, hikâye, Reels kapağı ve kampanya şablonları oluşturuyoruz.
    - title: Ambalaj ve Ürün Tasarımı
      description: |-
        Ürününüzü rafta ve dijital ortamda öne çıkaran ambalaj, etiket ve ürün sunum tasarımları hazırlıyoruz.

