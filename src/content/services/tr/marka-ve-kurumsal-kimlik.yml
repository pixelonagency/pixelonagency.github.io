  heading: Markanızın Kim Olduğunu Görsel Bir Dile Dönüştürüyoruz.
  lead: |-
    Marka kimliği yalnızca bir logodan ibaret değildir. Renklerden tipografiye, kullanılan görsellerden iletişim diline kadar her detay, müşterilerinizin markanız hakkında nasıl hissettiğini belirler.
  bullets:
    - |-
      Pixelon olarak markanızın hikâyesini, hedef kitlesini, sektörünü ve gelecek hedeflerini analiz ediyor; tüm temas noktalarında aynı güveni ve kalite algısını oluşturan bir kurumsal kimlik sistemi tasarlıyoruz.
    - |-
      İyi bir marka kimliği yalnızca güzel görünmez; markanızı tanıtır, farklılaştırır ve hatırlanır hale getirir.

