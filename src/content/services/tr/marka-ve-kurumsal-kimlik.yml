    Uluslararası pazarlara açılmak isteyen markalar

cta:
  eyebrow: Markanızın Yeni Kimliğini Birlikte Oluşturalım
  heading: Markanız Gerçek Potansiyelini Yansıtmaya Hazır mı?
  lead: |-
    Yeni bir marka oluşturmak, mevcut logonuzu yenilemek veya tüm kurumsal iletişiminizi daha güçlü ve tutarlı hale getirmek için Pixelon ekibiyle iletişime geçin. Markanızı dinleyelim, hikâyesini anlayalım ve sizi rakiplerinizden ayıracak özgün bir kimlik tasarlayalım.

faq:
  eyebrow: Merak Edilenler
  heading: Marka ve Kurumsal Kimlik Hakkında Sıkça Sorulan Sorular
  items:
    - question: Kurumsal kimlik çalışmasına neler dahildir?
      answer: |-
        Projenin kapsamına göre logo, renk paleti, tipografi, kartvizit, antetli kâğıt, e-posta imzası, sosyal medya şablonları ve marka kullanım kılavuzu dâhil edilebilir.
    - question: Sadece logo tasarımı yaptırabilir miyiz?
      answer: |-
        Evet. Yalnızca logo tasarımı yapılabilir. Ancak markanın farklı alanlarda tutarlı kullanılması için temel kurumsal kimlik sisteminin oluşturulmasını öneriyoruz.
    - question: Logo tasarım süreci ne kadar sürer?
      answer: |-
        Süre; araştırma, konsept sayısı, geri bildirimler ve kurumsal uygulamaların kapsamına göre değişir. Proje takvimi çalışma başlamadan önce netleştirilir.
    - question: Logo dosyaları hangi formatlarda teslim edilir?
      answer: |-
        Logo; baskı ve dijital kullanım için uygun vektörel ve görsel formatlarda teslim edilir. Renkli, siyah, beyaz ve ihtiyaç duyulan farklı kullanım versiyonları hazırlanır.
    - question: Mevcut markamızın kimliği yenilenebilir mi?
      answer: |-
        Evet. Mevcut marka bilinirliğini tamamen kaybetmeden logo, renk sistemi, tipografi ve iletişim dili güncellenerek yeniden markalama çalışması yapılabilir.
