intro:
  eyebrow: İlk İzlenim
  heading: Markanızın Dijital Dünyadaki En Güçlü Yüzünü Oluşturuyoruz
  body: |-
    Web siteniz çoğu zaman müşterilerinizin markanızla kurduğu ilk temastır. Bu nedenle yalnızca güzel görünmesi değil; markanızı doğru anlatması, güven oluşturması ve ziyaretçiyi harekete geçirmesi gerekir.

    Pixelon olarak web tasarım sürecini estetik, kullanıcı deneyimi, teknoloji, hız ve SEO altyapısıyla birlikte ele alıyoruz. Markanıza özel tasarlanan web siteleriyle dijital dünyada güçlü ve profesyonel bir görünüm oluşturuyoruz.

    Sadece web sitesi tasarlamıyor, markanız için çalışan bir dijital satış ve iletişim alanı oluşturuyoruz.

scope:
  eyebrow: Web Tasarım Hizmetlerimiz
  heading: İhtiyacınıza Uygun, Markanıza Özel Web Çözümleri
  layout: list
  items:
    - title: Kurumsal Web Sitesi
      description: >-
        Markanızın yapısını ve uzmanlığını yansıtan, yönetilebilir web siteleri
        tasarlıyoruz. Kurumsal projeler için [ayrı bir hizmet
        sayfamız](/hizmetlerimiz/kurumsal-web-tasarim/) var.
    - title: E-Ticaret Sitesi
      description: >-
        Ürünlerinizi etkileyici biçimde sunan, kullanıcıların kolayca alışveriş
        yapmasını sağlayan satış odaklı e-ticaret altyapıları oluşturuyoruz.
    - title: Landing Page Tasarımı
      description: >-
        Google ve Meta reklam kampanyalarından gelen ziyaretçileri teklif,
        arama, WhatsApp veya form dönüşümüne yönlendiren özel açılış sayfaları
        hazırlıyoruz.
    - title: Çok Dilli Web Sitesi
      description: >-
        Farklı ülke ve pazarlardaki hedef kitlelere ulaşabilmeniz için çok
        dilli, SEO uyumlu ve kolay yönetilebilir web siteleri geliştiriyoruz.
    - title: Sağlık ve Klinik Web Siteleri
      description: >-
        Klinikler, doktorlar ve sağlık turizmi markaları için güven oluşturan,
        tedavileri anlaşılır biçimde sunan ve randevu talebi toplayan web
        siteleri tasarlıyoruz.
    - title: Özel Web Yazılımı
      description: >-
        Hazır sistemlerin yetersiz kaldığı projelerde markanızın iş süreçlerine
        özel panel, form, rezervasyon, üyelik ve entegrasyon çözümleri
        geliştiriyoruz.

principles:
  eyebrow: Web Sitesi Kurarken Neleri Birlikte Ele Alıyoruz?
  heading: Tasarımdan Önce Karar, Yayından Sonra Bakım
  items:
    - title: Hedef ve Kullanıcı Tanımı
      icon: audience
      description: |-
        Siteye kim gelecek, ne arayacak ve hangi aksiyonu alması bekleniyor — tasarıma başlamadan önce bunu netleştiriyoruz.
    - title: Bilgi Mimarisi
      icon: strategy
      description: |-
        Menü yapısı, sayfa hiyerarşisi ve içerik akışı. Kullanıcının aradığını en az tıklamayla bulması bu katmanda çözülür.
    - title: Arayüz ve Marka Dili
      icon: creative
      description: |-
        Tipografi, renk, boşluk ve görsel dil markanızla tutarlı olacak biçimde kurgulanıyor. Şablon değil, size ait bir arayüz.
    - title: Dönüşüm Noktaları
      icon: landing
      description: |-
        Form, WhatsApp, telefon ve teklif butonlarının nerede duracağını rastgele değil, kullanıcının karar anına göre yerleştiriyoruz.
    - title: Hız ve Teknik Sağlık
      icon: tracking
      description: |-
        Görsel optimizasyonu, önbellekleme, Core Web Vitals ve mobil performans. Yavaş site hem kullanıcıyı hem sıralamayı kaybettirir.
    - title: Yayın Sonrası Bakım
      icon: optimize
      description: |-
        Güncelleme, yedekleme, güvenlik ve içerik ekleme. Site yayına girdiğinde iş bitmiyor, orada başlıyor.

why:
  eyebrow: Standartlarımız
  heading: Güzel Görünmenin Ötesinde, Sonuç Üreten Bir Deneyim
  items:
    - title: Markaya Özel Tasarım
      icon: team
      featured: true
      description: >-
        Hazır şablonlar yerine markanızın kimliğine, sektörüne ve hedef
        kitlesine uygun özgün arayüzler tasarlıyoruz.
    - title: Mobil Uyumluluk
      icon: cycle
      description: >-
        Web sitenizin telefon, tablet ve masaüstü cihazlarda kusursuz
        görünmesini sağlıyoruz.
    - title: Hız ve Performans
      icon: conversion
      description: >-
        Sayfa yüklenme sürelerini iyileştirerek kullanıcı deneyimini ve arama
        motoru performansını destekliyoruz.
    - title: SEO Altyapısı
      icon: report
      description: >-
        Başlık yapıları, URL düzeni, meta alanları, görsel optimizasyonu ve
        teknik altyapıyı SEO standartlarına uygun hazırlıyoruz.
    - title: Dönüşüm Odaklı Yapı
      icon: team
      description: >-
        WhatsApp, telefon, teklif ve iletişim formu gibi aksiyonları doğru
        noktalarda konumlandırarak daha fazla talep alınmasını hedefliyoruz.
    - title: Yönetilebilir Admin Paneli
      icon: cycle
      featured: true
      description: >-
        İçeriklerinizi, hizmetlerinizi, projelerinizi, blog yazılarınızı ve
        iletişim taleplerinizi kolayca yönetebileceğiniz bir panel
        oluşturuyoruz.

process:
  eyebrow: Adım Adım
  heading: Fikirden Yayına Planlı ve Şeffaf Bir Süreç
  steps:
    - title: Keşif ve İhtiyaç Analizi
      icon: discover
      description: >-
        Markanızı, hedef kitlenizi, rakiplerinizi ve web sitesinden
        beklentilerinizi öğreniyoruz.
    - title: İçerik ve Site Mimarisi
      icon: plan
      description: >-
        Sayfaları, kullanıcı yolculuğunu, içerik başlıklarını ve
        yönlendirmeleri planlıyoruz.
    - title: UX/UI Tasarımı
      icon: build
      description: >-
        Markanızın görsel kimliğine uygun masaüstü ve mobil arayüzleri
        tasarlıyoruz.
    - title: Yazılım ve Geliştirme
      icon: optimize
      description: >-
        Onaylanan tasarımı hızlı, güvenli, yönetilebilir ve mobil uyumlu bir
        web sitesine dönüştürüyoruz.
    - title: Test ve Yayın
      icon: launch
      description: >-
        Formları, bağlantıları, sayfa hızını, farklı cihazları ve SEO ayarlarını
        kontrol ederek siteyi yayına alıyoruz.
    - title: Destek ve Geliştirme
      icon: measure
      description: >-
        Yayın sonrasında ihtiyaç duyulan güncelleme, bakım ve geliştirme
        süreçlerinde markanıza destek oluyoruz.

