title: Sağlık Turizmi Danışmanlığı
navLabel: Sağlık Turizmi Danışmanlığı
translationKey: health-tourism
order: 9

seo:
  title: Sağlık Turizmi Dijital Pazarlama Danışmanlığı | Pixelon
  description: >-
    Çok dilli web sitesi, uluslararası reklam, içerik üretimi ve hasta iletişim
    sistemleriyle sağlık markanızı global pazarlarda büyütün.

hero:
  eyebrow: Sağlık Turizmi Danışmanlığı
  headingLines:
    - "Kliniğinizi *Global Hastalarla* Buluşturan Dijital Sistemler Kuruyoruz."
  lead: |-
    Çok dilli web sitesi, uluslararası reklam kampanyaları, içerik üretimi ve hasta iletişim süreçlerini tek strateji altında yöneterek markanızın global pazarlarda büyümesini sağlıyoruz.
  tagline: |-
    İlk reklam temasından tedavi talebine kadar tüm dijital hasta yolculuğunu birlikte planlıyoruz.
  whatsappMessage: |-
    Merhaba Pixelon, Sağlık Turizmi Danışmanlığı hizmeti hakkında bilgi almak istiyorum.

intro:
  eyebrow: Sağlık Turizminde Başarı Yalnızca Reklamla Gelmez
  heading: Güven Veren Bir Marka ve Kesintisiz Hasta Deneyimi Oluşturuyoruz.
  body: |-
    Uluslararası hastalar tedavi kararı verirken yalnızca fiyatı değerlendirmez. Klinik güvenilirliği, doktor deneyimi, hasta yorumları, iletişim hızı, konaklama ve transfer gibi tüm süreci birlikte inceler.

    Pixelon olarak sağlık turizmi çalışmalarını tek başına reklam yönetimi olarak ele almıyoruz. Markanızın dijital görünümünden hasta danışmanlarının iletişim sürecine kadar bütün temas noktalarını analiz ediyoruz. Hedef ülkeye uygun içerikler, çok dilli dijital altyapı ve dönüşüm odaklı kampanyalarla daha nitelikli hasta talepleri oluşturmayı amaçlıyoruz.
  highlight: |-
    Amacımız yalnızca daha fazla mesaj almak değil, tedaviye dönüşme potansiyeli yüksek hasta talepleri oluşturmaktır.

why:
  eyebrow: Neden Pixelon?
  heading: Sağlık İletişimini Pazarlama, Teknoloji ve Operasyonla Birleştiriyoruz.
  lead: |-
    Sağlık turizminde yalnızca reklam kampanyası hazırlamak yeterli değildir. Reklam sonrası iletişim hızı, web sitesinin güven vermesi ve hasta taleplerinin doğru takip edilmesi sonuçları doğrudan etkiler.
  items:
    - title: Sağlık Sektörü Deneyimi
      description: |-
        Hasta davranışlarını, güven unsurlarını ve sağlık iletişimindeki hassasiyetleri dikkate alıyoruz.
    - title: Çok Dilli Üretim
      description: |-
        İçerikleri yalnızca çevirmiyor, hedef ülkenin kültürüne ve kullanıcı beklentilerine uygun biçimde hazırlıyoruz.
    - title: Reklam ve CRM Entegrasyonu
      description: |-
        Reklamlardan gelen taleplerin kaybolmadan takip edilmesini sağlayan dijital süreçler oluşturuyoruz.
    - title: Dönüşüm Odaklı Yaklaşım
      description: |-
        Gösterim ve tıklamaların ötesinde WhatsApp, form, ön değerlendirme ve tedavi talebi gibi sonuçlara odaklanıyoruz.
    - title: Şeffaf Raporlama
      description: |-
        Ülke, tedavi ve kampanya bazındaki performansı anlaşılır raporlarla paylaşıyoruz.

scope:
  eyebrow: Sağlık Turizmi Hizmetlerimiz
  heading: Uluslararası Hasta Kazanımı İçin Bütüncül Çözümler
  items:
    - title: Pazar ve Rakip Analizi
      description: |-
        Hedef ülkelerdeki hasta davranışlarını, tedavi taleplerini, rekabet koşullarını ve iletişim fırsatlarını analiz ediyoruz.
    - title: Çok Dilli Web Sitesi
      description: |-
        Tedavilerinizi, doktorlarınızı ve klinik deneyiminizi güven veren bir yapıda anlatan, mobil uyumlu ve dönüşüm odaklı web siteleri hazırlıyoruz.
    - title: Uluslararası Reklam Yönetimi
      description: |-
        Google, Instagram ve Facebook üzerinden ülke, şehir, dil ve tedavi bazlı reklam kampanyaları oluşturuyoruz.
    - title: Landing Page Tasarımı
      description: |-
        İmplant, estetik diş hekimliği, saç ekimi veya farklı tedavilere özel; WhatsApp, telefon ve form dönüşümünü destekleyen reklam sayfaları hazırlıyoruz.
    - title: Çok Dilli İçerik Üretimi
      description: |-
        Hedef kitlenin diline ve iletişim alışkanlıklarına uygun reklam metinleri, sosyal medya içerikleri, videolar ve tedavi açıklamaları oluşturuyoruz.
    - title: Hasta İletişim Süreçleri
      description: |-
        İlk mesaj, ön değerlendirme, fotoğraf ve röntgen talebi, fiyat paylaşımı ve takip aşamaları için iletişim akışları hazırlıyoruz.
    - title: CRM ve Talep Yönetimi
      description: |-
        Farklı ülkelerden gelen hasta taleplerinin kaydedilebildiği, takip edilebildiği ve raporlanabildiği sistemler kuruyoruz.
    - title: Yurt Dışı Konsültasyon Organizasyonları
      description: |-
        Hedef ülkelerde düzenlenen ön görüşme ve konsültasyon etkinlikleri için reklam, kayıt toplama ve iletişim süreçlerini planlıyoruz.

principles:
  eyebrow: Hasta Yolculuğunu Nasıl Planlıyoruz?
  heading: Reklamdan Tedavi Kararına Kadar Her Temas Noktasını Güçlendiriyoruz.
  items:
    - title: "01 — Farkındalık"
      description: |-
        Hedef pazara uygun reklam ve içeriklerle kliniğinizi potansiyel hastaların karşısına çıkarıyoruz.
    - title: "02 — Güven"
      description: |-
        Doktor deneyimi, klinik altyapısı, hasta yorumları ve tedavi süreçlerini güçlü bir dijital deneyimle sunuyoruz.
    - title: "03 — İletişim"
      description: |-
        WhatsApp, telefon ve form üzerinden hızlı ve kolay iletişim kurulmasını sağlıyoruz.
    - title: "04 — Ön Değerlendirme"
      description: |-
        Hasta fotoğrafları, röntgenleri ve tedavi beklentilerinin düzenli biçimde toplanacağı iletişim akışları oluşturuyoruz.
    - title: "05 — Teklif ve Takip"
      description: |-
        Tedavi planı, fiyat, konaklama ve transfer bilgilerinin anlaşılır biçimde paylaşılmasını destekliyoruz.
    - title: "06 — Ölçüm"
      description: |-
        Hangi ülke, reklam ve tedavinin daha nitelikli talep oluşturduğunu analiz ederek stratejiyi geliştiriyoruz.

platforms:
  eyebrow: Hangi Alanlarda Çalışıyoruz?
  heading: Sağlık Markanızın Uzmanlık Alanına Özel Stratejiler
  items:
    - title: Ağız ve Diş Sağlığı
      description: |-
        İmplant, zirkonyum, Hollywood Smile, estetik diş hekimliği ve diğer tedaviler için uluslararası hasta kazanım sistemleri oluşturuyoruz.
    - title: Dermatoloji ve Medikal Estetik
      description: |-
        Uzmanlık, güven ve doğal sonuç algısını destekleyen çok dilli dijital iletişim çalışmaları hazırlıyoruz.
    - title: Saç Ekimi ve Estetik Cerrahi
      description: |-
        Hasta beklentilerini doğru yöneten, tedavi sürecini şeffaf biçimde anlatan dönüşüm odaklı kampanyalar planlıyoruz.
    - title: Beslenme ve Vücut Uygulamaları
      description: |-
        Danışmanlık, klinik hizmet ve paketlerin farklı pazarlarda doğru hedef kitlelere ulaşmasını sağlıyoruz.
    - title: Özel Klinikler ve Sağlık Merkezleri
      description: |-
        Birden fazla uzmanlık alanına sahip kurumlar için bütüncül marka, web, reklam ve hasta iletişim sistemleri kuruyoruz.

process:
  eyebrow: Sağlık Turizmi Proje Sürecimiz
  heading: Hedef Pazardan Nitelikli Hasta Talebine
  steps:
    - title: Klinik ve Pazar Analizi
      description: |-
        Tedavilerinizi, hasta kapasitenizi, hedef ülkelerinizi ve mevcut dijital performansınızı inceliyoruz.
    - title: Strateji ve Altyapı
      description: |-
        Hedef tedavileri, iletişim dilini, web yapısını, reklam kanallarını ve dönüşüm yöntemlerini belirliyoruz.
    - title: İçerik ve Kampanya Üretimi
      description: |-
        Reklam metinleri, görseller, videolar, landing page içerikleri ve hasta iletişim şablonlarını hazırlıyoruz.
    - title: Yayın ve Talep Yönetimi
      description: |-
        Kampanyaları yayına alıyor, gelen taleplerin doğru biçimde kaydedilmesi ve yönlendirilmesi için sistemi kuruyoruz.
    - title: Optimizasyon ve Raporlama
      description: |-
        Talep maliyeti, hasta kalitesi, ülke ve tedavi performansını analiz ederek kampanyaları geliştiriyoruz.

projects:
  eyebrow: Başarıyla Tamamladığımız Projeler
  heading: Sağlık Markalarını Uluslararası Hastalarla Buluşturduk.
  lead: |-
    Çok dilli içerikler, ülke bazlı reklam kampanyaları ve dönüşüm odaklı dijital sistemlerle sağlık markalarının global pazarlardaki görünürlüğünü güçlendirdik. Siz de kliniğinizi bu başarı hikâyeleri arasına eklemek için bizimle iletişime geçin.
  items:
    - eyebrow: Avrupa Hedefli Hasta Kazanım Sistemi
      title: Dentasay
      description: |-
        Diş tedavileri için çok dilli reklam içerikleri, ülke bazlı kampanyalar, tedavi sayfaları ve hasta iletişim akışları oluşturduk.
      href: /projelerimiz/dentasay/
    - eyebrow: Dönüşüm Odaklı Klinik İletişimi
      title: Retina Ağız ve Diş Sağlığı
      description: |-
        İmplant, zirkonyum ve estetik gülüş tedavilerini güven veren bir yapıyla anlatan reklam, web sitesi ve hasta talep sistemi geliştirdik.
    - eyebrow: Ülke ve Şehir Bazlı Hasta Organizasyonları
      title: Uluslararası Konsültasyon Etkinlikleri
      description: |-
        Avrupa'nın farklı şehirlerinde düzenlenen ücretsiz ön görüşmeler için yerel dilde reklam kampanyaları, kayıt formları ve takip iletişimleri hazırladık.

value:
  eyebrow: Hedef Pazarlarınız İçin Özel Stratejiler
  heading: Her Pazara Kendi Diliyle Konuşuyoruz.
  lead: |-
    Sağlık turizmi çalışmalarında her ülkeye aynı reklamı ve iletişim dilini kullanmıyoruz. Hedef pazardaki kullanıcıların fiyat beklentilerini, tedavi araştırma davranışlarını, güven unsurlarını ve iletişim alışkanlıklarını analiz ediyoruz. Her pazar için dil, kreatif, teklif, reklam kanalı ve hasta takip yaklaşımını ayrı biçimde planlıyoruz.
  bullets:
    - Birleşik Krallık ve İrlanda
    - Almanya ve Avrupa Ülkeleri
    - Romanya ve Bulgaristan
    - Fransa, İspanya ve İtalya
    - Orta Doğu Ülkeleri
    - Afrika Pazarları

cta:
  eyebrow: Kliniğinizi Global Pazarlarda Birlikte Büyütelim
  heading: Daha Fazla Uluslararası Hastaya Ulaşmaya Hazır mısınız?
  lead: |-
    Kliniğiniz için doğru hedef ülkeleri belirlemek, çok dilli dijital altyapı oluşturmak ve nitelikli hasta talepleri kazanmak için Pixelon ekibiyle iletişime geçin. Mevcut durumunuzu analiz edelim ve sağlık markanıza özel uluslararası büyüme yol haritasını birlikte hazırlayalım.

faq:
  eyebrow: Merak Edilenler
  heading: Sağlık Turizmi Danışmanlığı Hakkında Sıkça Sorulan Sorular
  items:
    - question: Sağlık turizmi danışmanlığı hizmetine neler dahildir?
      answer: |-
        Projenin kapsamına göre pazar analizi, çok dilli web sitesi, reklam yönetimi, içerik üretimi, landing page, CRM, hasta iletişim şablonları ve performans raporlaması dâhil edilebilir.
    - question: Hangi ülkelerde reklam çalışması yapıyorsunuz?
      answer: |-
        Kliniğin hizmetleri ve hedefleri doğrultusunda Avrupa, Birleşik Krallık, Orta Doğu ve Afrika ülkelerine yönelik kampanyalar planlanabilir.
    - question: İçerikleri farklı dillerde hazırlıyor musunuz?
      answer: |-
        Evet. Web sitesi, reklam, sosyal medya ve hasta iletişim içerikleri hedef pazara uygun farklı dillerde hazırlanabilir.
    - question: Gelen hasta taleplerini Pixelon mu yanıtlıyor?
      answer: |-
        Hizmet kapsamına göre hasta danışmanlarına iletişim şablonları, takip akışları ve CRM altyapısı sunabiliriz. Operasyonel iletişim modeli klinikle birlikte belirlenir.
    - question: Sağlık turizmi reklamlarından ne zaman sonuç alınır?
      answer: |-
        Sonuçlar hedef ülke, tedavi, bütçe, rekabet, teklif ve hasta danışmanı performansına göre değişir. Kampanyalar veri toplandıkça düzenli olarak geliştirilir.
    - question: Mevcut reklamlarımız analiz edilebilir mi?
      answer: |-
        Evet. Reklam hesapları, web sitesi, landing page, dönüşüm ölçümleri ve hasta takip süreci analiz edilerek geliştirme yol haritası hazırlanabilir.
