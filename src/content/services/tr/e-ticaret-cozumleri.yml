  heading: Hangi Sektörlerle Çalışıyoruz?
  body: >-
    Kozmetik ve bakım, gıda ve takviye, moda ve tekstil, ambalaj ve endüstriyel
    ürün ile hizmet sektöründeki markalar için e-ticaret altyapısı kuruyoruz.
    Her sektörün ürün gamı, kargo yapısı ve satın alma kararı farklıdır; kategori
    kurgusunu ve ödeme akışını buna göre değiştiriyoruz.
