cta:
  eyebrow: Dijital Mağazanızı Birlikte Büyütelim
  heading: Daha Güçlü Bir E-Ticaret Deneyimine Hazır mısınız?
  lead: >-
    Yeni bir e-ticaret sitesi kurmak, mevcut mağazanızı yenilemek veya satış
    süreçlerinizi daha verimli hale getirmek için Pixelon ekibiyle iletişime
    geçin. Ürünlerinizi, hedef kitlenizi ve satış hedeflerinizi analiz edelim;
    markanıza özel e-ticaret yol haritasını birlikte oluşturalım.

faq:
  eyebrow: Merak Edilenler
  heading: E-Ticaret Çözümleri Hakkında Sıkça Sorulan Sorular
  items:
    - question: E-ticaret sitesi hizmetine neler dahildir?
      answer: >-
        Projenin kapsamına göre tasarım, yazılım, ürün ve kategori yapısı,
        ödeme, kargo, stok, sipariş, kampanya ve raporlama sistemleri dâhil
        edilebilir.
    - question: E-ticaret sitesini kendimiz yönetebilir miyiz?
      answer: >-
        Evet. Ürünleri, fiyatları, stokları, siparişleri, kampanyaları ve
        içerikleri yönetebileceğiniz kullanıcı dostu bir admin paneli hazırlanır.
    - question: Hangi ödeme sistemleri entegre edilebilir?
      answer: >-
        İhtiyaca göre Türkiye'de ve hedef pazarlarda kullanılan uygun sanal POS
        ve ödeme sistemleri entegre edilebilir.
    - question: Pazaryeri entegrasyonu yapıyor musunuz?
      answer: >-
        Projenin ihtiyaçlarına göre ürün, stok ve sipariş verilerinin
        pazaryerleriyle entegre çalışması sağlanabilir.
    - question: E-ticaret sitesi mobil uyumlu olur mu?
      answer: >-
        Evet. Tüm sayfalar ve satın alma adımları telefon, tablet ve masaüstü
        cihazlar için optimize edilir.
    - question: Ürün fotoğrafı ve içerik desteği sunuyor musunuz?
      answer: >-
        Evet. Ürün fotoğrafı, tanıtım videosu, ürün açıklaması ve SEO uyumlu
        kategori içerikleri ayrıca planlanabilir.
