title: Sosyal Medya Yönetimi
navLabel: Sosyal Medya Yönetimi
order: 2
translationKey: social-media

seo:
  title: Sosyal Medya Yönetimi Hizmeti | Pixelon Dijital Ajans
  description: >-
    Pixelon ile markanıza özel sosyal medya stratejisi, içerik üretimi, Reels,
    tasarım, topluluk yönetimi ve performans odaklı sosyal medya hizmeti alın.

hero:
  eyebrow: Sosyal Medya Yönetimi
  headingLines:
    - "Markanızı Kaydırılıp Geçilen Değil, *Takip Edilen* Bir Hikâyeye Dönüştürüyoruz."
  lead: |-
    Strateji, yaratıcı içerik, profesyonel tasarım ve video üretimini bir araya getirerek markanızın sosyal medyada güçlü, tutarlı ve dikkat çekici bir iletişim kurmasını sağlıyoruz.
  tagline: |-
    Instagram, Facebook, TikTok ve LinkedIn için markanıza özel içerik stratejileri geliştiriyoruz.
  whatsappMessage: |-
    Merhaba Pixelon, Sosyal Medya Yönetimi hizmeti hakkında bilgi almak istiyorum.

intro:
  eyebrow: Sadece Görünür Olmak Yetmez
  heading: Markanızın Hatırlanmasını ve Tercih Edilmesini Sağlıyoruz
  body: |-
    Sosyal medya, markanızın hedef kitlesiyle doğrudan iletişim kurduğu en güçlü alanlardan biridir. Ancak yalnızca düzenli paylaşım yapmak, güçlü bir marka algısı oluşturmak için yeterli değildir.

    Pixelon olarak markanızın hedeflerini, sektörünü ve hedef kitlesini analiz ediyor; içeriklerinizi tek tek paylaşımlar olarak değil, bütüncül bir iletişim stratejisinin parçaları olarak planlıyoruz. Markanızın görsel dilinden içerik tonuna, video kurgularından paylaşım takvimine kadar tüm süreci profesyonel biçimde yönetiyoruz.
  highlight: |-
    Amacımız yalnızca takipçi kazanmak değil, markanızla gerçek bağ kuran bir topluluk oluşturmaktır.

why:
  eyebrow: Neden Pixelon?
  heading: İçerik Üreten Değil, Markanızı Yöneten Bir Ekip
  lead: |-
    Sosyal medya yönetimini yalnızca tasarım hazırlamak ve paylaşım yapmak olarak görmüyoruz. Her içeriğin markanızın iletişim hedeflerine, hedef kitlesine ve büyüme stratejisine hizmet etmesini sağlıyoruz.
  items:
    - title: Markaya Özel Strateji
      description: |-
        Hazır içerik kalıpları yerine sektörünüze ve markanıza özel bir iletişim planı hazırlıyoruz.
    - title: Tasarım ve Video Tek Ekipte
      description: |-
        Grafik tasarım, metin, fotoğraf, video çekimi ve kurgu süreçlerini bütüncül biçimde yönetiyoruz.
    - title: Düzenli ve Tutarlı İletişim
      description: |-
        Markanızın sosyal medyada kopuk değil, planlı ve güçlü bir iletişim kurmasını sağlıyoruz.
    - title: Ölçülebilir Gelişim
      description: |-
        İçerik performansını düzenli olarak analiz ediyor ve sonuçlara göre stratejiyi geliştiriyoruz.

scope:
  eyebrow: Sosyal Medya Yönetimi Kapsamımız
  heading: Stratejiden Paylaşıma Tüm Süreç Tek Ekipte
  items:
    - title: Sosyal Medya Stratejisi
      description: |-
        Markanızın hedeflerini, rakiplerini, hedef kitlesini ve içerik fırsatlarını analiz ederek sosyal medya yol haritasını oluşturuyoruz.
    - title: İçerik Planlaması
      description: |-
        Aylık içerik takvimi, paylaşım konuları, kampanya dönemleri ve özel günleri markanızın iletişim hedeflerine göre planlıyoruz.
    - title: Grafik Tasarım
      description: |-
        Markanızın kurumsal kimliğine uygun, özgün ve dikkat çekici gönderi, carousel, hikâye ve kampanya tasarımları hazırlıyoruz.
    - title: Reels ve Video İçerikleri
      description: |-
        Sosyal medya trendlerine ve kullanıcı davranışlarına uygun kısa video fikirleri geliştiriyor, çekim ve kurgu süreçlerini yönetiyoruz.
    - title: Metin Yazarlığı
      description: |-
        Markanızın iletişim tonuna uygun, bilgilendirici, ilgi çekici ve harekete geçirici paylaşım metinleri yazıyoruz.
    - title: Hikâye Yönetimi
      description: |-
        Markanızın günlük iletişimini canlı tutan, etkileşim oluşturan ve takipçileri aksiyona yönlendiren hikâye içerikleri üretiyoruz.
    - title: Topluluk Yönetimi
      description: |-
        Yorumları, mesajları ve kullanıcı etkileşimlerini markanızın iletişim diline uygun biçimde yönetiyoruz.
    - title: Raporlama ve Optimizasyon
      description: |-
        Erişim, etkileşim, takipçi gelişimi ve içerik performansını analiz ederek sonraki içerik planlarını geliştiriyoruz.

platforms:
  eyebrow: Platform Deneyimimiz
  heading: Her Platforma Uygun İçerik, Tek Bir Marka Dili
  items:
    - title: Instagram
      description: |-
        Reels, gönderi, carousel ve hikâye içerikleriyle markanızın görsel gücünü ve etkileşimini artırıyoruz.
    - title: Facebook
      description: |-
        Marka iletişimi, kampanya duyuruları ve hedef kitleye uygun içeriklerle kurumsal görünürlüğünüzü destekliyoruz.
    - title: TikTok
      description: |-
        Platformun doğal diline uygun, samimi, hızlı ve paylaşılabilir video içerikleri hazırlıyoruz.
    - title: LinkedIn
      description: |-
        Kurumsal kimliğinizi, uzmanlığınızı, ekip kültürünüzü ve sektörel deneyiminizi profesyonel içeriklerle anlatıyoruz.
    - title: YouTube
      description: |-
        Kısa ve uzun formatlı video içerikleri, kurumsal filmler ve bilgilendirici seriler için içerik planları oluşturuyoruz.

process:
  eyebrow: Adım Adım
  heading: Markanızı Tanıyor, Planlıyor ve Sürekli Geliştiriyoruz
  steps:
    - title: Keşif ve Analiz
      description: |-
        Markanızı, hedeflerinizi, mevcut hesaplarınızı, rakiplerinizi ve hedef kitlenizi inceliyoruz.
    - title: Strateji ve İçerik Planı
      description: |-
        Aylık iletişim konularını, içerik türlerini ve yayın takvimini oluşturuyoruz.
    - title: İçerik Üretimi
      description: |-
        Tasarım, metin, fotoğraf, video ve Reels çalışmalarını markanızın kimliğine uygun biçimde hazırlıyoruz.
    - title: Onay ve Yayınlama
      description: |-
        İçerikleri onayınıza sunuyor, belirlenen gün ve saatlerde yayınlıyoruz.
    - title: Takip ve Raporlama
      description: |-
        İçerik performansını analiz ediyor, sonuçlara göre stratejiyi sürekli geliştiriyoruz.

projects:
  eyebrow: Başarıyla Tamamladığımız Projeler
  heading: Markalara Sosyal Medyada Güçlü Bir Kimlik Kazandırdık
  lead: |-
    Yaratıcı içerikler, stratejik planlama ve markaya özel görsel dille farklı sektörlerdeki işletmelerin sosyal medya iletişimine değer kattık. Siz de markanızı bu projeler arasına eklemek için bizimle iletişime geçin.
  items:
    - eyebrow: Sağlık Turizmi Sosyal Medya Yönetimi
      title: Dentasay
      description: |-
        Tedavi bilgilendirmeleri, hasta deneyimleri, klinik tanıtımları ve uluslararası hedef kitlelere yönelik çok dilli sosyal medya içerikleri hazırladık.
    - eyebrow: Dermatoloji İçerik Stratejisi
      title: Dr. Ayşe Cinkaya Kahveci
      description: |-
        Dermatoloji ve estetik uygulamaları doğru, güvenilir ve anlaşılır bir iletişim diliyle anlatan içerik serileri oluşturduk.
    - eyebrow: Topluluk Odaklı Sosyal Medya İletişimi
      title: Anneliğin Hikâyesi
      description: |-
        Anne ve kadın odaklı hedef kitle için samimi, dikkat çekici ve etkileşim yaratan sosyal medya içerikleri hazırladık.
    - eyebrow: Kurumsal Sosyal Medya Yönetimi
      title: Xray Groupe
      description: |-
        Mimarlık, mühendislik ve inşaat projelerini kurumsal bir görsel dille sunan, marka güvenini destekleyen içerikler geliştirdik.

value:
  eyebrow: Format Çeşitliliği
  heading: Markanızı Tek Bir İçerik Formatına Sıkıştırmıyoruz
  lead: |-
    Markanızın hedeflerine ve platformların dinamiklerine göre farklı içerik formatlarını birlikte kullanıyoruz.
  bullets:
    - Reels ve kısa videolar
    - Kurumsal gönderiler
    - Carousel bilgi içerikleri
    - Kampanya ve duyuru tasarımları
    - Ürün ve hizmet tanıtımları
    - Soru-cevap içerikleri
    - Eğitici ve bilgilendirici paylaşımlar
    - Müşteri deneyimleri
    - Ekip ve marka hikâyeleri
    - Hikâye serileri ve anketler

sectors:
  eyebrow: Sektör Deneyimimiz
  heading: Hangi Sektörlerle Çalışıyoruz?
  body: |-
    Sağlık ve klinik markaları, sağlık turizmi firmaları, e-ticaret işletmeleri, inşaat ve gayrimenkul şirketleri ile hizmet sektöründeki KOBİ ve kurumsal markalar için sosyal medya yönetimi hizmeti sunuyoruz. Her sektörün iletişim dilini, kullanıcı davranışlarını ve içerik ihtiyaçlarını ayrı ayrı değerlendiriyoruz.

cta:
  eyebrow: Markanızı Sosyal Medyada Birlikte Büyütelim
  heading: Daha Güçlü Bir Sosyal Medya İletişimine Hazır mısınız?
  lead: |-
    Sosyal medya hesaplarınızı profesyonel biçimde yönetmek, daha etkili içerikler üretmek ve hedef kitlenizle güçlü bir bağ kurmak için Pixelon ekibiyle iletişime geçin. Markanızı dinleyelim ve size özel sosyal medya yönetim planımızı hazırlayalım.

faq:
  eyebrow: Merak Edilenler
  heading: Sosyal Medya Yönetimi Hakkında Sıkça Sorulan Sorular
  items:
    - question: Sosyal medya yönetimi hizmetine neler dahildir?
      answer: |-
        Hizmet kapsamına strateji, içerik takvimi, grafik tasarım, metin yazarlığı, Reels ve video üretimi, yayınlama, topluluk yönetimi ve raporlama dâhil edilebilir.
    - question: Ayda kaç paylaşım hazırlanıyor?
      answer: |-
        Paylaşım sayısı markanın ihtiyaçlarına ve seçilen hizmet paketine göre belirlenir. İçerik planı gönderi, Reels ve hikâye formatlarını kapsayabilir.
    - question: Fotoğraf ve video çekimi yapıyor musunuz?
      answer: |-
        Evet. İhtiyaca göre ürün, ekip, klinik, ofis ve hizmet çekimleri ile Reels prodüksiyonları planlayabiliyoruz.
    - question: İçerikler paylaşılmadan önce onaya sunuluyor mu?
      answer: |-
        Evet. Hazırlanan içerikler yayınlanmadan önce markanın onayına sunulur.
    - question: Reklam yönetimi sosyal medya hizmetine dâhil mi?
      answer: |-
        Organik sosyal medya yönetimi ile Meta reklam yönetimi ayrı hizmetlerdir. İhtiyaca göre iki hizmet birlikte planlanabilir.
