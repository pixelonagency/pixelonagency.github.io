cta:
  eyebrow: Markanızı Sosyal Medyada Birlikte Büyütelim
  heading: Daha Güçlü Bir Sosyal Medya İletişimine Hazır mısınız?
  lead: |-
    Sosyal medya hesaplarınızı profesyonel biçimde yönetmek, daha etkili içerikler üretmek ve hedef kitlenizle güçlü bir bağ kurmak için Pixelon ekibiyle iletişime geçin. Markanızı dinleyelim ve size özel sosyal medya yönetim planımızı hazırlayalım.

faq:
  eyebrow: Merak Edilenler
  heading: Sosyal Medya Yönetimi Hakkında Sıkça Sorulan Sorular
  items:
    - question: Sosyal medya yönetimi hizmetine neler dahildir?
      answer: |-
        Hizmet kapsamına strateji, içerik takvimi, grafik tasarım, metin yazarlığı, Reels ve video üretimi, yayınlama, topluluk yönetimi ve raporlama dâhil edilebilir.
    - question: Ayda kaç paylaşım hazırlanıyor?
      answer: |-
        Paylaşım sayısı markanın ihtiyaçlarına ve seçilen hizmet paketine göre belirlenir. İçerik planı gönderi, Reels ve hikâye formatlarını kapsayabilir.
    - question: Fotoğraf ve video çekimi yapıyor musunuz?
      answer: |-
        Evet. İhtiyaca göre ürün, ekip, klinik, ofis ve hizmet çekimleri ile Reels prodüksiyonları planlayabiliyoruz.
    - question: İçerikler paylaşılmadan önce onaya sunuluyor mu?
      answer: |-
        Evet. Hazırlanan içerikler yayınlanmadan önce markanın onayına sunulur.
    - question: Reklam yönetimi sosyal medya hizmetine dâhil mi?
      answer: |-
        Organik sosyal medya yönetimi ile Meta reklam yönetimi ayrı hizmetlerdir. İhtiyaca göre iki hizmet birlikte planlanabilir.
