faq:
  eyebrow: Frequently Asked
  heading: Frequently Asked Questions About Digital Advertising Management
  items:
    - question: What is included in the digital advertising management service?
      answer: |-
        The service can cover audience analysis, campaign strategy, campaign setup, ad copy and design, conversion tracking, optimization and reporting.
    - question: Is the advertising budget included in the service fee?
      answer: |-
        No. The media budget paid to the advertising platforms and the Pixelon advertising management fee are planned separately.
    - question: How much advertising budget should we set aside?
      answer: |-
        The right budget depends on your sector, the region you target, the level of competition and your campaign objectives. After the initial analysis we present a budget recommendation suited to you.
    - question: When will we see results from the ads?
      answer: |-
        The time to results varies by sector, offer, budget, audience and platform. During the early stage of a campaign we gather data, run tests and improve performance through regular optimization.
    - question: Does Pixelon produce the ad creatives?
      answer: |-
        Yes. Depending on the scope of the service, ad copy, static designs, animated visuals and short video content can all be produced by Pixelon.
    - question: Can Google Ads and Meta Ads be managed together?
      answer: |-
        Yes. Depending on the brand's objectives, Google, Instagram and Facebook advertising can be planned together so that each channel supports the others.
