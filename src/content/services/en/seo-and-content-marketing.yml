why:
  eyebrow: "Why Pixelon?"
  heading: "We Aim for More Than Visibility"
  lead: "We do not see SEO as simply ranking higher for a handful of keywords. Our goal is to connect your brand with the right users, earn qualified organic traffic and turn that traffic into inquiries, appointments or sales."
  items:
    - title: "Google-Focused SEO Strategies"
      description: "We build a sustainable SEO roadmap tailored to your industry, your target audience and your level of competition."
    - title: "SEO-Friendly Content Production"
      description: "We create original, informative content that answers users' search intent and stays true to your brand voice."
    - title: "Keyword Research"
      description: "We analyse which keywords, questions and services your audience searches for and identify the content opportunities behind them."
    - title: "Technical SEO Optimization"
      description: "We review site speed, mobile compatibility, indexing, URL structure and technical errors to improve your search engine performance."
    - title: "Authority and Backlink Strategy"
      description: "We work on trustworthy, natural link opportunities that strengthen your brand's digital authority."
    - title: "Regular Reporting"
      description: "We analyse and report organic traffic, rankings, user behaviour and conversions on a regular basis."
scope:
  eyebrow: "Service Scope"
  heading: "End-to-End SEO Solutions for Organic Growth"
  items:
    - title: "SEO Audit and Roadmap"
      description: "We analyse your current website in terms of technical structure, content, rankings and competitors."
    - title: "Technical SEO"
      description: "We handle crawling and indexing issues, site speed, mobile compatibility, redirects and structured data work."
    - title: "Keyword Research"
      description: "We identify the keywords that match your services, your products and the search behaviour of your audience."
    - title: "On-Page SEO"
      description: "We optimize page titles, meta descriptions, heading structure, URLs, internal links and images."
    - title: "SEO-Friendly Content Production"
      description: "We produce service pages, category descriptions, blog posts and landing page content."
    - title: "Content Strategy"
      description: "We build a content calendar that defines which topics are covered, in which format and on which publishing schedule."
    - title: "Local SEO"
      description: "We help you become more visible in local searches in Istanbul, Kadıköy or any other area you serve."
    - title: "Competitor Analysis"
      description: "We examine the keywords your competitors rank for, their content structures and the growth opportunities they leave open."
    - title: "Performance Tracking"
      description: "We follow the results through Google Search Console, Analytics and other measurement tools and refine the strategy accordingly."
