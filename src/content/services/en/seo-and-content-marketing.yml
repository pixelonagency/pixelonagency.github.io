sectors:
  eyebrow: "Our Industry Experience"
  heading: "Which Industries Do We Work With?"
  body: "We provide SEO and content marketing services for healthcare and clinic brands, health tourism companies, e-commerce businesses, construction and real estate firms, and for SMEs and corporate brands in the service sector. We assess the search behaviour, competition level and customer decision journey of each industry with a strategy of its own."
cta:
  eyebrow: "Let's Bring Your Brand Forward on Google Together"
  heading: "Ready for More Organic Traffic and Qualified Demand?"
  lead: "Get in touch with the Pixelon team to improve your website's Google performance, make your services visible in the right searches and achieve sustainable organic growth. Let's analyse where you stand today and build an SEO roadmap tailored to your brand."
faq:
  eyebrow: "Frequently Asked"
  heading: "Frequently Asked Questions About SEO and Content Marketing"
  items:
    - question: "How long does it take for SEO to deliver results?"
      answer: "SEO is a long-term effort. The first improvements vary depending on the technical condition of the site, the level of competition in your industry and the scope of the content. With consistent work and optimization, results get stronger over time."
    - question: "Is content production included in the SEO service?"
      answer: "Depending on the scope of the service, service page content, blog posts, category descriptions and landing page copy can be prepared."
    - question: "Do you guarantee the number one position on Google?"
      answer: "Because search results depend on Google's algorithms and competitive conditions, guaranteeing a specific position would not be honest. Our goal is sustainable visibility, qualified traffic and measurable progress."
    - question: "Can SEO be done for our existing website?"
      answer: "Yes. We first analyse the current site in technical and content terms, then prepare an improvement plan."
    - question: "What data is included in SEO reports?"
      answer: "Organic traffic, keyword rankings, impressions, clicks, user behaviour, technical issues and conversion data can all be reported."
