seo:
  title: E-Commerce Website and Digital Sales Solutions | Pixelon
  description: >-
    Grow your brand online with a sales-driven e-commerce website, strong user
    experience and payment and shipping integrations. Discover Pixelon
    e-commerce solutions.

hero:
  eyebrow: E-Commerce Solutions
  headingLines:
    - "We Don't Just Display Your Products Online, We Turn Them Into *Sales*."
  lead: >-
    With design made for your brand, a strong user experience and infrastructure
    that is easy to manage, we build e-commerce websites that turn visitors into
    customers.
  tagline: >-
    From product management to payment and shipping integrations, we plan the
    entire e-commerce process from a single place.
  whatsappMessage: Hello Pixelon, I would like to get information about your E-Commerce Solutions service.

why:
  eyebrow: Why Pixelon?
  heading: We Handle E-Commerce as Design, Technology and Marketing Together.
  lead: >-
    We do not consider it enough for your e-commerce website to simply work on a
    technical level. We build a sales system that tells your brand story
    correctly, earns the trust of users and supports your digital marketing
    efforts.
  items:
    - title: Design Made for Your Brand
      description: >-
        We design your store to match your brand identity, not with standard
        templates that look like your competitors.
    - title: Easy Management
      description: >-
        We provide a panel where you can easily manage products, stock, orders,
        customers and campaigns.
    - title: Sales-Driven User Experience
      description: >-
        We make the journey of discovering and purchasing a product as easy as
        possible for users.
    - title: SEO and Advertising Alignment
      description: >-
        We plan your e-commerce website so that it works in harmony with Google,
        Meta and other digital marketing channels.
    - title: Infrastructure Ready to Grow
      description: >-
        We build scalable systems that can be developed further as your product
        and order volume grows.

scope:
  eyebrow: Our E-Commerce Services
  heading: Scalable Sales Solutions That Fit Your Needs
  items:
    - title: Brand-Specific E-Commerce Design
      description: >-
        Without relying on ready-made templates, we create original store
        experiences that reflect the visual identity of your brand.
    - title: E-Commerce Infrastructure Setup
      description: >-
        We set up infrastructures where you can easily manage your products,
        orders, customers and campaigns.
    - title: Product and Category Structure
      description: >-
        We design category, filtering, search and product detail pages that make
        products easy to discover.
    - title: Payment System Integrations
      description: >-
        We make sure credit cards, debit cards, bank transfers and other
        suitable payment methods can be used securely.
    - title: Shipping and Logistics Integrations
      description: >-
        We carry out shipping company and tracking system integrations that
        simplify order and delivery processes.
    - title: Marketplace Integrations
      description: >-
        Where needed, we align your product, stock and order processes with
        marketplaces.
    - title: Multi-Language and Multi-Currency Structure
      description: >-
        For brands that want to sell abroad, we build systems that support
        multiple languages and different currencies.
    - title: E-Commerce SEO Infrastructure
      description: >-
        We plan category, product and content pages within a technical structure
        suited to search engines.

principles:
  eyebrow: What Do We Focus On in an E-Commerce Website?
  heading: We Plan Every Detail, From User Experience to After-Sales.
  items:
    - title: Mobile-First Design
      description: >-
        We prepare screens that let your customers shop quickly and easily from
        their phones.
    - title: Fast Product Discovery
      description: >-
        With search, filtering, categories and product recommendations, we help
        users reach the right product easily.
    - title: A Structure That Builds Trust
      description: >-
        We position trust elements such as payment, delivery, returns, contact
        and user reviews at the right points.
    - title: Easy Purchase Process
      description: >-
        By simplifying cart and checkout steps, we aim for users to complete
        their transactions quickly.
    - title: Campaign Management
      description: >-
        We set up a system where you can easily manage discounts, coupons, free
        shipping, bundles and seasonal campaigns.
    - title: Reporting and Tracking
      description: >-
        We build measurement infrastructures that let you track sales, order,
        product and user performance.

process:
  eyebrow: How Does Our E-Commerce Process Work?
  heading: We Are With You From the First Idea to the First Order.
  steps:
    - title: Discovery and Analysis
      description: >-
        We examine your products, target audience, sales model and current
        operational process.
    - title: Site Architecture and Strategy
      description: >-
        We plan the category structure, product pages, user flows and the
        integrations that will be needed.
    - title: UX/UI Design
      description: >-
        We design store screens that are made for your brand, mobile friendly
        and focused on sales.
    - title: Development and Integration
      description: >-
        We connect payment, shipping, stock, marketplace and any other required
        systems to the project.
    - title: Product Entry and Testing
      description: >-
        We add the products to the system and test order, payment, e-mail and
        user flows.
    - title: Launch and Support
      description: >-
        We take the store live and support the maintenance and development work
        that follows.

