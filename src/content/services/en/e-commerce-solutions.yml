sectors:
  eyebrow: Your Digital Store Is Your Brand's Strongest Point of Sale
  heading: >-
    We Design Experiences Where Users Explore With Confidence and Shop With
    Ease.
  body: |-
    A successful e-commerce website is not only a platform where products are listed. Users need to find the product easily, review its details, trust the brand and complete the payment without any trouble.

    At Pixelon, we approach e-commerce projects as a whole, covering design, development, user experience, SEO and digital marketing. We build a mobile friendly e-commerce system that can grow over time and fits your brand's product structure, target audience and sales model.

    We do not just launch an online store, we design the digital sales system of your brand.

cta:
  eyebrow: Let's Grow Your Digital Store Together
  heading: Ready for a Stronger E-Commerce Experience?
  lead: >-
    Get in touch with the Pixelon team to launch a new e-commerce website, renew
    your current store or make your sales processes more efficient. Let's
    analyse your products, target audience and sales goals, and build the
    e-commerce roadmap for your brand together.

faq:
  eyebrow: Frequently Asked
  heading: Frequently Asked Questions About E-Commerce Solutions
  items:
    - question: What is included in the e-commerce website service?
      answer: >-
        Depending on the scope of the project, design, development, product and
        category structure, payment, shipping, stock, order, campaign and
        reporting systems can be included.
    - question: Can we manage the e-commerce website ourselves?
      answer: >-
        Yes. A user friendly admin panel is prepared where you can manage
        products, prices, stock, orders, campaigns and content.
    - question: Which payment systems can be integrated?
      answer: >-
        Depending on your needs, suitable virtual POS and payment systems used
        in Turkey and in your target markets can be integrated.
    - question: Do you provide marketplace integration?
      answer: >-
        Depending on the needs of the project, product, stock and order data can
        be integrated to work with marketplaces.
    - question: Will the e-commerce website be mobile friendly?
      answer: >-
        Yes. All pages and purchase steps are optimised for phone, tablet and
        desktop devices.
    - question: Do you offer product photography and content support?
      answer: >-
        Yes. Product photography, promotional video, product descriptions and
        SEO friendly category content can be planned separately.
