intro:
  eyebrow: "In Health Tourism, Advertising Alone Is Not Enough"
  heading: "We Build a Trusted Brand and a Seamless Patient Experience."
  body: |-
    International patients do not decide on treatment based on price alone. They look at the whole picture: the clinic's credibility, the doctor's experience, patient reviews, how quickly you respond, accommodation and transfer arrangements.

    At Pixelon, we do not treat health tourism as ad management on its own. We analyze every touchpoint, from how your brand appears online to how your patient advisors communicate. With content tailored to each target country, a multilingual digital infrastructure and conversion-focused campaigns, we set out to generate higher quality patient inquiries.
  highlight: "Our goal is not simply to bring in more messages, but to generate patient inquiries with a real potential to turn into treatment."
why:
  eyebrow: "Why Pixelon?"
  heading: "We Bring Together Health Communication, Marketing, Technology and Operations."
  lead: "In health tourism, running an ad campaign is not enough on its own. How quickly you follow up, how much trust your website inspires and how carefully patient inquiries are tracked have a direct impact on results."
  items:
    - title: "Healthcare Sector Experience"
      description: "We take patient behavior, trust factors and the sensitivities of health communication into account."
    - title: "Multilingual Production"
      description: "We do more than translate content: we shape it around the culture and expectations of each target country."
    - title: "Advertising and CRM Integration"
      description: "We build digital processes that make sure inquiries coming from your ads are tracked and never lost."
    - title: "Conversion-Focused Approach"
      description: "Beyond impressions and clicks, we focus on outcomes such as WhatsApp messages, forms, pre-assessments and treatment inquiries."
    - title: "Transparent Reporting"
      description: "We share performance by country, treatment and campaign in clear, easy-to-read reports."
