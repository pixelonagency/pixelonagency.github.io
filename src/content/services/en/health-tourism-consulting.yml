faq:
  eyebrow: "Frequently Asked"
  heading: "Frequently Asked Questions About Health Tourism Consulting"
  items:
    - question: "What is included in the health tourism consulting service?"
      answer: "Depending on the scope of the project, it can include market analysis, a multilingual website, ad management, content production, landing pages, CRM, patient communication templates and performance reporting."
    - question: "Which countries do you run advertising campaigns in?"
      answer: "In line with the clinic's services and goals, campaigns can be planned for Europe, the United Kingdom, the Middle East and African countries."
    - question: "Do you produce content in different languages?"
      answer: "Yes. Website, advertising, social media and patient communication content can be prepared in different languages to suit the target market."
    - question: "Does Pixelon respond to incoming patient inquiries?"
      answer: "Depending on the scope of the service, we can provide your patient advisors with communication templates, follow-up flows and CRM infrastructure. The operational communication model is defined together with the clinic."
    - question: "How soon do health tourism ads deliver results?"
      answer: "Results vary depending on the target country, the treatment, the budget, the competition, the offer and the performance of your patient advisors. Campaigns are improved regularly as data comes in."
    - question: "Can our existing ads be analyzed?"
      answer: "Yes. We can review your ad accounts, website, landing pages, conversion tracking and patient follow-up process, and prepare an improvement roadmap."
