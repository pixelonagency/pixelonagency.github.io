faq:
  eyebrow: Frequently Asked
  heading: Frequently Asked Questions About Web Design
  items:
    - question: How long does it take to design a website?
      answer: >-
        It depends on the number of pages, the scope of the content, the
        language options and any custom development needs. Corporate website
        projects usually consist of planning, design, development and testing
        stages.
    - question: Can we manage the website ourselves afterwards?
      answer: >-
        Yes. Your website comes with a user-friendly admin panel where you can
        edit content, services, projects and blog posts.
    - question: Will the website be mobile-friendly?
      answer: >-
        Yes. Every website is designed and tested to work smoothly on phones,
        tablets and desktop devices.
    - question: Is SEO work included in the web design service?
      answer: >-
        Every website is built on a solid technical SEO foundation.
        Comprehensive keyword research, content production and ongoing SEO work
        can be offered as a separate service plan.
    - question: Do you build multilingual websites?
      answer: >-
        Yes. We create multilingual website infrastructures suited to the
        countries and languages you want to target.
