intro:
  eyebrow: First Impression
  heading: We Build the Strongest Face of Your Brand in the Digital World
  body: |-
    Your website is often the first contact your customers have with your brand. That is why it must do more than look good: it has to tell your story accurately, build trust and move visitors to take action.

    At Pixelon, we approach web design as a whole, combining aesthetics, user experience, technology, speed and SEO infrastructure. With websites designed specifically for your brand, we create a strong and professional presence in the digital world.

    We do not simply design websites. We build a digital sales and communication space that works for your brand.

scope:
  eyebrow: Our Web Design Services
  heading: Web Solutions Tailored to Your Needs and Your Brand
  items:
    - title: Corporate Website
      description: >-
        We design manageable websites that present your services, corporate
        structure and expertise in a professional way.
    - title: E-Commerce Website
      description: >-
        We build sales-driven e-commerce platforms that showcase your products
        beautifully and make shopping effortless for your customers.
    - title: Landing Page Design
      description: >-
        We create dedicated landing pages that guide traffic from Google and
        Meta ad campaigns into quote requests, calls, WhatsApp messages or form
        submissions.
    - title: Multilingual Website
      description: >-
        We develop multilingual, SEO-compatible and easy-to-manage websites so
        you can reach audiences in different countries and markets.
    - title: Healthcare and Clinic Websites
      description: >-
        For clinics, doctors and health tourism brands, we design websites that
        build trust, explain treatments clearly and collect appointment
        requests.
    - title: Custom Web Software
      description: >-
        When off-the-shelf systems fall short, we develop custom dashboards,
        forms, booking, membership and integration solutions built around your
