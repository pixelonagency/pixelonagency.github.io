why:
  eyebrow: Our Standards
  heading: Beyond Looking Good, an Experience That Delivers Results
  items:
    - title: Brand-Specific Design
      description: >-
        Instead of ready-made templates, we design original interfaces that fit
        your brand identity, your industry and your target audience.
    - title: Mobile Compatibility
      description: >-
        We make sure your website looks flawless on phones, tablets and desktop
        devices.
    - title: Speed and Performance
      description: >-
        By improving page load times, we support both the user experience and
        your search engine performance.
    - title: SEO Infrastructure
      description: >-
        We prepare heading structures, URL layout, meta fields, image
        optimization and technical foundations in line with SEO standards.
    - title: Conversion-Focused Structure
      description: >-
        We place actions such as WhatsApp, phone, quote requests and contact
        forms at the right points to help you receive more enquiries.
    - title: Manageable Admin Panel
      description: >-
        We build a panel where you can easily manage your content, services,
        projects, blog posts and incoming contact requests.

process:
  eyebrow: Step by Step
  heading: A Planned and Transparent Process From Idea to Launch
  steps:
    - title: Discovery and Needs Analysis
      description: >-
        We get to know your brand, your target audience, your competitors and
        what you expect from your website.
    - title: Content and Site Architecture
      description: >-
        We plan the pages, the user journey, the content headings and the
        navigation paths.
    - title: UX/UI Design
      description: >-
        We design desktop and mobile interfaces that match your brand's visual
        identity.
    - title: Development and Engineering
      description: >-
        We turn the approved design into a fast, secure, manageable and
        mobile-friendly website.
    - title: Testing and Launch
      description: >-
        We check forms, links, page speed, different devices and SEO settings
        before taking the site live.
    - title: Support and Improvement
      description: >-
        After launch, we support your brand with the updates, maintenance and
        improvements you need.

