faq:
  eyebrow: Frequently Asked
  heading: Frequently Asked Questions About Video and Production
  items:
    - question: What is included in a video production service?
      answer: |-
        Depending on the scope of the project, the service can include concept, script, shooting plan, equipment, production, editing, colour grading, sound design, subtitles and delivery.
    - question: Can photo and video shoots be done together?
      answer: |-
        Yes. Both photo and video content can be produced on the same shooting day. This creates a wider content archive that can be used across different platforms.
    - question: Where do the shoots take place?
      answer: |-
        Shoots can take place at your office, clinic, store or factory, outdoors, or in rented studios suited to the project.
    - question: Do you also develop the ideas for Reels videos?
      answer: |-
        Yes. Content topics, video hooks, scripts, scene plans and shooting ideas can all be prepared by Pixelon.
    - question: Are videos delivered in different formats?
      answer: |-
        Yes. Videos can be delivered in vertical, horizontal and square formats as needed, ready for Instagram, TikTok, YouTube, websites and advertising platforms.
    - question: Do you offer drone footage?
      answer: |-
        Drone footage can be planned when the location, weather conditions and legal permissions allow it.
