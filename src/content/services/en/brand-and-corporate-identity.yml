seo:
  title: Brand and Corporate Identity Design | Pixelon
  description: >-
    Give your brand a distinctive, strong and consistent corporate identity with
    a logo, color palette, typography, brand voice and corporate materials.

hero:
  eyebrow: Brand and Corporate Identity
  headingLines:
    - "We Make Your Brand Not Just Visible, But *Unforgettable*."
  lead: |-
    We build an original visual identity that reflects your brand's character, values and goals, then make sure it looks consistent and strong across every communication channel.
  tagline: |-
    From logo design to a complete corporate identity system, we develop holistic solutions that set your brand apart from its competitors.
  whatsappMessage: |-
    Hello Pixelon, I would like to get information about your Brand and Corporate Identity service.

why:
  eyebrow: Why Pixelon?
  heading: We Design Your Entire Brand, Not Just Your Logo.
  lead: |-
    We do not treat brand design as a standalone logo exercise. Strategy, visual language, tone of communication and every area of application are handled as one system in which each part supports the others.
  items:
    - title: We Start With Strategy
      description: |-
        Every design decision is made in line with your brand's goals and positioning.
    - title: We Create Brand Specific Work
      description: |-
        Instead of stock symbols and off the shelf solutions, we develop original design ideas.
    - title: We Consider Every Touchpoint
      description: |-
        We plan together how the identity will look on your website, social media, advertising, print and packaging.
    - title: We Deliver a System You Can Apply
      description: |-
        We prepare a clear brand guideline so different teams and suppliers can use your corporate identity correctly.

scope:
  eyebrow: Our Brand and Corporate Identity Services
  heading: The Complete Visual System Your Brand Needs
  items:
    - title: Brand Strategy
      description: |-
        We define your brand's positioning, target audience, points of difference from competitors and core communication approach.
    - title: Brand Name and Slogan
      description: |-
        For new brands we create memorable name alternatives, brand messaging and strong slogan options.
    - title: Logo Design
      description: |-
        We design original, easy to remember logo systems that reflect your brand's character and adapt to every area of use.
    - title: Color Palette and Typography
      description: |-
        We define the colors, typefaces and visual style that match the feeling your brand wants to convey and its position in the sector.
    - title: Corporate Identity Guideline
      description: |-
        We prepare a comprehensive brand guideline covering logo usage, color codes, typography, visual language and application rules.
    - title: Corporate Materials
      description: |-
        We design business cards, letterheads, envelopes, folders, proposal templates, presentations, email signatures and other corporate documents.
    - title: Social Media Visual System
      description: |-
        We create post, story, Reels cover and campaign templates that keep your brand consistent across its social media accounts.
    - title: Packaging and Product Design
      description: |-
        We prepare packaging, label and product presentation designs that make your product stand out both on the shelf and online.

principles:
  eyebrow: What Matters to Us in Corporate Identity Design?
  heading: Meaning Before Aesthetics, Consistency After Design
  items:
    - title: Originality
      description: |-
        We create a visual world that belongs to your brand rather than one that resembles your competitors.
    - title: Memorability
      description: |-
        We develop simple, strong design systems that stay recognizable across every area of use.
    - title: Consistency
      description: |-
        We make sure the same brand perception is preserved on your website, social media, printed materials and advertising work.
    - title: Usability
      description: |-
        We prepare your logo and identity elements so they work flawlessly at every size and format, from digital to print.
    - title: Future Readiness
      description: |-
        We design a timeless identity that does not depend on passing trends and can evolve as your brand grows.

process:
  eyebrow: Our Brand Design Process
  heading: We Get to Know Your Brand and Turn Its Story Into Design.
  steps:
    - title: Discovery and Brief
      description: |-
        We learn your brand's story, values, target audience and future goals.
    - title: Research and Positioning
      description: |-
        We analyse the sector, the competitors and the visual communication opportunities to set the creative direction.
    - title: Concept Development
      description: |-
        We prepare logo ideas, color directions, typography and visual concepts that suit the brand.
    - title: Design and Revision
      description: |-
        We develop the chosen direction and finalize the brand identity together with your feedback.
    - title: Corporate Applications
      description: |-
        We apply the approved identity to business cards, social media, presentations, packaging and other materials.
    - title: Delivery and Brand Guideline
      description: |-
        We deliver all logo formats, color codes, font details and usage rules in a clear, organized package.

