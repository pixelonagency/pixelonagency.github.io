cta:
  eyebrow: Let's Create Your Brand's New Identity Together
  heading: Is Your Brand Ready to Reflect Its Real Potential?
  lead: |-
    Get in touch with the Pixelon team to create a new brand, refresh your current logo or make your entire corporate communication stronger and more consistent. Let us listen to your brand, understand its story and design an original identity that sets you apart from your competitors.

faq:
  eyebrow: Frequently Asked
  heading: Frequently Asked Questions About Brand and Corporate Identity
  items:
    - question: What is included in a corporate identity project?
      answer: |-
        Depending on the scope of the project, it can include the logo, color palette, typography, business cards, letterhead, email signature, social media templates and a brand usage guideline.
    - question: Can we order logo design only?
      answer: |-
        Yes. Logo design can be done on its own. Still, we recommend creating a basic corporate identity system so the brand is used consistently across different areas.
    - question: How long does the logo design process take?
      answer: |-
        The timeline depends on the research, the number of concepts, the feedback rounds and the scope of the corporate applications. The project schedule is agreed before work begins.
    - question: In which formats are the logo files delivered?
      answer: |-
        The logo is delivered in vector and image formats suitable for both print and digital use. Color, black, white and any other required versions are prepared.
    - question: Can our existing brand identity be refreshed?
      answer: |-
        Yes. A rebranding project can update the logo, color system, typography and tone of communication without losing your existing brand recognition.
