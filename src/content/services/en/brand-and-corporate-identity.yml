value:
  eyebrow: Strong Brands Do Not Happen by Chance
  heading: We Turn Who Your Brand Is Into a Visual Language.
  lead: |-
    A brand identity is far more than a logo. From colors to typography, from the imagery used to the tone of communication, every detail shapes how your customers feel about your brand.
  bullets:
    - |-
      At Pixelon we analyse your brand's story, target audience, sector and future goals, then design a corporate identity system that creates the same sense of trust and quality at every touchpoint.
    - |-
      A good brand identity does not only look beautiful; it introduces your brand, sets it apart and makes it memorable.

