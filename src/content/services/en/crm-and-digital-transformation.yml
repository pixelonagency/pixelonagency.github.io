faq:
  eyebrow: Frequently Asked
  heading: Frequently Asked Questions About CRM and Digital Transformation
  items:
    - question: What is a CRM system?
      answer: >-
        CRM is a customer relationship management system that lets you manage
        customer information, requests, meetings, quotes and sales processes
        from a single place.
    - question: Do you build a ready-made CRM or a custom one?
      answer: >-
        Depending on what your business needs, existing systems can be
        integrated or a completely custom CRM software can be developed for you.
    - question: Which modules can be added to a CRM system?
      answer: >-
        Customer, sales, quote, appointment, task, finance, stock, reporting,
        user permission and communication modules can be added according to the
        project.
    - question: Does the system support different user roles?
      answer: >-
        Yes. Different user roles and access permissions such as administrator,
        sales, accounting, doctor, assistant or call center can be created.
    - question: Can existing data be transferred to the system?
      answer: >-
        Once the format and condition of your current data have been reviewed,
        the migration of suitable records to the new system can be planned.
    - question: Can the CRM be used on mobile devices?
      answer: >-
        Yes. The systems can be developed with a responsive structure that works
        on phones, tablets and desktop computers.
