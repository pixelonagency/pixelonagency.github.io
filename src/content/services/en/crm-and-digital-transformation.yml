intro:
  eyebrow: We Shape the Software Around Your Business, Not the Other Way Around
  heading: We Bring Your Data, Teams and Processes Together in a Single System.
  body: >-
    When customer information sits in separate files, requests get lost in
    WhatsApp conversations and sales processes are scattered across
    spreadsheets, you lose both time and opportunities.


    At Pixelon we analyze the way your business works and turn your customer,
    sales, quote, appointment, task, finance and reporting processes into
    digital systems you can manage from one place. Instead of expecting you to
    adapt to off-the-shelf software, we let the system take shape around the
    needs of your business.
  highlight: >-
    Our goal is not simply to build a piece of software, but to help your
    business run in a more organized, faster and measurable way.

why:
  eyebrow: Why Pixelon?
  heading: We Handle Software, Design and Business Processes Together.
  lead: >-
    Instead of installing a ready-made program and handing it over, we focus on
    understanding what your business really needs. We plan user experience,
    operations, technology and reporting within the same system.
  items:
    - title: A Structure Built for Your Business
      description: >-
        We shape the system around your industry, your team structure and your
        workflows.
    - title: User-Friendly Interface
      description: >-
        We create screens that simplify complex tasks and that your team can
        learn quickly.
    - title: Permissions and Security
      description: >-
        We make sure every user can only reach the screens and data related to
        their own role.
    - title: Scalable Infrastructure
      description: >-
        We develop systems that let you add new users, branches, modules and
        integrations as your business grows.
    - title: Measurable Processes
      description: >-
        We give you reports to follow sales, request, customer, team and
        financial performance.

scope:
  eyebrow: Our CRM and Digital Transformation Services
  heading: Management Solutions Built Around Your Business Processes
  items:
    - title: Customer and Request Management
      description: >-
        We gather customer requests coming from your website, WhatsApp, social
