    - title: Sales and Quote Tracking
      description: >-
        We build quote, meeting and payment processes that let you follow
        prospects through every stage of your sales pipeline.
    - title: Clinic and Patient Management
      description: >-
        We develop clinic CRM systems for managing patient records,
        appointments, treatments, communication history, payments and doctor
        workflows.
    - title: Appointment and Calendar Systems
      description: >-
        We create online appointment and calendar solutions that work by
        customer, staff member, service and branch.
    - title: Task and Team Management
      description: >-
        We digitize team processes such as task assignment, deadlines,
        responsible staff and project tracking.
    - title: Finance and Reporting
      description: >-
        We prepare reporting screens where you can follow income, expenses,
        payments, receivables, quotes and invoice data.
    - title: Admin Panel Development
      description: >-
        We design custom admin panels for managing your website, content,
        projects, forms and user requests.
    - title: Automation and Integration
      description: >-
        We set up automations that connect forms, email, WhatsApp, calendars,
        advertising and third-party systems to each other.

process:
  eyebrow: Our Digital Transformation Process
  heading: From Analysis to a Ready-to-Use System
  steps:
    - title: Process Analysis
      description: >-
        We review the way you currently work, the tools you use and the
        operational problems you run into.
    - title: System Architecture
      description: >-
        We plan the modules, user roles, data structure and the connections
        between processes.
    - title: UX/UI Design
      description: >-
        We design clean, clear screens that match your brand and that your team
        can use with ease.
    - title: Development and Integration
      description: >-
        We build the approved structure and integrate it with the services and
        communication channels you need.
    - title: Testing and Training
      description: >-
        We test permissions, data, transactions and user scenarios, then train
        your team on how to use the system.
    - title: Support and Development
      description: >-
        After the system goes live, we keep adding new modules and features as
        your needs evolve.

