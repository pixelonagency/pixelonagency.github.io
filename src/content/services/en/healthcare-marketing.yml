faq:
  eyebrow: Common Questions
  heading: Frequently Asked Questions
  items:
    - question: What does a healthcare marketing agency actually do?
      answer: >-
        It plans and runs the parts that bring patients to a clinic and turn
        interest into an enquiry: the website, the content, the advertising and
        the systems that track what happens next. The value is in connecting
        them, not in running each one separately.
    - question: How is healthcare marketing different from other sectors?
      answer: >-
        The decision takes longer and trust matters more than persuasion.
        Tactics that work in retail can damage a clinic's credibility, so the
        tone and the evidence behind every claim need more care.
    - question: Do you work with clinics outside Turkey?
      answer: >-
        Yes. We already run multilingual websites and campaigns for clinics
        reaching audiences in more than one language, and content is produced
        for each market rather than translated. If most of your patients travel
        internationally, our health tourism consulting service is usually the
        better starting point.
    - question: How do you measure whether it is working?
      answer: >-
        By tracked enquiries — form, phone and WhatsApp — attributed back to
        their source, with response times visible. Impressions and clicks are
        diagnostic, not the goal.
    - question: Can you guarantee more patients?
      answer: >-
        No, and we would be careful with anyone who does. We can commit to a
        measured system, honest reporting and adjustments based on evidence.
        Clinical and commercial outcomes depend on far more than marketing.
