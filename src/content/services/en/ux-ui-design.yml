seo:
  title: "UX/UI Design and User Experience Services | Pixelon"
  description: "We create user-focused, modern and conversion-driven UX/UI designs for websites, mobile apps, SaaS products and admin panels."

hero:
  eyebrow: "UX/UI Design"
  headingLines:
    - "We Design Digital Experiences People Understand Instantly and *Love to Use*."
  lead: "We create aesthetic, functional and user-focused interfaces for websites, mobile apps, SaaS products and admin panels."
  tagline: "We simplify complex processes and turn user needs into powerful digital experiences."
  whatsappMessage: "Hello Pixelon, I would like to get information about your UX/UI Design service."

intro:
  eyebrow: "Good Design Is More Than Good Looks"
  heading: "It Understands, Guides and Moves the User."
  body: |-
    The success of a digital product is not decided by colours or visual details alone. How easily a user finds the information they are looking for, how effortlessly they complete a task and the overall experience they have with the product matter just as much as the design itself.

    At Pixelon we evaluate user behaviour, business goals and technical requirements together. That way we design digital interfaces that reflect your brand strongly and answer the real needs of your users.
  highlight: "Our goal is not only to create impressive screens, but to make the experience between the user and the brand easier and more valuable."

why:
  eyebrow: "Why Pixelon?"
  heading: "We Bring Design, Business Goals and Technology to the Same Table."
  lead: "In UX/UI projects we do more than design screens. We consider the product's business model, user expectations and software requirements as a whole."
  items:
    - title: "User-Focused Approach"
      description: "We base design decisions on user needs and real usage scenarios, not on personal preference."
    - title: "Strategy and Design Together"
      description: "We make sure the interface supports both your brand goals and the user experience."
    - title: "Design Ready for Development"
      description: "We deliver the screens as an implementable, consistent system that development teams can read and build from."
    - title: "Scalable Structure"
      description: "We build a design foundation that lets new screens and features be added easily as the product grows."

scope:
  eyebrow: "Our UX/UI Design Services"
  heading: "From an Idea to a Digital Product Ready for Use"
  items:
    - title: "Website Interface Design"
      description: "We design user-friendly, modern and conversion-focused interfaces for corporate websites, e-commerce sites and landing page projects."
    - title: "Mobile App Design"
      description: "We create clear and consistent screen experiences for iOS and Android apps, matched to real mobile usage habits."
    - title: "SaaS and Web Application Design"
      description: "We develop scalable interface systems for subscription-based platforms, CRM systems and digital products."
    - title: "Dashboard and Admin Panel Design"
      description: "We design easy-to-use admin panels and reporting screens that simplify heavy data and operational processes."
    - title: "E-Commerce User Experience"
      description: "We create experiences that smooth the shopping journey from product discovery to checkout and support sales conversion."
    - title: "Design System"
      description: "We standardise colours, typography, buttons, forms, icons and interface components into consistent, extendable design systems."
    - title: "Wireframes and Prototypes"
      description: "We build interactive prototypes so you can test page structure, user flows and core functions before development starts."

comparison:
  eyebrow: "What Is the Difference Between UX and UI?"
  heading: "We Handle User Experience and Visual Design Together."
  items:
    - title: "UX — User Experience"
      description: "It plans how the user discovers the product, which steps they follow and how easily they complete the task they came for."
    - title: "UI — User Interface"
      description: "It shapes the product's colours, typography, buttons, cards, icons and overall visual language."
  note: "A strong digital product needs UX and UI to be planned together toward the same goal, not as separate processes."

process:
  eyebrow: "Our Design Process"
  heading: "From Research to an Interactive Prototype"
  steps:
    - title: "Discovery and Needs Analysis"
      description: "We learn the project's goals, user groups, business model and technical requirements."
    - title: "User Flows"
      description: "We map the steps users will follow inside the product and the core scenarios they will go through."
    - title: "Information Architecture and Wireframes"
      description: "We build the structure of pages, screens and content with low-fidelity drafts."
    - title: "UI Design"
      description: "We prepare the colours, typography, components and screen designs in line with your brand identity."
    - title: "Prototype and Testing"
      description: "We make the transitions between screens interactive and test the core usage scenarios."
    - title: "Handover to the Development Team"
      description: "We hand over all screens, the design system, measurements and component usage rules to the development team in an organised way."

principles:
  eyebrow: "What Do We Care About in Design?"
  heading: "Every Detail Should Have a Purpose."
  items:
    - title: "Ease of Use"
      description: "We make sure users reach the information and the function they need through the shortest possible path."
    - title: "Visual Consistency"
      description: "We build an orderly, professional system that keeps the same design language across every screen."
    - title: "Mobile-First Approach"
      description: "We design interfaces to work properly on phone, tablet and desktop."
    - title: "Accessibility"
      description: "We create more inclusive experiences with readable typography, sufficient contrast and clear interactions."
    - title: "Conversion-Focused Structure"
      description: "We place key actions such as forms, sign-ups, quote requests, purchases or contact at the right points of the user journey."
    - title: "Extendable System"
      description: "We set up component systems that let new screens and features be added to the existing design structure with ease."

