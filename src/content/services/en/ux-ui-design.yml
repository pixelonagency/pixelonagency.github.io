faq:
  eyebrow: "Frequently Asked"
  heading: "Frequently Asked Questions About UX/UI Design"
  items:
    - question: "What is included in the UX/UI design service?"
      answer: "Depending on the scope of the project, it covers user flows, information architecture, wireframes, interface design, mobile compatibility, a design system and interactive prototypes."
    - question: "Can we work with you for design only?"
      answer: "Yes. You can run the development process with your own team and take only the UX/UI design and prototype work from Pixelon."
    - question: "Which tool are the designs prepared in?"
      answer: "Projects are mostly prepared in Figma. Screens, components and prototype links are handed over to the development team in an organised way."
    - question: "Can an existing application be redesigned?"
      answer: "Yes. An existing product can be analysed in terms of user experience, interface consistency and conversion points, then redesigned."
    - question: "Are the designs prepared to be mobile friendly?"
      answer: "Yes. Depending on the needs of the project, mobile, tablet and desktop screens are designed with their own usage scenarios."
    - question: "Do you also provide development services?"
      answer: "Yes. After the UX/UI design, Pixelon can also handle website, admin panel and custom web software development."
