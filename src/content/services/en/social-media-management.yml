seo:
  title: Social Media Management Service | Pixelon Digital Agency
  description: >-
    Get a tailored social media strategy, content production, Reels, design,
    community management and performance-driven social media service with Pixelon.

hero:
  eyebrow: Social Media Management
  headingLines:
    - "We Turn Your Brand From Something Scrolled Past Into a Story Worth *Following*."
  lead: |-
    By bringing strategy, creative content, professional design and video production together, we help your brand build strong, consistent and eye-catching communication on social media.
  tagline: |-
    We develop content strategies built around your brand for Instagram, Facebook, TikTok and LinkedIn.
  whatsappMessage: |-
    Hello Pixelon, I would like to get information about your Social Media Management service.

intro:
  eyebrow: Being Visible Is Not Enough
  heading: We Make Sure Your Brand Is Remembered and Chosen
  body: |-
    Social media is one of the most powerful places where your brand speaks directly to its audience. But posting regularly on its own is not enough to build a strong brand perception.

    At Pixelon, we analyse your brand's goals, industry and target audience, then plan your content not as isolated posts but as parts of a single, coherent communication strategy. From your visual language and tone of voice to video editing and the publishing calendar, we manage the entire process professionally.
  highlight: |-
    Our goal is not simply to gain followers, but to build a community that genuinely connects with your brand.

why:
  eyebrow: Why Pixelon?
  heading: Not Just a Content Team, a Team That Manages Your Brand
  lead: |-
    We do not see social media management as merely preparing designs and publishing posts. We make sure every piece of content serves your brand's communication goals, audience and growth strategy.
  items:
    - title: Strategy Built for Your Brand
      description: |-
        Instead of ready-made content templates, we prepare a communication plan shaped around your industry and your brand.
    - title: Design and Video in One Team
      description: |-
        We manage graphic design, copywriting, photography, video shooting and editing as one connected process.
    - title: Regular and Consistent Communication
      description: |-
        We make sure your brand speaks on social media in a planned and powerful way, never in scattered fragments.
    - title: Measurable Progress
      description: |-
        We analyse content performance regularly and refine the strategy based on the results.

scope:
  eyebrow: What Our Social Media Management Covers
  heading: From Strategy to Publishing, the Whole Process in One Team
  items:
    - title: Social Media Strategy
      description: |-
        We analyse your goals, competitors, target audience and content opportunities to build your social media roadmap.
    - title: Content Planning
      description: |-
        We plan the monthly content calendar, post topics, campaign periods and special days around your communication goals.
    - title: Graphic Design
      description: |-
        We create original, attention-grabbing post, carousel, story and campaign designs that match your corporate identity.
    - title: Reels and Video Content
      description: |-
        We develop short video ideas in line with social media trends and user behaviour, and manage the shooting and editing process.
    - title: Copywriting
      description: |-
        We write informative, engaging and action-driving captions that match your brand's tone of voice.
    - title: Story Management
      description: |-
        We produce story content that keeps your daily communication alive, sparks interaction and moves followers to action.
    - title: Community Management
      description: |-
        We handle comments, messages and user interactions in a way that stays true to your brand's voice.
    - title: Reporting and Optimization
      description: |-
        We analyse reach, engagement, follower growth and content performance to improve the next content plans.

platforms:
  eyebrow: Our Platform Experience
  heading: Content Suited to Every Platform, One Consistent Brand Voice
  items:
    - title: Instagram
      description: |-
        We strengthen your brand's visual impact and engagement with Reels, posts, carousels and stories.
    - title: Facebook
      description: |-
        We support your corporate visibility with brand communication, campaign announcements and content shaped for your audience.
    - title: TikTok
      description: |-
        We create genuine, fast-paced and shareable video content that speaks the platform's native language.
    - title: LinkedIn
      description: |-
        We tell the story of your corporate identity, expertise, team culture and industry experience through professional content.
    - title: YouTube
      description: |-
        We build content plans for short and long-form videos, corporate films and informative series.

process:
  eyebrow: Step by Step
  heading: We Get to Know Your Brand, Plan It and Keep Improving
  steps:
    - title: Discovery and Analysis
      description: |-
        We review your brand, your goals, your existing accounts, your competitors and your target audience.
    - title: Strategy and Content Plan
      description: |-
        We build the monthly communication topics, content formats and publishing calendar.
    - title: Content Production
      description: |-
        We prepare design, copy, photography, video and Reels work in line with your brand identity.
    - title: Approval and Publishing
      description: |-
        We submit the content for your approval and publish it on the agreed days and times.
    - title: Tracking and Reporting
      description: |-
        We analyse content performance and continuously refine the strategy based on the results.

