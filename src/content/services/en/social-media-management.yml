sectors:
  eyebrow: Our Industry Experience
  heading: Which Industries Do We Work With?
  body: |-
    We provide social media management for health and clinic brands, health tourism companies, e-commerce businesses, construction and real estate firms, and for SMEs and corporate brands in the service sector. We assess the communication style, user behaviour and content needs of each industry separately.

cta:
  eyebrow: Let's Grow Your Brand on Social Media Together
  heading: Ready for Stronger Social Media Communication?
  lead: |-
    Get in touch with the Pixelon team to manage your social media accounts professionally, produce more effective content and build a strong bond with your audience. Let us listen to your brand and prepare a social media management plan made for you.

faq:
  eyebrow: Common Questions
  heading: Frequently Asked Questions About Social Media Management
  items:
    - question: What is included in the social media management service?
      answer: |-
        The service can cover strategy, a content calendar, graphic design, copywriting, Reels and video production, publishing, community management and reporting.
    - question: How many posts are prepared each month?
      answer: |-
        The number of posts depends on the brand's needs and the service package chosen. The content plan may include posts, Reels and story formats.
    - question: Do you handle photo and video shoots?
      answer: |-
        Yes. Depending on the need, we can plan product, team, clinic, office and service shoots as well as Reels productions.
    - question: Is content submitted for approval before it is published?
      answer: |-
        Yes. All prepared content is submitted for the brand's approval before publishing.
    - question: Is ad management included in the social media service?
      answer: |-
        Organic social media management and Meta ad management are separate services. They can be planned together depending on your needs.
