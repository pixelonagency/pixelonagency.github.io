title: Dijital Reklam Yönetimi
navLabel: Dijital Reklam Yönetimi
order: 3

seo:
  title: Dijital Reklam Yönetimi | Google Ads ve Meta Ads | Pixelon
  description: >-
    Google Ads ve Meta Ads kampanyalarınızı doğru hedefleme, yaratıcı reklam
    içerikleri, dönüşüm takibi ve düzenli optimizasyonla büyütün.

hero:
  eyebrow: Dijital Reklam Yönetimi
  headingLines:
    - "Reklam Bütçenizi Görüntülenmeye Değil, *Gerçek Sonuçlara* Dönüştürüyoruz."
  lead: |-
    Google Ads ve Meta reklam kampanyalarınızı doğru hedef kitle, güçlü reklam içerikleri ve düzenli optimizasyonlarla yönetiyoruz. Daha fazla talep, satış ve randevu için markanıza özel performans stratejileri oluşturuyoruz.
  tagline: |-
    Google, Instagram ve Facebook reklamlarınızı ölçülebilir hedeflerle tek merkezden yönetiyoruz.
  whatsappMessage: |-
    Merhaba Pixelon, Dijital Reklam Yönetimi hizmeti hakkında bilgi almak istiyorum.

intro:
  eyebrow: Her Tıklama Değil, Doğru Tıklama Değerlidir
  heading: Markanızı Satın Almaya Hazır Hedef Kitlelerle Buluşturuyoruz
  body: |-
    Dijital reklam vermek yalnızca bir kampanya oluşturup bütçe belirlemekten ibaret değildir. Başarılı bir reklam süreci; doğru hedef kitleyi, etkili mesajı, güçlü görseli, dönüşüm odaklı sayfayı ve düzenli optimizasyonu birlikte gerektirir.

    Pixelon olarak reklam kampanyalarınızı markanızın hedefleri doğrultusunda planlıyor; kullanıcıların yalnızca reklamı görmesini değil, arama, WhatsApp, form, randevu veya satın alma gibi değerli aksiyonlar gerçekleştirmesini hedefliyoruz.
  highlight: |-
    Amacımız daha fazla reklam göstermek değil, bütçenizle daha nitelikli sonuçlar elde etmektir.

scope:
  eyebrow: Dijital Reklam Hizmetlerimiz
  heading: Doğru Platform, Doğru Mesaj, Doğru Hedef Kitle
  items:
    - title: Google Ads Yönetimi
      description: |-
        Hizmetlerinizi aktif olarak arayan kullanıcılara ulaşmak için arama ağı, görüntülü reklam, yeniden pazarlama ve uygun proje türlerinde performans kampanyaları oluşturuyoruz.
    - title: Meta Ads Yönetimi
      description: |-
        Instagram ve Facebook'ta hedef kitlenizin ilgi alanları, davranışları ve demografik özelliklerine göre marka bilinirliği, mesaj, form ve satış kampanyaları yürütüyoruz.
    - title: Yeniden Pazarlama Kampanyaları
      description: |-
        Web sitenizi ziyaret eden veya markanızla daha önce etkileşime geçen kullanıcılara yeniden ulaşarak dönüşüm ihtimalini artırıyoruz.
    - title: Lead ve Talep Toplama Reklamları
      description: |-
        WhatsApp, telefon, anlık form ve web sitesi formları üzerinden nitelikli müşteri talepleri oluşturmayı hedefleyen kampanyalar hazırlıyoruz.
    - title: E-Ticaret Reklamları
      description: |-
        Ürün kataloğu, satış kampanyaları ve kullanıcı davranışlarına dayalı reklamlarla e-ticaret markalarının satış performansını destekliyoruz.
    - title: Uluslararası Reklam Kampanyaları
      description: |-
        Sağlık turizmi ve yurt dışı hedefli markalar için ülke, şehir, dil ve kullanıcı profiline özel reklam stratejileri geliştiriyoruz.

principles:
  eyebrow: Reklam Yönetiminde Neleri Birlikte Ele Alıyoruz?
  heading: Kampanyadan Önce Strateji, Yayından Sonra Sürekli Optimizasyon
  items:
    - title: Hedef Kitle Analizi
      description: |-
        Markanız için en değerli kullanıcı gruplarını, ihtiyaçlarını ve dijital davranışlarını analiz ediyoruz.
    - title: Kampanya Stratejisi
      description: |-
        Reklam hedefini, platformu, bütçe dağılımını ve kampanya yapısını iş hedeflerinize göre belirliyoruz.
    - title: Reklam Metni ve Görseli
      description: |-
        Kullanıcının dikkatini çeken, teklifinizi doğru anlatan ve harekete geçiren reklam metinleri, tasarımlar ve videolar hazırlıyoruz.
    - title: Landing Page Kontrolü
      description: |-
        Reklamdan gelen kullanıcının karşılaştığı sayfayı hız, içerik, güven unsurları ve dönüşüm butonları açısından değerlendiriyoruz.
    - title: Dönüşüm Takibi
      description: |-
        Form, WhatsApp, telefon, satın alma ve diğer önemli kullanıcı hareketlerinin takip edilebilmesi için gerekli ölçüm sistemlerini planlıyoruz.
    - title: Düzenli Optimizasyon
      description: |-
        Hedefleme, reklam içeriği, bütçe ve teklif stratejilerini performans verilerine göre sürekli geliştiriyoruz.

platforms:
  eyebrow: Reklam Platformlarımız
  heading: Markanızın Hedefine Uygun Kanalları Seçiyoruz
  items:
    - title: Google Ads
      description: |-
        Aktif olarak ürün veya hizmet arayan kullanıcılara, ihtiyaç duydukları anda ulaşmanızı sağlıyoruz.
    - title: Instagram Ads
      description: |-
        Görsel ve video odaklı reklamlarla marka bilinirliği, etkileşim, mesaj ve müşteri talebi oluşturuyoruz.
    - title: Facebook Ads
      description: |-
        Geniş hedefleme seçenekleriyle farklı yaş gruplarına ve kullanıcı profillerine yönelik kampanyalar yürütüyoruz.
    - title: YouTube Ads
      description: |-
        Video reklamlarla markanızı, ürünlerinizi ve hizmetlerinizi daha etkili ve akılda kalıcı biçimde anlatıyoruz.
    - title: LinkedIn Ads
      description: |-
        Kurumsal ve B2B hedeflemelerde sektör, pozisyon ve şirket özelliklerine göre profesyonel kitlelere ulaşmayı hedefliyoruz.

process:
  eyebrow: Dijital Reklam Yönetim Sürecimiz
  heading: Planlıyor, Uyguluyor, Ölçüyor ve Geliştiriyoruz
  steps:
    - title: Analiz
      description: |-
        Markanızı, hedef kitlenizi, rakiplerinizi ve mevcut reklam performansınızı inceliyoruz.
    - title: Strateji
      description: |-
        Kampanya hedeflerini, platformları, bütçe planını ve dönüşüm yöntemlerini belirliyoruz.
    - title: Kurulum ve İçerik Üretimi
      description: |-
        Kampanya yapısını oluşturuyor, reklam metinlerini, görselleri ve videoları hazırlıyoruz.
    - title: Yayın ve Test
      description: |-
        Farklı hedef kitle, mesaj ve reklam içeriklerini test ederek en etkili kombinasyonları belirliyoruz.
    - title: Optimizasyon ve Raporlama
      description: |-
        Kampanyaları düzenli olarak geliştiriyor ve elde edilen sonuçları anlaşılır raporlarla paylaşıyoruz.

projects:
  eyebrow: Başarıyla Tamamladığımız Projeler
  heading: Markaların Reklam Bütçelerini Büyüme Fırsatına Dönüştürdük
  lead: |-
    Stratejik hedefleme, yaratıcı reklam içerikleri ve performans odaklı optimizasyonlarla farklı sektörlerdeki markaların daha fazla kullanıcıya ulaşmasına ve nitelikli talepler oluşturmasına destek olduk. Siz de markanızı bu projeler arasına eklemek için bizimle iletişime geçin.
  items:
    - eyebrow: Uluslararası Sağlık Turizmi Reklamları
      title: Dentasay
      description: |-
        Avrupa'nın farklı ülkelerinde implant, zirkonyum ve estetik diş tedavileriyle ilgilenen kullanıcılara yönelik çok dilli Meta ve Google reklam kampanyaları hazırladık.
    - eyebrow: Klinik ve Estetik Uygulama Reklamları
      title: Dr. Ayşe Cinkaya Kahveci
      description: |-
        Dermatoloji ve estetik hizmetleri için bölgesel hedefleme, randevu odaklı reklam içerikleri ve kullanıcıyı iletişime yönlendiren kampanyalar oluşturduk.
    - eyebrow: Almanya Hedefli Performans Kampanyaları
      title: Çağla Aytaç
      description: |-
        Farklı şehirlerde sunulan diyet ve vücut şekillendirme hizmetleri için lokasyon bazlı reklam stratejileri ve talep toplama kampanyaları geliştirdik.
    - eyebrow: Kurumsal Marka Bilinirliği Kampanyaları
      title: Xray Groupe
      description: |-
        İnşaat, mimarlık ve mühendislik hizmetlerinin hedef pazarlarda daha görünür olması için kurumsal iletişimi destekleyen dijital kampanyalar hazırladık.

why:
  eyebrow: Neden Pixelon?
  heading: Reklamı Tek Başına Değil, Tüm Dönüşüm Süreciyle Birlikte Yönetiyoruz
  lead: |-
    Reklam performansını yalnızca tıklama ve gösterim sayılarıyla değerlendirmiyoruz. Kullanıcının reklamı gördüğü andan iletişime geçtiği veya satın alma gerçekleştirdiği ana kadar tüm süreci analiz ediyoruz.
  items:
    - title: Strateji ve Kreatif Tek Ekipte
      description: |-
        Reklam stratejisi, metin, tasarım, video ve landing page süreçlerini birbiriyle uyumlu biçimde yönetiyoruz.
    - title: Dönüşüm Odaklı Yaklaşım
      description: |-
        WhatsApp, arama, form, randevu ve satış gibi işletmeniz için değerli sonuçlara odaklanıyoruz.
    - title: Şeffaf Raporlama
      description: |-
        Reklam bütçesini, kampanya sonuçlarını ve gelişim alanlarını anlaşılır biçimde paylaşıyoruz.
    - title: Sürekli Optimizasyon
      description: |-
        Kampanyaları yalnızca kurup bırakmıyor, performans verilerine göre düzenli olarak geliştiriyoruz.

sectors:
  eyebrow: Sektör Deneyimimiz
  heading: Hangi Sektörlerle Çalışıyoruz?
  body: |-
    Sağlık ve klinik markaları, sağlık turizmi firmaları, e-ticaret işletmeleri, inşaat ve gayrimenkul şirketleri ile hizmet sektöründeki KOBİ ve kurumsal markalar için dijital reklam yönetimi hizmeti sunuyoruz. Her sektör için hedef kitleyi, kullanıcı karar sürecini ve reklam mesajlarını ayrı bir stratejiyle ele alıyoruz.

cta:
  eyebrow: Reklam Bütçenizi Birlikte Büyümeye Dönüştürelim
  heading: Daha Fazla Talep, Satış ve Randevu Almaya Hazır mısınız?
  lead: |-
    Mevcut reklamlarınızdan yeterli sonuç alamıyorsanız veya markanız için sıfırdan profesyonel bir reklam sistemi kurmak istiyorsanız Pixelon ekibiyle iletişime geçin. Hedeflerinizi analiz edelim ve markanıza özel dijital reklam planını birlikte oluşturalım.

faq:
  eyebrow: Merak Edilenler
  heading: Dijital Reklam Yönetimi Hakkında Sıkça Sorulan Sorular
  items:
    - question: Dijital reklam yönetimi hizmetine neler dahildir?
      answer: |-
        Hizmet kapsamına hedef kitle analizi, kampanya stratejisi, reklam kurulumu, reklam metni ve tasarımları, dönüşüm takibi, optimizasyon ve raporlama dâhil edilebilir.
    - question: Reklam bütçesi hizmet ücretine dâhil mi?
      answer: |-
        Hayır. Reklam platformlarına ödenen medya bütçesi ile Pixelon reklam yönetim hizmet bedeli ayrı olarak planlanır.
    - question: Ne kadar reklam bütçesi ayırmalıyız?
      answer: |-
        Uygun bütçe; sektörünüze, hedeflediğiniz bölgeye, rekabet düzeyine ve kampanya hedeflerinize göre belirlenir. İlk analiz sonrasında size uygun bir bütçe önerisi sunulur.
    - question: Reklamlardan ne zaman sonuç alınır?
      answer: |-
        Sonuç süresi sektör, teklif, bütçe, hedef kitle ve kullanılan platforma göre değişir. Kampanyaların ilk döneminde veri toplanır, testler yapılır ve performans düzenli optimizasyonlarla geliştirilir.
    - question: Reklam içeriklerini Pixelon hazırlıyor mu?
      answer: |-
        Evet. Hizmet kapsamına göre reklam metinleri, statik tasarımlar, hareketli görseller ve kısa video içerikleri Pixelon tarafından hazırlanabilir.
    - question: Google Ads ve Meta Ads birlikte yönetilebilir mi?
      answer: |-
        Evet. Markanın hedeflerine göre Google, Instagram ve Facebook reklamları birbirini destekleyecek şekilde birlikte planlanabilir.
