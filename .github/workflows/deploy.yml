name: Deploy to GitHub Pages

# TARİHSEL NOT: bu iş akışı 2026-08-22'ye kadar üretim yayın hattıydı. SEO operasyon altyapısı
# (seo/, scripts/seo/) ve kök dizindeki dokümanlar yayına çıkmadığı için deploy
# tetiklemez; push ile production deploy artık aynı şey değildir.
#
# Not: paths-ignore YALNIZCA push'taki TÜM dosyalar listeye uyuyorsa devreye girer.
# Karma bir commit (örn. seo/ + src/) normal şekilde deploy olur.
# `src/content/**/*.md` (blog yazıları) bilerek listeye ALINMAMIŞTIR — onlar yayına çıkar.
# Operasyon commit'ini elle yayına almak gerekirse: workflow_dispatch.
#
# Kapı yine de önce çalışır: gate veya build başarısızsa deploy adımı hiç çalışmaz,
# dolayısıyla bozuk bir commit canlıya çıkamaz.
# ROLLBACK ARACI — otomatik çalışmaz.
#
# 2026-08-22 cutover'ından sonra üretim `deploy-workers-production.yml` üzerinden
# Cloudflare Workers'a yayınlanıyor. Bu iş akışı SİLİNMEDİ: DNS geri alınırsa
# GitHub Pages'i tekrar ayağa kaldırmak için elle tetiklenir.
#
# Rollback sırası (bkz. seo/private/cutover/runbook.md):
#   1. Cloudflare → Worker'dan custom domain'i kaldır
#   2. apex A kayıtlarını GitHub Pages IP'lerine geri yaz (DNS-only)
#   3. Bu iş akışını elle çalıştır
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gate & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate (typecheck → format → lint → knip → test)
        run: bun run gate

      - name: Secret scan
        run: bun run secrets

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Web3Forms erişim anahtarı build sırasında form HTML'ine gömülür — Web3Forms'un
      # tasarımı gereği istemci tarafında görünür ve gizli bir sır DEĞİLDİR. Secret'ta
      # tutulmasının amacı anahtarın depo geçmişine yazılmamasıdır.
      # Kod tarafı `PUBLIC_` ön ekli ismi okur (Vite yalnızca o ön eki istemciye açar).
      - name: Build & smoke-test the rendered output
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: bun run verify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # IndexNow: yalnızca deploy BAŞARILI olduktan sonra, yalnızca gerçekten değişen
  # public URL'leri bildirir. SEO bildirim katmanıdır — deploy'u asla bloklamaz
  # (bu job deploy'dan SONRA çalışır; geçici IndexNow hataları script içinde
  # warning'e çevrilir, yalnız kalıcı yapılandırma hataları job'ı kızartır).
  indexnow:
    name: IndexNow
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with history for diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Base SHA push event metadata'sından gelir; script ilk push/force-push gibi
      # güvenilmez base durumlarını kendisi tespit edip gönderimi atlar (HEAD~1 yok).
      - name: Detect changes & submit to IndexNow
        run: bun scripts/seo/indexnow.ts --base "${{ github.event.before }}" --head "${{ github.sha }}"
