name: Deploy to GitHub Pages

# `main` dalına giden HER commit otomatik olarak yayına alınır.
# Kapı yine de önce çalışır: gate veya build başarısızsa deploy adımı hiç çalışmaz,
# dolayısıyla bozuk bir commit canlıya çıkamaz.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gate & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate (typecheck → format → lint → knip → test)
        run: bun run gate

      - name: Secret scan
        run: bun run secrets

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Web3Forms erişim anahtarı build sırasında form HTML'ine gömülür — Web3Forms'un
      # tasarımı gereği istemci tarafında görünür ve gizli bir sır DEĞİLDİR. Secret'ta
      # tutulmasının amacı anahtarın depo geçmişine yazılmamasıdır.
      # Kod tarafı `PUBLIC_` ön ekli ismi okur (Vite yalnızca o ön eki istemciye açar).
      - name: Build & smoke-test the rendered output
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: bun run verify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
