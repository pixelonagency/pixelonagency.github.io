name: CI

# Yalnızca pull request'lerde çalışır. `main` dalına giden commit'lerde aynı kapıyı
# deploy.yml zaten koştuğu için burada tekrarlanmaz.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gate & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate (typecheck → format → lint → knip → test)
        run: bun run gate

      - name: Secret scan
        run: bun run secrets

      - name: Audit (non-blocking)
        run: bun run audit || echo "::notice::bun audit reported advisories; review Dependabot PRs"

      - name: Build & smoke-test the rendered output
        run: bun run verify

      - name: Job summary
        run: |
          {
            echo "### Pixelon CI"
            echo ""
            echo "| Öğe | Değer |"
            echo "| --- | --- |"
            echo "| Bun | $(bun --version) |"
            echo "| Node | $(node --version) |"
            echo "| Astro | $(bun pm ls 2>/dev/null | grep -o 'astro@[0-9.]*' | head -1) |"
            echo "| Üretilen sayfa | $(find dist -name '*.html' | wc -l | tr -d ' ') |"
            echo "| Commit | ${GITHUB_SHA::7} |"
          } >> "$GITHUB_STEP_SUMMARY"
