name: Deploy Workers Production

# Cloudflare Workers Static Assets — ÜRETİM YAYIN HATTI.
#
# 2026-08-22'den itibaren `pixelon.com.tr`'nin tek deploy hattı budur.
# GitHub Pages (`deploy.yml`) rollback amacıyla korunuyor ama otomatik çalışmıyor.
#
# Bu iş akışı YALNIZCA Worker kodunu ve statik varlıkları yayınlar.
# Bilinçli olarak YAPMADIKLARI:
#   - custom domain bağlamaz
#   - DNS kaydı oluşturmaz/değiştirmez
#   - TLS ayarı yapmaz
#   - GitHub Pages'i kapatmaz
# Bu adımlar cutover runbook'unda insan eliyle ve ayrı onayla yapılır.
#
# Alan adı Worker'a Custom Domain olarak bağlıdır; DNS'e bu iş akışı dokunmaz.
# Alan adı/TLS değişiklikleri runbook'ta insan eliyle yapılır.
# `main` dalına giden commit'ler otomatik olarak yayına alınır — ANCAK yalnızca
# production çıktısını etkileyen dosyalar değiştiyse. SEO operasyon altyapısı
# (seo/, scripts/seo/) ve kök dizindeki dokümanlar yayına çıkmadığı için deploy
# tetiklemez. Bu mantık `deploy.yml`'dan devralındı; push ile production deploy
# hâlâ aynı şey değildir.
#
# Not: paths-ignore YALNIZCA push'taki TÜM dosyalar listeye uyuyorsa devreye girer.
# Karma bir commit (örn. seo/ + src/) normal şekilde deploy olur.
# `src/content/**/*.md` (blog yazıları) bilerek listeye ALINMAMIŞTIR — yayına çıkar.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'seo/**'
      - 'scripts/seo/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Gate, Build & Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate (typecheck → format → lint → knip → test)
        run: bun run gate

      - name: Secret scan
        run: bun run secrets

      - name: Build
        env:
          # `deploy.yml` ile aynı: form erişim anahtarı build zamanında enjekte edilir.
          # Bu adım olmadan iletişim formu boş anahtarla render edilir ve her gönderim
          # sessizce başarısız olur. Cutover parity testinde yakalandı.
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: bun run build

      - name: Generate redirect map
        run: bun run seo:redirects

      - name: Rebuild with generated redirects
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: bun run build

      - name: Validate redirect and header maps
        run: |
          test -f dist/_redirects || { echo "dist/_redirects yok"; exit 1; }
          test -f dist/_headers   || { echo "dist/_headers yok";   exit 1; }
          if grep -q '\*' dist/_redirects; then echo "wildcard kuralı bulundu — beklenmiyor"; exit 1; fi
          if ! grep -q 'max-age=31536000, immutable' dist/_headers; then
            echo "asset cache kuralı eksik"; exit 1
          fi
          # Staging noindex kuralı üretim host'una uygulanmamalı: kural host bazlı olmalı.
          #
          # Kontrol edilen şey HOST'SUZ KURAL VARLIĞI DEĞİL, host'suz bir kuralın
          # indeksleme başlığı basması. Önceki hâli her `/*` bloğunu reddediyordu ve
          # tüm site için yazılan güvenlik başlıklarını (nosniff, Referrer-Policy…)
          # da engelliyordu — oysa onların üretimde olması İSTENEN durum.
          if awk '
            /^https?:/            { host = 1; next }
            /^\//                 { host = 0; next }
            /^[[:space:]]+/       { if (!host && tolower($0) ~ /x-robots-tag|noindex/) { found = 1 } ; next }
            { host = 0 }
            END { exit(found ? 0 : 1) }
          ' dist/_headers; then
            echo "host'suz indeksleme başlığı bulundu — noindex üretime sızabilir"; exit 1
          fi
          # Form anahtarı gömülmemişse üretime çıkmamalı: her lead gönderimi sessizce
          # başarısız olurdu. Anahtarın DEĞERİ değil, boş olmadığı kontrol edilir.
          if grep -qE 'name="access_key" value(=""|>)' dist/index.html; then
            echo "HATA: Web3Forms anahtarı boş — secret build'e ulaşmamış"; exit 1
          fi
          if grep -q 'local-test-key' dist/index.html; then
            echo "HATA: yerel test anahtarı derlemeye sızmış"; exit 1
          fi
          echo "yönlendirme kuralı: $(grep -cE '^/' dist/_redirects)"

      - name: Dist smoke tests
        run: bun run test:dist

      - name: Deploy Worker
        # `--env production` ZORUNLU: bayraksız komut staging Worker'ının üzerine
        # yazardı. `wrangler.jsonc` içinde route/custom domain TANIMLI DEĞİL;
        # bu komut yalnızca Worker'ı ve varlıklarını günceller, DNS'e dokunmaz.
        run: bunx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy başarılı dönse bile canlı site bozulmuş olabilir. Bu adım gerçek
      # `pixelon.com.tr` üzerinde koşar; başarısız olursa iş akışı KIRILIR ve
      # bozulma sessiz kalmaz.
      - name: Post-deploy smoke (canlı site)
        run: |
          set -euo pipefail
          P=https://pixelon.com.tr
          fail() { echo "SMOKE FAIL: $1"; exit 1; }

          # Yayın yayılımı için kısa bekleme
          sleep 10

          echo "— sayfalar 200 mü?"
          for u in / /en/ /hizmetlerimiz/kurumsal-web-tasarim/ /en/services/healthcare-marketing/; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' "$P$u" --max-time 30)
            [ "$c" = "200" ] || fail "$u → $c"
            echo "  $u → $c"
          done

          echo "— altyapı dosyaları"
          for u in /robots.txt /sitemap-index.xml /c4d8be782a330e643cd1d33da84aa6104e6df9e2965c5adf83561763668f4328.txt; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' "$P$u" --max-time 30)
            [ "$c" = "200" ] || fail "$u → $c"
            echo "  $u → $c"
          done

          echo "— eski URL yönlendirmesi: 301 → tek hop → 200"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -I "$P/hizmet/web-tasarim-yazilim/" --max-time 30)
          hops=$(curl -sS -o /dev/null -w '%{num_redirects}' -L "$P/hizmet/web-tasarim-yazilim/" --max-time 30)
          final=$(curl -sS -o /dev/null -w '%{http_code}' -L "$P/hizmet/web-tasarim-yazilim/" --max-time 30)
          [ "$code" = "301" ] && [ "$hops" = "1" ] && [ "$final" = "200" ] || fail "legacy 301: $code/$hops/$final"
          echo "  301 → 1 hop → 200"

          echo "— kanonik slash: 301 → slash → 200"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -I "$P/biz-kimiz" --max-time 30)
          final=$(curl -sS -o /dev/null -w '%{http_code}' -L "$P/biz-kimiz" --max-time 30)
          [ "$code" = "301" ] && [ "$final" = "200" ] || fail "canonical 301: $code/$final"
          echo "  301 → 200"

          echo "— production'da noindex OLMAMALI"
          n=$(curl -sS -I "$P/" --max-time 30 | grep -ci '^x-robots-tag' || true)
          [ "$n" = "0" ] || fail "production'da X-Robots-Tag var"
          echo "  X-Robots-Tag yok"

          echo "— form anahtarı üretim güvenli mi?"
          body=$(curl -sS "$P/iletisim/" --max-time 30)
          echo "$body" | grep -qE 'name="access_key" value(=""|>)' && fail "form anahtarı BOŞ"
          echo "$body" | grep -q 'local-test-key' && fail "yerel test anahtarı canlıda"
          echo "$body" | grep -q 'api.web3forms.com/submit' || fail "form action bulunamadı"
          echo "  form anahtarı dolu, test anahtarı yok"

          echo "SMOKE PASS"
