name: Deploy Workers Production

# Cloudflare Workers Static Assets ÜRETİM yayını — SEO-2026-0069 cutover hattı.
#
# DURUM: HAZIR AMA PASİF. Yalnızca elle tetiklenir.
#
# Bu iş akışı YALNIZCA Worker kodunu ve statik varlıkları yayınlar.
# Bilinçli olarak YAPMADIKLARI:
#   - custom domain bağlamaz
#   - DNS kaydı oluşturmaz/değiştirmez
#   - TLS ayarı yapmaz
#   - GitHub Pages'i kapatmaz
# Bu adımlar cutover runbook'unda insan eliyle ve ayrı onayla yapılır.
#
# `deploy.yml` (GitHub Pages) hâlâ üretim yayın hattıdır ve bu dosya ona dokunmaz.
# İkisi aynı anda çalışabilir: Pages `pixelon.com.tr`'yi, bu iş akışı Worker'ı besler.
# Cutover ancak DNS custom domain'e çevrildiğinde gerçekleşir.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Üretim Worker'ına yayın yapmak için 'deploy' yazın"
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: workers-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Gate, Build & Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        # Yanlışlıkla tetiklemeye karşı kapı. Elle 'deploy' yazılmadan iş akışı ilerlemez.
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "Onay girdisi 'deploy' değil — çıkılıyor."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate (typecheck → format → lint → knip → test)
        run: bun run gate

      - name: Secret scan
        run: bun run secrets

      - name: Build
        run: bun run build

      - name: Generate redirect map
        run: bun run seo:redirects

      - name: Rebuild with generated redirects
        run: bun run build

      - name: Validate redirect and header maps
        run: |
          test -f dist/_redirects || { echo "dist/_redirects yok"; exit 1; }
          test -f dist/_headers   || { echo "dist/_headers yok";   exit 1; }
          if grep -q '\*' dist/_redirects; then echo "wildcard kuralı bulundu — beklenmiyor"; exit 1; fi
          if ! grep -q 'max-age=31536000, immutable' dist/_headers; then
            echo "asset cache kuralı eksik"; exit 1
          fi
          # Staging noindex kuralı üretim host'una uygulanmamalı: kural host bazlı olmalı.
          if grep -qE '^/\*' dist/_headers; then
            echo "host'suz genel kural bulundu — noindex üretime sızabilir"; exit 1
          fi
          echo "yönlendirme kuralı: $(grep -cE '^/' dist/_redirects)"

      - name: Dist smoke tests
        run: bun run test:dist

      - name: Deploy Worker
        # `wrangler.jsonc` içinde route/custom domain TANIMLI DEĞİL.
        # Bu komut yalnızca Worker'ı ve varlıklarını günceller; DNS'e dokunmaz.
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
